# Managed by @plainconceptsplatform/workflows. Source: loops/actions/housekeeping/action.yml. Update with workflows update --force; consumer edits may be overwritten.
name: Housekeeping
description: >-
  Retry work the machine stalled on, tidy the state it strands behind, and report what genuinely
  still needs a person. Deterministic: no model runs here.

inputs:
  token:
    description: Token with issues, pull-requests and contents write access.
    required: true
  retry-after-hours:
    description: How long an issue may sit stalled before it is retried.
    required: false
    default: '6'
  max-retries:
    description: How many times the janitor retries one issue before leaving it to a person.
    required: false
    default: '3'
  stale-pr-days:
    description: A bot pull request older than this with no CI verdict is reported, never closed.
    required: false
    default: '3'
  digest-title:
    description: Title of the single issue that reports what needs a human. Empty disables it.
    required: false
    default: 'Needs a human'
  dry-run:
    description: Compute everything and write nothing. Every intended change is printed.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Sweep
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RETRY_AFTER_HOURS: ${{ inputs.retry-after-hours }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        STALE_PR_DAYS: ${{ inputs.stale-pr-days }}
        DIGEST_TITLE: ${{ inputs.digest-title }}
        DRY_RUN: ${{ inputs.dry-run }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const dryRun = process.env.DRY_RUN === 'true';
          const retryAfterMs = Number(process.env.RETRY_AFTER_HOURS) * 3600 * 1000;
          const maxRetries = Number(process.env.MAX_RETRIES);
          const stalePrMs = Number(process.env.STALE_PR_DAYS) * 86400 * 1000;
          const digestTitle = process.env.DIGEST_TITLE;

          // Every write goes through this, so --dry-run is honest rather than hopeful: there is
          // no second path that forgets to check it.
          const planned = [];
          const act = async (what, run) => {
            planned.push(what);
            if (dryRun) { core.info(`[dry-run] ${what}`); return; }
            core.info(what);
            await run();
          };

          const RETRY_MARKER = '<!-- housekeeping-retry -->';
          const DIGEST_MARKER = '<!-- housekeeping-digest -->';
          const WORK_LABELS = ['implement', 'refine', 'triage'];
          const isBot = (login) => login.endsWith('[bot]') || login.startsWith('app/');
          const age = (iso) => Date.now() - new Date(iso).getTime();
          const days = (ms) => Math.floor(ms / 86400000);

          // 0. Cancel workflow runs stuck in "pending" for over an hour. The ARC fleet is two
          // VMs, and when it saturates, jobs sit pending indefinitely GitHub has no queue-time
          // timeout. A stuck pending implement or refine run holds a fleet slot that the retry
          // logic below can never free because the run never reaches a terminal state. This
          // cancel runs on a GitHub-hosted runner, so it works even when the fleet is full.
          //
          // Only a run with nothing live ahead of it. The router queues implement runs FIFO
          // (`queue: max`) so that labelling six issues at once implements all six, one after the
          // other, and each of those takes an hour: the sixth waits five hours legitimately. A
          // flat one-hour cutoff cancelled every run behind the first, which left its issue
          // carrying bot-working with no run until the sweep cleared it (Pliny-Bot #706 and #644,
          // both cancelled while #693 ran). A pending run is stuck when no run of its own kind
          // ("Agent: Implement", "Agent: Merge Gate") is running or queued to hold the group.
          const stuckCutoff = Date.now() - 3600 * 1000; // 1 hour ago
          const runKind = (run) => String(run.display_title || '').split(' - ')[0];
          const liveKinds = new Set();
          for (const status of ['in_progress', 'queued']) {
            for (const run of await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'work-router.yml',
              status, per_page: 50,
            })) liveKinds.add(runKind(run));
          }
          let cancelledRuns = 0;
          for (const run of await github.paginate(github.rest.actions.listWorkflowRuns, {
            owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'work-router.yml',
            status: 'pending', per_page: 50,
          })) {
            if (new Date(run.created_at).getTime() > stuckCutoff) continue;
            if (liveKinds.has(runKind(run))) {
              core.info(`run #${run.id} (${run.display_title}) waits behind a live ${runKind(run)} run; not stuck`);
              continue;
            }
            await act(`cancelling stuck pending run #${run.id} (queued ${new Date(run.created_at).toISOString()})`, async () => {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
              });
              cancelledRuns += 1;
            });
          }

          const issues = await github.paginate(github.rest.issues.listForRepo, {
            ...context.repo, state: 'open', per_page: 100,
          });
          const pulls = await github.paginate(github.rest.pulls.list, {
            ...context.repo, state: 'open', per_page: 100,
          });
          const names = (issue) => issue.labels.map((l) => (typeof l === 'string' ? l : l.name));

          // 0b. Clean orphaned bot-working labels. When a workflow run is cancelled (above) or
          // dies without clearing bot-working, the issue sits with bot-working + a work label
          // forever: no stalled marker, so the retry logic below never touches it. Find issues
          // with bot-working, check whether the most recent run for the linked operation is
          // still active, and if not, park the issue for retry.
          for (const issue of issues) {
            if (issue.pull_request) continue;
            const labels = names(issue);
            if (!labels.includes('bot-working')) continue;
            // Don't touch issues that already have stalled or review those are handled below.
            if (labels.includes('stalled') || labels.includes('review')) continue;
            const work = WORK_LABELS.find((l) => labels.includes(l));
            if (!work) continue;

            // An issue with bot-working should have a recent or active workflow run.
            // If bot-working has been on for longer than the retry window, the run is dead.
            const waited = age(issue.updated_at);
            if (waited < retryAfterMs) continue;

            await act(`#${issue.number}: releasing orphaned bot-working (parked ${Math.floor(waited / 3600000)}h with no active run)`, async () => {
              // Park it for retry: add stalled + review, remove bot-working.
              // The retry logic below will pick it up on the next sweep.
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number,
                labels: ['stalled', 'review'],
              });
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'bot-working' })
                .catch((error) => { if (error.status !== 404) throw error; });
            });
          }

          const needsHuman = [];
          // Gate telemetry. Every disposition the gate has ever posted is already on a pull
          // request, marked, so the rate costs one extra listing rather than a store.
          const dispositions = {};
          const autoMerged = [];
          const reverts = [];
          const metricsWindowMs = 14 * 24 * 3600000;
          // Stalled work still inside its retry window. Separate from needsHuman because nobody
          // needs to act on it yet, and reported anyway because the alternative is silence: the
          // window is 6 hours and the budget is 3 attempts, so an issue that keeps stalling was
          // invisible for eighteen hours before it surfaced as retries-exhausted. Watched that
          // happen to an audit report in the dogfood repository -- parked, and the digest said
          // one item while three issues were sitting there.
          const retrying = [];
          let retried = 0;

          // 1. Retry what the machine stalled on. `stalled` marks a park caused by a crash, a
          // timeout or an empty output; `review` alone is a decision the agent made, and
          // re-running a decision only reproduces it, so those are reported and never retried.
          for (const issue of issues) {
            if (issue.pull_request) continue;
            const labels = names(issue);
            // `stalled` alone is enough to be looked at. This used to require `review`, on the
            // assumption that a park always sets both, and an issue that ended up carrying
            // `stalled` without it fell through every branch below: never retried, never
            // reported, invisible. One sat that way for thirty hours in a consumer with
            // `implement` still on it and a janitor running every six hours past it. `stalled`
            // is the marker the retry keys on, so it is what decides whether to look.
            if (!labels.includes('review') && !labels.includes('stalled')) continue;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issue.number, per_page: 100,
            });
            const attempts = comments.filter((c) => (c.body ?? '').includes(RETRY_MARKER)).length;
            const work = WORK_LABELS.find((l) => labels.includes(l));
            const waited = age(issue.updated_at);

            if (!labels.includes('stalled')) {
              needsHuman.push({ kind: 'decided', issue, labels, waited });
              continue;
            }
            if (waited < retryAfterMs) {
              retrying.push({ issue, waited, attempts, work, due: retryAfterMs - waited });
              continue;
            }
            if (attempts >= maxRetries || !work) {
              needsHuman.push({ kind: attempts >= maxRetries ? 'retries-exhausted' : 'no-work-label', issue, labels, waited, attempts });
              continue;
            }

            await act(`#${issue.number}: retrying ${work} (attempt ${attempts + 1} of ${maxRetries}, stalled ${Math.floor(waited / 3600000)}h)`, async () => {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `${RETRY_MARKER}\nThis issue stalled rather than reaching a decision, so it is being retried automatically: attempt ${attempts + 1} of ${maxRetries}. If it stalls ${maxRetries} times it stays parked for a person.`,
              });
              // Removing the labels is what lets it route again; the work label is already there.
              for (const label of ['review', 'stalled']) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: label })
                  .catch((error) => { if (error.status !== 404) throw error; });
              }
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'work-router.yml',
                ref: context.payload.repository.default_branch,
                inputs: { operation: work, 'issue-number': String(issue.number) },
              });
            });
            retried += 1;
          }

          // 2. Strands. pr-pending says a pull request is open and waiting; when that pull request
          // closed without merging, nothing ever took the label off.
          for (const issue of issues) {
            if (issue.pull_request || !names(issue).includes('pr-pending')) continue;
            const linked = pulls.some((p) => new RegExp(`(clos(e|es|ed)|fix(es|ed)?|resolves?)\\s+#${issue.number}\\b`, 'i').test(p.body ?? ''));
            if (linked) continue;
            await act(`#${issue.number}: removing pr-pending, no open pull request closes it`, () =>
              github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'pr-pending' })
                .catch((error) => { if (error.status !== 404) throw error; }));
          }

          // 3. Split parents. Refine leaves the parent open as a tracker and nothing has ever
          // closed one: once every child is done the parent sits there for ever with an unticked
          // checklist. Children carry `<!-- split-parent: N -->`, which is the only machine-
          // readable link between them.
          const childrenOf = new Map();
          for (const issue of await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'all', per_page: 100 })) {
            const match = /<!-- split-parent: (\d+) -->/.exec(issue.body ?? '');
            if (!match || issue.pull_request) continue;
            const parent = Number(match[1]);
            if (!childrenOf.has(parent)) childrenOf.set(parent, []);
            childrenOf.get(parent).push(issue);
          }
          for (const [parent, children] of childrenOf) {
            const open = children.filter((c) => c.state === 'open');
            if (open.length > 0 || !issues.some((i) => i.number === parent)) continue;
            // A stack feature issue. Its root pull request closing the issue is what ends it, not
            // this sweep: closing the tracker here would close a feature whose root pull request
            // is still open and holding a branch with real work on it. Refine stamps the root
            // markers on the parent before the first child is ever handed over, so the marker
            // is there from birth; finding none means flat mode, and the original rule applies.
            // Everything stack-specific about these parents is decided in section 3b below,
            // which sees the whole stack, not just the child count.
            if (issues.some((i) => i.number === parent && /<!-- stack-root-branch: \S+ -->/.test(i.body ?? ''))) continue;
            await act(`#${parent}: closing split parent, all ${children.length} children are done`, async () => {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: parent,
                body: `${DIGEST_MARKER}\nClosed automatically: every child of this split is closed (${children.map((c) => `#${c.number}`).join(', ')}).`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: parent, state: 'closed', state_reason: 'completed' });
            });
          }

          // The stack and branch sections both need every pull request the repository has ever
          // seen, closed included, so it is paginated once here rather than once per section.
          const allPulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'all', per_page: 100 });

          // 3b. Stacks. Section 3 refused to close stack feature issues; this is what happens to
          // them instead. The whole stack state is on the feature issue (root pull request) plus
          // the children of the split, and both are already in memory, so a repository without
          // stacks pays nothing: the marker test below fails first and the loop body never runs.
          // No polling is added -- this runs on the same cadence the janitor already has, and it
          // is the backstop for the one event the router can miss: a child issue that closes
          // seconds after a router run already counted it as open.
          for (const issue of issues) {
            if (issue.pull_request) continue;
            const marker = /<!-- stack-root-pr: (\d+) -->/.exec(issue.body ?? '');
            if (!marker) continue;
            const rootPr = Number(marker[1]);
            const root = allPulls.find((p) => p.number === rootPr);
            const children = childrenOf.get(issue.number) ?? [];
            // A child only means work in progress while its pull request is still open.
            // merge-gate closes the child issue the moment its pull request lands on the
            // feature branch; if that close was lost -- an API blip, a run that died between
            // the merge and the close -- the child stays open here for ever and the stack
            // never reads as finished, which is the stall this sweep exists to prevent. The
            // child's own `implement-pr` marker names its pull request, so the test is exact:
            // an open child whose named pull request has merged has landed, whatever its issue
            // state still claims. Closing it here is the same idempotent backstop section 3 is
            // for flat splits, and the App token this sweep runs on is what raises the event.
            let openChildren = 0;
            for (const child of children) {
              if (child.state !== 'open') continue;
              const prMarker = /<!-- implement-pr: (\d+) -->/.exec(child.body ?? '');
              const landed = prMarker && allPulls.some((p) => p.number === Number(prMarker[1]) && p.merged_at);
              if (!landed) { openChildren += 1; continue; }
              await act(`#${child.number}: closing child, its pull request #${prMarker[1]} merged into the stack`, async () => {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: child.number,
                  body: `${DIGEST_MARKER}\nClosed automatically: its pull request #${prMarker[1]} merged into the feature branch, so this child is done.`,
                });
                await github.rest.issues.update({ ...context.repo, issue_number: child.number, state: 'closed', state_reason: 'completed' });
              });
            }
            if (!root) {
              needsHuman.push({ kind: 'stack-root-missing', issue, rootPr, waited: age(issue.updated_at) });
            } else if (root.state === 'open') {
              if (openChildren > 0) continue; // mid-stack: the normal state, not worth a line
              // Every child is done, so the completion announcement should exist on the root
              // pull request. Its absence is the lost race above; a person is told here rather
              // than the stack sitting finished and silent. When the announcement exists but
              // nobody has merged for days, that is staleness worth one line too.
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: rootPr, per_page: 100,
              });
              const told = comments.find((c) => (c.body ?? '').includes('<!-- stack-complete -->'));
              if (!told) {
                needsHuman.push({ kind: 'stack-ready', issue, pull: root, waited: age(issue.updated_at) });
              } else if (age(told.created_at) > stalePrMs) {
                needsHuman.push({ kind: 'stack-held', issue, pull: root, waited: age(told.created_at) });
              }
            } else if (root.merged_at) {
              // The root merged to the default branch and its closing keyword should have
              // closed this issue with it. If something raced that, the same rule section 3
              // applies to flat splits closes it here: every child done, root landed, done.
              if (openChildren === 0) {
                await act(`#${issue.number}: closing stack feature, its root PR #${rootPr} merged`, async () => {
                  await github.rest.issues.createComment({
                    ...context.repo, issue_number: issue.number,
                    body: `${DIGEST_MARKER}\nClosed automatically: the stack's root pull request #${rootPr} merged with every child landed (${children.map((c) => `#${c.number}`).join(', ')}).`,
                  });
                  await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
                });
              } else {
                needsHuman.push({ kind: 'stack-orphaned', issue, pull: root, waited: age(root.merged_at), openChildren });
              }
            } else {
              // Closed without merging. That is a person's decision or an accident, and the
              // landed child work only exists on the feature branch, which section 4 may have
              // already deleted -- restorable through refs/pull/<n>/head, but a person decides.
              needsHuman.push({ kind: 'stack-root-closed', issue, pull: root, waited: age(root.closed_at), openChildren });
            }
          }

          // 4. Branches. Nothing in the fleet has ever deleted one, so they accumulate for ever
          // after a merge and after a close alike. Only ever touch a branch whose pull request is
          // finished; never the default branch, and never one with a pull request still open.
          //
          // Deleting the branch of a pull request that closed WITHOUT merging does not throw the
          // work away: GitHub keeps `refs/pull/<n>/head` for the life of the pull request, which
          // is what its own "Restore branch" button restores from. Verified on this fleet --
          // after the first sweep removed six branches, every one of their pull requests still
          // resolved through that ref. So `git fetch origin pull/<n>/head` brings any of this
          // back, and the pull request page still shows the diff.
          const branches = await github.paginate(github.rest.repos.listBranches, { ...context.repo, per_page: 100 });
          const defaultBranch = context.payload.repository.default_branch;
          const byHead = new Map();
          for (const pull of allPulls) {
            if (!byHead.has(pull.head.ref)) byHead.set(pull.head.ref, []);
            byHead.get(pull.head.ref).push(pull);
          }
          for (const branch of branches) {
            if (branch.name === defaultBranch) continue;
            const forBranch = byHead.get(branch.name) ?? [];
            if (forBranch.length === 0) continue;                       // never opened a PR: not ours to judge
            if (forBranch.some((p) => p.state === 'open')) continue;    // still in use
            if (!forBranch.every((p) => isBot(p.user?.login ?? ''))) continue;
            const merged = forBranch.some((p) => p.merged_at);
            await act(`branch ${branch.name}: deleting (${merged ? 'merged' : 'closed unmerged'})`, () =>
              github.rest.git.deleteRef({ ...context.repo, ref: `heads/${branch.name}` })
                .catch((error) => { if (error.status !== 404 && error.status !== 422) throw error; }));
          }

          // 5. Pull requests that need a person: parked by a gate verdict, or old with no CI.
          for (const pull of pulls) {
            if (!isBot(pull.user?.login ?? '')) continue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pull.number, per_page: 100,
            });
            const verdict = [...comments].reverse().find((c) => (c.body ?? '').includes('<!-- agent-merge-gate -->') && (c.body ?? '').includes('**Verdict:**'));
            const parsed = verdict ? /\*\*Verdict:\*\*\s*([\w-]+)/.exec(verdict.body)?.[1] : undefined;
            // The gate's dispositions are auto-merge, human-review, owner-review and blocked.
            // Only the first needs nobody. The character class has to allow the hyphen or every
            // disposition reads as the bare word "auto" or "human" and nothing matches.
            if (parsed) dispositions[parsed] = (dispositions[parsed] ?? 0) + 1;
            if (parsed && parsed !== 'auto-merge') {
              needsHuman.push({ kind: 'pr-parked', pull, verdict: parsed, waited: age(verdict.created_at) });
            } else if (!verdict && age(pull.created_at) > stalePrMs) {
              needsHuman.push({ kind: 'pr-stale', pull, waited: age(pull.created_at) });
            }
          }

          // 5b. The one number this whole gate exists to move. Open pull requests alone would
          // only ever count the parked ones, because an auto-merged pull request closes within
          // seconds of its verdict, so the rate would read as zero forever. Closed pull requests
          // from the digest window are where the merges are.
          for (const pull of await github.paginate(github.rest.pulls.list, {
            ...context.repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100,
          })) {
            if (age(pull.updated_at) > metricsWindowMs) break;
            // A revert names the pull request it undoes, which is how an escaped defect is
            // attributed back to the disposition that let it through. Reverts are frequently
            // opened by a person, so this one line sits above the bot filter.
            if (pull.merged_at) {
              const undone = /revert .*#(\d+)/i.exec(pull.title ?? '');
              if (undone) reverts.push(Number(undone[1]));
            }
            if (!isBot(pull.user?.login ?? '')) continue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pull.number, per_page: 100,
            });
            const verdict = [...comments].reverse().find((c) => (c.body ?? '').includes('<!-- agent-merge-gate -->') && (c.body ?? '').includes('**Verdict:**'));
            const parsed = verdict ? /\*\*Verdict:\*\*\s*([\w-]+)/.exec(verdict.body)?.[1] : undefined;
            if (parsed) dispositions[parsed] = (dispositions[parsed] ?? 0) + 1;
            // An auto-merge followed by a revert is the number that has to stay at zero while
            // the rate climbs. Anything else is a rate bought with escaped defects.
            if (parsed === 'auto-merge' && pull.merged_at) autoMerged.push(pull.number);
          }

          // 6. One digest. Everything above either fixed itself or is listed here, so there is a
          // single place to look instead of four repositories and three label queries.
          // Audit reports nobody actioned. audit-close labels these `stale-audit` once they are
          // past their budget, which frees the audit's backpressure slot. Freeing the slot
          // without listing the report anywhere would only move the silence, so they land here.
          for (const issue of issues) {
            if (issue.pull_request) continue;
            if (!names(issue).includes('stale-audit')) continue;
            needsHuman.push({ kind: 'stale-audit', issue, waited: age(issue.created_at) });
          }

          const line = (entry) => {
            if (entry.kind === 'pr-parked') return `- PR #${entry.pull.number} · parked ${days(entry.waited)}d · gate verdict \`${entry.verdict}\` · ${entry.pull.title}`;
            if (entry.kind === 'pr-stale') return `- PR #${entry.pull.number} · ${days(entry.waited)}d old · no gate verdict yet · ${entry.pull.title}`;
            if (entry.kind === 'stack-ready') return `- PR #${entry.pull.number} · stack finished ${days(entry.waited)}d ago, never announced · human merge needed · ${entry.pull.title}`;
            if (entry.kind === 'stack-held') return `- PR #${entry.pull.number} · stack ready and waiting on a human merge for ${days(entry.waited)}d · ${entry.pull.title}`;
            if (entry.kind === 'stack-root-missing') return `- #${entry.issue.number} · names root PR #${entry.rootPr}, which does not exist · ${entry.issue.title}`;
            if (entry.kind === 'stack-root-closed') return `- PR #${entry.pull.number} · stack root closed unmerged, ${entry.openChildren} child(ren) still open · ${entry.issue.title} · restore the branch from refs/pull/${entry.pull.number}/head if accidental`;
            if (entry.kind === 'stack-orphaned') return `- #${entry.issue.number} · root merged but ${entry.openChildren} child(ren) still open · ${entry.issue.title}`;
            if (entry.kind === 'retries-exhausted') return `- #${entry.issue.number} · stalled ${days(entry.waited)}d · retried ${entry.attempts}× and still stalling · ${entry.issue.title}`;
            if (entry.kind === 'no-work-label') return `- #${entry.issue.number} · stalled ${days(entry.waited)}d · no work label to retry with · ${entry.issue.title}`;
            if (entry.kind === 'stale-audit') return `- #${entry.issue.number} · open ${days(entry.waited)}d · audit report nobody actioned · ${entry.issue.title}`;
            return `- #${entry.issue.number} · waiting ${days(entry.waited)}d · ${entry.labels.filter((l) => l !== 'review').join(', ') || 'no other labels'} · ${entry.issue.title}`;
          };
          const section = (heading, kinds) => {
            const rows = needsHuman.filter((e) => kinds.includes(e.kind));
            return rows.length === 0 ? '' : `\n### ${heading} (${rows.length})\n\n${rows.map(line).join('\n')}\n`;
          };
          // Listed, but not as something to act on: the machine is going to try again by itself.
          // The heading says so, because a reader who acts on these duplicates the retry.
          const retryingSection = () => {
            if (retrying.length === 0) return '';
            const hours = (ms) => Math.max(1, Math.round(ms / 3600000));
            const rows = retrying.map((entry) =>
              `- #${entry.issue.number} · stalled ${hours(entry.waited)}h ago · attempt ${entry.attempts + 1} of ${maxRetries} due in ~${hours(entry.due)}h · ${entry.issue.title}`);
            return `\n### Retrying by itself, no action needed (${retrying.length})\n\n${rows.join('\n')}\n`;
          };
          // The gate's own scoreboard. A digest that lists only what went wrong tells you
          // nothing about whether the thing is getting better.
          const gateSection = () => {
            const total = Object.values(dispositions).reduce((a, b) => a + b, 0);
            if (total === 0) return '';
            const auto = dispositions['auto-merge'] ?? 0;
            const rate = Math.round((auto / total) * 100);
            const rows = Object.entries(dispositions)
              .sort((a, b) => b[1] - a[1])
              .map(([name, count]) => `- \`${name}\` · ${count}`);
            const reverted = autoMerged.filter((number) => reverts.includes(number)).length;
            return `\n### Merge gate, last ${metricsWindowMs / (24 * 3600000)} days\n\n` +
              `**${rate}% auto-merged** (${auto} of ${total} dispositions).\n\n${rows.join('\n')}\n\n` +
              `Auto-merged pull requests later reverted: ${reverted}.\n`;
          };
          const body = [
            DIGEST_MARKER,
            `_Updated ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC. This issue is rewritten by the housekeeping job; edits to it are lost._`,
            section('Waiting on a decision', ['decided']),
            section('Stacked features waiting on a human', ['stack-ready', 'stack-held', 'stack-root-missing', 'stack-root-closed', 'stack-orphaned']),
            section('Pull requests parked by the gate', ['pr-parked', 'pr-stale']),
            section('Stalled beyond the retry budget', ['retries-exhausted', 'no-work-label']),
            section('Audit reports nobody actioned', ['stale-audit']),
            retryingSection(),
            gateSection(),
            needsHuman.length === 0 ? '\nNothing is waiting on a person right now.\n' : '',
            `\n---\n\nThis run retried ${retried} stalled issue(s) and made ${planned.length} change(s) in total.`,
          ].filter(Boolean).join('\n');

          if (digestTitle) {
            // The digest exists whenever there is anything to show, including work the machine is
            // about to retry. Gating it on needsHuman alone is what left three parked issues
            // with a digest that named one.
            const anythingToShow = needsHuman.length + retrying.length;
            const existing = issues.find((i) => !i.pull_request && i.title === digestTitle && (i.body ?? '').includes(DIGEST_MARKER));
            if (existing) {
              if (anythingToShow === 0) {
                await act(`closing the digest #${existing.number}: nothing is waiting`, () =>
                  github.rest.issues.update({ ...context.repo, issue_number: existing.number, body, state: 'closed', state_reason: 'completed' }));
              } else {
                await act(`updating the digest #${existing.number}: ${anythingToShow} item(s)`, () =>
                  github.rest.issues.update({ ...context.repo, issue_number: existing.number, body }));
              }
            } else if (anythingToShow > 0) {
              await act(`opening the digest: ${anythingToShow} item(s)`, () =>
                github.rest.issues.create({ ...context.repo, title: digestTitle, body }));
            }
          }

          // The merge train wakes when a CI run finishes. When a gate it was waiting on ends without
          // one, or is cancelled, nothing calls it again and every pull request sits until the next
          // CI event: Pliny-Bot had four green pull requests waiting on that for the better part of an
          // hour. The hourly sweep is the heartbeat. A dispatch of the router by the workflow token is
          // allowed to start a run, and a tick with nothing to do costs one short job.
          const openPulls = pulls.filter((pr) => !pr.draft);
          if (openPulls.length > 0) {
            await act(`dispatching a merge train tick: ${openPulls.length} pull request(s) are open`, () =>
              github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'work-router.yml',
                ref: context.payload.repository?.default_branch ?? 'main',
                inputs: { operation: 'merge-train' },
              }));
          }

          await core.summary
            .addHeading('Housekeeping', 2)
            .addList([
              `Cancelled stuck pending runs: ${cancelledRuns}`,
              `Retried: ${retried}`,
              `Waiting on a person: ${needsHuman.length}`,
              `Stalled, retrying by itself: ${retrying.length}`,
              `Changes ${dryRun ? 'planned' : 'made'}: ${planned.length}`,
            ])
            .addRaw(planned.length ? `\n\n${planned.map((p) => `- ${p}`).join('\n')}` : '')
            .write();
