# Managed by @plainconceptsplatform/workflows. Source: loops/actions/capture-evidence/action.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: Capture evidence
description: >
  Reads a pull request's verification plans (written by the harness skill pc-repo-verify) and,
  in capture mode, replays them in headless Chromium against the running app, writing one JPEG
  per waypoint plus manifest.json and comment.md. Inspect mode only reports whether any plan is
  replayable, at which address, and with which start command. No model, no network beyond
  installing its two pinned packages.
inputs:
  mode:
    description: inspect, capture, or unreached (the app never answered; record why and stop).
    required: true
  root:
    description: Checkout of the pull request head the plans are read from.
    required: true
  plans:
    description: Newline-separated plan paths relative to root.
    required: true
  out-dir:
    description: Where capture and unreached write the screenshots, manifest.json and comment.md.
    required: false
    default: ''
  playwright-version:
    description: playwright-core version. Must match the Chromium libraries baked into the runner image.
    required: false
    default: '1.62.1'
  yaml-version:
    description: yaml package version.
    required: false
    default: '2.9.0'
outputs:
  runnable:
    description: inspect only. true when at least one plan has a journey to replay.
    value: ${{ steps.run.outputs.runnable }}
  url:
    description: inspect only. The address the first replayable plan expects the app at.
    value: ${{ steps.run.outputs.url }}
  start:
    description: inspect only. The start command the first replayable plan names, empty for the default.
    value: ${{ steps.run.outputs.start }}
runs:
  using: composite
  steps:
    - name: Install the plan runner
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
        YAML_VERSION: ${{ inputs.yaml-version }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        runner="$RUNNER_TEMP/capture-evidence"
        mkdir -p "$runner"
        # A copy beside its node_modules: ESM resolves bare imports from the file's own
        # directory, never from NODE_PATH, so the script cannot run from the action folder.
        cp "$ACTION_DIR/capture.mjs" "$runner/capture.mjs"
        if [ ! -d "$runner/node_modules/playwright-core" ] || [ ! -d "$runner/node_modules/yaml" ]; then
          npm install --prefix "$runner" --no-save --no-package-lock --no-audit --no-fund \
            "playwright-core@${PLAYWRIGHT_VERSION}" "yaml@${YAML_VERSION}"
        fi
        if [ "$MODE" = "capture" ]; then
          # The headless shell only: the runner image carries Chromium's system libraries and the
          # runner user has no sudo, so this is the one install that works at job time.
          node "$runner/node_modules/playwright-core/cli.js" install --only-shell chromium
        fi

    - name: Run the plans
      id: run
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ROOT: ${{ inputs.root }}
        PLANS: ${{ inputs.plans }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        runner="$RUNNER_TEMP/capture-evidence"
        mapfile -t plans < <(printf '%s\n' "$PLANS" | sed '/^[[:space:]]*$/d')
        if [ "${#plans[@]}" -eq 0 ]; then
          echo "::error::no plan paths were given"
          exit 1
        fi
        case "$MODE" in
          inspect)
            report="$(node "$runner/capture.mjs" inspect "$ROOT" "${plans[@]}")"
            echo "$report"
            {
              echo "runnable=$(jq -r '.runnable' <<<"$report")"
              echo "url=$(jq -r '.url' <<<"$report")"
              echo "start=$(jq -r '.start' <<<"$report")"
            } >> "$GITHUB_OUTPUT"
            ;;
          capture | unreached)
            [ -n "$OUT_DIR" ] || { echo "::error::$MODE needs out-dir"; exit 1; }
            node "$runner/capture.mjs" "$MODE" "$ROOT" "$OUT_DIR" "${plans[@]}"
            ;;
          *)
            echo "::error::unknown mode '$MODE'"
            exit 1
            ;;
        esac
