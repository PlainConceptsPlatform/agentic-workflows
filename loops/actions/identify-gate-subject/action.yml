# Managed by @plainconceptsplatform/workflows. Source: loops/actions/identify-gate-subject/action.yml. Update with workflows update --force; consumer edits may be overwritten.
name: Identify gate subject
description: Confirm the pull request is one the gate may act on, resolve the issue it closes, and check a bot pull request's issue carries the required label.
inputs:
  token:
    description: GitHub token with issues and pull-requests read access.
    required: true
  trusted-bots:
    description: Space-separated bot logins whose pull requests the gate gates. Anyone else needs write access.
    required: false
    default: ''
  pr-number:
    description: Pull request number to gate.
    required: true
  ci-conclusion:
    description: Conclusion reported by the CI run that triggered this gate. If empty, fetches from the PR's latest CI run.
    required: false
    default: ''
  ci-run-id:
    description: CI run ID reported by the run that triggered this gate. If empty, resolved from the PR's latest CI run.
    required: false
    default: ''
  linked-issue:
    description: Issue the pull request closes, when the router already resolved it.
    required: false
    default: ''
  require-label:
    description: Label a bot pull request's closing issue must carry. Empty disables the check. A person's pull request needs neither an issue nor the label.
    required: false
    default: ''
outputs:
  found:
    description: Whether a valid gate subject was found.
    value: ${{ steps.identify.outputs.found }}
  pr:
    description: Pull request number.
    value: ${{ steps.identify.outputs.pr }}
  issue:
    description: Issue number the pull request closes. Empty for a person's pull request that closes none.
    value: ${{ steps.identify.outputs.issue }}
  record:
    description: Where the gate writes its verdict and labels. The issue when there is one, otherwise the pull request.
    value: ${{ steps.identify.outputs.record }}
  head-ref:
    description: The pull request's head branch, the only branch the gate may push to.
    value: ${{ steps.identify.outputs.head-ref }}
  conclusion:
    description: CI conclusion, passed through unchanged or fetched from latest CI run.
    value: ${{ steps.identify.outputs.conclusion }}
  run-id:
    description: CI run ID when fetched.
    value: ${{ steps.identify.outputs.run-id }}
runs:
  using: composite
  steps:
    - name: Identify pull request and closing issue
      id: identify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CONCLUSION: ${{ inputs.ci-conclusion }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
        LINKED_ISSUE: ${{ inputs.linked-issue }}
        REQUIRE_LABEL: ${{ inputs.require-label }}
        TRUSTED_BOTS: ${{ inputs.trusted-bots }}
      run: |
        set -euo pipefail

        none() {
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "$1"
          exit 0
        }

        pr="$(gh pr view "$PR_NUMBER" --repo "$REPO" \
          --json state,author,closingIssuesReferences,body,isCrossRepository,headRefName)"

        [ "$(jq -r '.state' <<<"$pr")" = "OPEN" ] || none "PR #$PR_NUMBER is not open"

        # The gate checks out the branch, runs the repository's commands on it and pushes to it,
        # with secrets. A fork's branch is someone else's code: never.
        [ "$(jq -r '.isCrossRepository' <<<"$pr")" = "false" ] || none "PR #$PR_NUMBER comes from a fork"

        # A bot this repository trusts, or a person with write access, who could push the same
        # branch themselves. GraphQL spells a GitHub App `app/<name>`, REST `<name>[bot]`.
        author="$(jq -r '.author.login' <<<"$pr")"
        bot=false
        if [ "$(jq -r '.author.is_bot // false' <<<"$pr")" = "true" ]; then
          for candidate in "$author" "${author#app/}[bot]"; do
            case " $TRUSTED_BOTS " in *" $candidate "*) bot=true ;; esac
          done
          [ "$bot" = true ] || none "PR #$PR_NUMBER was opened by $author, a bot this repository does not trust"
        else
          permission="$(gh api "repos/$REPO/collaborators/$author/permission" --jq '.permission' 2>/dev/null || echo none)"
          case "$permission" in
            admin | maintain | write) ;;
            *) none "PR #$PR_NUMBER was opened by $author, who has $permission access" ;;
          esac
        fi

        issue="$LINKED_ISSUE"

        if [ -z "$issue" ]; then
          issue="$(jq -r '.closingIssuesReferences[0].number // empty' <<<"$pr")"
        fi

        if [ -z "$issue" ]; then
          issue="$(jq -r '.body // ""' <<<"$pr" |
            grep -oiE '(close[sd]?|fixe?[sd]?|resolve[sd]?) +#[0-9]+' |
            grep -oE '[0-9]+' | head -n 1 || true)"
        fi

        # The bot only opens a pull request for an issue it was given, so one that closes none, or
        # whose issue lost the label, is not work the gate was handed. A person's pull request is
        # gated on its own description when it closes nothing.
        if [ "$bot" = true ]; then
          [ -n "$issue" ] || none "PR #$PR_NUMBER does not close a numbered issue"
        fi

        if [ "$bot" = true ] && [ -n "$REQUIRE_LABEL" ]; then
          labels="$(gh issue view "$issue" --repo "$REPO" --json labels \
            --jq '[.labels[].name]')"

          if ! jq -e --arg name "$REQUIRE_LABEL" 'index($name)' >/dev/null <<<"$labels"; then
            none "issue #$issue does not carry $REQUIRE_LABEL (has: $(jq -r 'join(", ")' <<<"$labels"))"
          fi
        fi

        # The run ID is what lets the gate read the failing job and its logs, so it has to be
        # resolved on every path -- not only the label-triggered one. It used to be set inside
        # `if [ -z "$ci_conclusion" ]`, which meant the caller that *knew* the ID got an empty
        # one: the router passes ci-conclusion and ci-run-id together, so the branch was skipped
        # and the value discarded. The gate then wrote `failed-jobs.json` as `[]`, and the agent,
        # with no failing job name and no logs, escalated to `review`. Pliny-Bot #129 and #131
        # both stalled on a human that way while CI was legitimately red and remediable.
        ci_conclusion="$CONCLUSION"
        ci_run_id="$CI_RUN_ID"
        if [ -z "$ci_conclusion" ] || [ -z "$ci_run_id" ]; then
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          # A run keeps the name it had when it ran, so a repository whose CI was renamed still
          # carries runs under the old casing. Fold the name before comparing.
          ci_run="$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100"             --jq '[.workflow_runs[] | select((.name | ascii_downcase) == "app: ci" or (.name | ascii_downcase) == "ci")] | sort_by(.created_at) | last')"

          if [ -n "$ci_run" ] && [ "$ci_run" != "null" ]; then
            [ -n "$ci_conclusion" ] || ci_conclusion="$(jq -r '.conclusion // "pending"' <<<"$ci_run")"
            [ -n "$ci_run_id" ] || ci_run_id="$(jq -r '.id' <<<"$ci_run")"
            echo "::notice::Resolved CI status: $ci_conclusion (run $ci_run_id)"
          elif [ -z "$ci_conclusion" ]; then
            ci_conclusion="unknown"
            echo "::warning::No CI run found for PR #$PR_NUMBER"
          else
            echo "::warning::CI concluded $ci_conclusion but no run was found for PR #$PR_NUMBER; the gate has no failure evidence"
          fi
        fi

        {
          echo "found=true"
          echo "pr=$PR_NUMBER"
          echo "issue=$issue"
          echo "record=${issue:-$PR_NUMBER}"
          echo "head-ref=$(jq -r '.headRefName' <<<"$pr")"
          echo "conclusion=$ci_conclusion"
          echo "run-id=$ci_run_id"
        } >> "$GITHUB_OUTPUT"

        echo "PR #$PR_NUMBER by $author closes #${issue:-nothing}; CI concluded $ci_conclusion"
