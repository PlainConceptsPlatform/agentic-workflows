# Managed by @plainconceptsplatform/workflows. Source: loops/actions/validate-merge-gate-output/action.yml. Update with workflows update --force; consumer edits may be overwritten.
name: Validate merge-gate output
description: Compute the merge-gate disposition from measured facts and the agent's structured report, before any state changes.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  issue-number:
    description: Issue number that the merge-gate report must target.
    required: true
  ci-conclusion:
    description: CI conclusion supplied to the merge gate.
    required: true
  blast-level:
    description: "Measured blast radius: low, medium or high."
    required: false
    default: low
  protected-hit:
    description: Whether a protected path was touched.
    required: false
    default: 'false'
  owner-hit:
    description: Whether an owner path was touched.
    required: false
    default: 'false'
  confidence-threshold:
    description: Agent confidence below which the pull request goes to a human.
    required: false
    default: '0.8'
  code-rules:
    description: "check-diff result on the pull request: pass, fail or absent. Empty means it did not report."
    required: false
    default: absent
  unattended:
    description: "true lets a judgement call (low confidence, unmet acceptance criteria, hard to undo) merge instead of going to a person. Facts the workflow measured still hold the pull request."
    required: false
    default: 'false'
outputs:
  flags:
    description: "What an unattended merge accepted, on one line, for the pull request and the final report. Empty when nothing was."
    value: ${{ steps.validate.outputs.flags }}
  valid:
    description: Whether the output produced a usable disposition.
    value: ${{ steps.validate.outputs.valid }}
  outcome:
    description: "Disposition: auto-merge, human-review, owner-review, blocked, remediated, or invalid."
    value: ${{ steps.validate.outputs.outcome }}
  pushed:
    description: Whether the agent proposed a push to the pull request branch, applied or not.
    value: ${{ steps.validate.outputs.pushed }}
  empty:
    description: Whether the agent produced no safe output at all, which is a run that quit, not a report that was refused.
    value: ${{ steps.validate.outputs.empty }}
runs:
  using: composite
  steps:
    - name: Compute the merge-gate disposition
      id: validate
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        CI_CONCLUSION: ${{ inputs.ci-conclusion }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        BLAST_LEVEL: ${{ inputs.blast-level }}
        PROTECTED_HIT: ${{ inputs.protected-hit }}
        OWNER_HIT: ${{ inputs.owner-hit }}
        CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
        CODE_RULES: ${{ inputs.code-rules }}
        UNATTENDED: ${{ inputs.unattended }}
      run: |
        set -euo pipefail

        outcome="$(bash "${{ github.action_path }}/validate-merge-gate-output.sh" \
          "$OUTPUT_FILE" "$ISSUE_NUMBER" "$CI_CONCLUSION" \
          "$BLAST_LEVEL" "$PROTECTED_HIT" "$OWNER_HIT" "$CONFIDENCE_THRESHOLD" "$CODE_RULES" "$UNATTENDED")"
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

        # What the unattended merge let through, named so the person reading the report later knows
        # where to look. It is read from the same report the decision used, never from the prose.
        flags=""
        if [ "$UNATTENDED" = true ] && [ "$outcome" = auto-merge ]; then
          flags=$(jq -r --arg threshold "$CONFIDENCE_THRESHOLD" --arg blast "$BLAST_LEVEL" '
            [.items[]? | select(.type == "add_comment") | .body | strings
              | [scan("```json\\s*(.*?)```"; "m") | .[0]] | last | select(. != null) | fromjson?] | last // {}
            | [ (if (.confidence // 1) < ($threshold | tonumber) then "confidence \(.confidence)" else empty end),
                (if .acceptanceCriteriaMet == false then "acceptance criteria reported unmet" else empty end),
                (if ((.recoverability // "") | ascii_downcase) == "low" then "hard to undo" else empty end),
                (if $blast == "medium" then "medium blast radius" else empty end) ]
            | join("; ")' "$OUTPUT_FILE" 2>/dev/null || true)
        fi
        echo "flags=$flags" >> "$GITHUB_OUTPUT"
        echo "valid=$([ "$outcome" != 'invalid' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        pushed=$(jq -r '[.items[]? | select(.type == "push_to_pull_request_branch")] | length > 0' "$OUTPUT_FILE" 2>/dev/null || echo false)
        echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
        items=$(jq -r '[.items[]?] | length' "$OUTPUT_FILE" 2>/dev/null || echo 0)
        echo "empty=$([ "${items:-0}" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

        if [ "$outcome" = 'invalid' ]; then
          echo "::warning::Agent output has no usable merge-gate report. It will not be applied."
        fi
