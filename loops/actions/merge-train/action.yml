# Managed by @plainconceptsplatform/workflows. Source: loops/actions/merge-train/action.yml. Update with workflows update --force; consumer edits may be overwritten.
name: Merge train
description: >-
  Move the oldest open pull request that can move one step towards merging (update it from its
  base, hand it to the merge gate, or approve its CI), and leave every other one alone.
  Deterministic: no model runs here.

inputs:
  token:
    description: App token. Its dispatches and branch updates must start workflows, which GITHUB_TOKEN's do not.
    required: true
  ci-workflow-name:
    description: The CI workflow whose verdict the train reads.
    required: true
  trusted-bots:
    description: Space-separated bot logins whose pull requests ride the train and whose CI runs it approves.
    required: false
    default: ''
  hold-label:
    description: A pull request carrying this label stays off the train.
    required: false
    default: hold
  max-gate-attempts:
    description: Failed gate attempts on one head before the train stops dispatching it.
    required: false
    default: '6'
  max-retries:
    description: How many times a blocked verdict, or a merge that did not happen, is retried after the base branch moves.
    required: false
    default: '3'
  stack-root-automerge:
    description: A stack root whose children have all landed is merged by the gate like any other pull request, unless its blast radius or a finding sends it to a person. false keeps every root for a human.
    required: false
    default: 'true'
  max-repairs:
    description: How many pull requests may be in repair at once. Merges stay one at a time.
    required: false
    default: '1'
  main-red-wait-hours:
    description: >-
      How long the train waits for a base branch whose checks fail the same way as a pull request's
      before it stops waiting and repairs the pull request anyway.
    required: false
    default: '2'
  stuck-hours:
    description: How long the train waits behind a CI run that never finishes before it passes that pull request by.
    required: false
    default: '3'
  dry-run:
    description: Decide and report the move without making it.
    required: false
    default: 'false'
  ci-depth-tiered:
    description: "true when the repository's CI runs only light checks on a bot's push and the full CI when the train asks (repository variable CI_DEPTH_TIERED)."
    required: false
    default: 'false'
  ci-run-id:
    description: A CI run that handed its verdict over from inside itself, and so still reads as in progress.
    required: false
    default: ''
  ci-conclusion:
    description: That run's verdict, success or failure, which stands in for its conclusion.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Move the train
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CI_WORKFLOW_NAME: ${{ inputs.ci-workflow-name }}
        TRUSTED_BOTS: ${{ inputs.trusted-bots }}
        HOLD_LABEL: ${{ inputs.hold-label }}
        MAX_ATTEMPTS: ${{ inputs.max-gate-attempts }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        STACK_ROOT_AUTOMERGE: ${{ inputs.stack-root-automerge }}
        STUCK_HOURS: ${{ inputs.stuck-hours }}
        MAIN_RED_WAIT_HOURS: ${{ inputs.main-red-wait-hours }}
        MAX_REPAIRS: ${{ inputs.max-repairs }}
        DRY_RUN: ${{ inputs.dry-run }}
        CI_DEPTH_TIERED: ${{ inputs.ci-depth-tiered }}
        HINT_RUN_ID: ${{ inputs.ci-run-id }}
        HINT_CONCLUSION: ${{ inputs.ci-conclusion }}
      run: bash "${GITHUB_ACTION_PATH}/merge-train.sh"
