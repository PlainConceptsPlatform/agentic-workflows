# Managed by @plainconceptsplatform/workflows. Source: loops/actions/push-agent-branch/action.yml. Update with workflows update --force; consumer edits may be overwritten.
name: Push agent branch
description: Read push_to_pull_request_branch from agent_output.json and fast-forward from its git bundle.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  bundle-file:
    description: Path to the git bundle from the agent artifact.
    required: false
    default: ''
  token:
    description: GitHub token with contents:write.
    required: true
  expected-branch:
    description: The only branch the push may target. Empty accepts the branch the item names.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Configure git credentials
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # The runners here outlive their jobs, and `git config --global` outlives the job with
        # them. This step used to add one `url.<token>.insteadOf` rule per run and never remove it,
        # so a runner that had pushed before held several rules for the same prefix, each carrying
        # a token revoked since, and git picks among equal-length matches arbitrarily. The same
        # gate pushed for one pull request and was refused for the next: "Invalid username or
        # token", then "Target branch does not exist" because ls-remote exited 128 (Pliny-Bot #716
        # failed twice that way while #717 pushed in between). Drop every such rule wherever it
        # lives, and set this run's rule in the checkout only.
        for scope in --global --local; do
          git config "$scope" --get-regexp '^url\..*x-access-token.*\.insteadof$' 2>/dev/null |
            while read -r key _; do git config "$scope" --unset-all "$key" || true; done || true
        done
        git config --local url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
    - name: Read pull request branch
      id: request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        BUNDLE_FILE: ${{ inputs.bundle-file }}
        EXPECTED_BRANCH: ${{ inputs.expected-branch }}
      run: |
        set -euo pipefail
        [ -f "$OUTPUT_FILE" ] || exit 0

        ITEM=$(jq -c '.items[] | select(.type == "push_to_pull_request_branch")' "$OUTPUT_FILE")
        [ -n "$ITEM" ] || exit 0

        BRANCH=$(echo "$ITEM" | jq -r '.branch')
        # The agent names the branch; the caller knows it. A push anywhere else is refused, not
        # redirected: a model that named the wrong branch may have built on the wrong one too.
        # An item that names none was built on the checkout, which is the expected branch.
        if [ -n "$EXPECTED_BRANCH" ] && { [ -z "$BRANCH" ] || [ "$BRANCH" = null ]; }; then
          BRANCH="$EXPECTED_BRANCH"
        fi
        if [ -n "$EXPECTED_BRANCH" ] && [ "$BRANCH" != "$EXPECTED_BRANCH" ]; then
          echo "::error::The agent asked to push to '$BRANCH'; this run may only push to '$EXPECTED_BRANCH'."
          exit 1
        fi
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
    - name: Apply bundle to pull request branch
      if: steps.request.outputs.branch != '' && inputs.bundle-file != ''
      uses: ./.github/actions/apply-agent-bundle
      with:
        bundle-file: ${{ inputs.bundle-file }}
        target-branch: ${{ steps.request.outputs.branch }}
