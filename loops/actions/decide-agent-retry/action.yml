# Managed by @plainconceptsplatform/workflows. Source: loops/actions/decide-agent-retry/action.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: Decide agent retry
description: Say whether an agent job that failed is worth running again, from how long it ran and how many attempts have been made.
inputs:
  token:
    description: GitHub token with actions read access, used to read this run's own jobs.
    required: true
  attempts-so-far:
    description: Attempts already made against this piece of work. Empty counts as none.
    required: false
    default: '0'
  park-at:
    description: Stop retrying once this many attempts have been made.
    required: true
  under-minutes:
    description: Only a run shorter than this is repeated.
    required: true
outputs:
  retry:
    description: '"true" when this failure is worth repeating.'
    value: ${{ steps.decide.outputs.retry }}
  next:
    description: The attempt number a retry would be.
    value: ${{ steps.decide.outputs.next }}
  minutes:
    description: How long the agent job ran, or -1 when that could not be read.
    value: ${{ steps.decide.outputs.minutes }}
  cause:
    description: 'Why a retry was chosen: short-run, runner-shutdown or cut-off. "none" when there is none.'
    value: ${{ steps.decide.outputs.cause }}
runs:
  using: composite
  steps:
    # A run that died in three minutes produced no answer, so repeating it costs three minutes. A
    # run that worked for half an hour and then failed produced an answer that was wrong, and
    # repeating it buys the same wrong answer half an hour later. Duration is what separates them,
    # and it needs no model and no log parsing to read.
    #
    # Except when the long run was killed rather than wrong. The VM was deleted under a forty
    # minute implement (Pliny-Bot #699), and an AI gateway that answered nothing ended another
    # run one turn after it began (#693's first attempt): neither is a verdict on the work, and
    # both waited six hours for the janitor. classify-failure.sh reads those two from the job's
    # annotations and from the line above the sandbox teardown, and they are repeated whatever
    # the run lasted, within the same attempt budget.
    #
    # Written once here because the rule was in the implement worker alone, and refine, triage and
    # apply-review parked instead -- an Odyssey refine died in three minutes on
    # `Model 'glm-5-2' not found`, a gateway fault that clears in seconds, and waited on the
    # janitor's six-hourly sweep. Five copies of sixty lines is how one rule becomes five.
    - name: Decide whether this failure is worth repeating
      id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        ACTION_PATH: ${{ github.action_path }}
        ATTEMPTS: ${{ inputs.attempts-so-far }}
        PARK_AT: ${{ inputs.park-at }}
        UNDER_MINUTES: ${{ inputs.under-minutes }}
      run: |
        set -euo pipefail
        # The agent job belongs to this same run: a called workflow shares the caller's run id.
        read -r job_id started finished conclusion <<<"$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
          --jq '[.jobs[] | select(.name | endswith("agent"))] | last // empty
                | "\(.id // "") \(.started_at // "") \(.completed_at // "") \(.conclusion // "")"')"
        minutes=-1
        if [ -n "${started:-}" ] && [ -n "${finished:-}" ]; then
          minutes=$(( ( $(date -u -d "$finished" +%s) - $(date -u -d "$started" +%s) ) / 60 ))
        fi
        attempts="${ATTEMPTS:-0}"
        [ -n "$attempts" ] || attempts=0
        retry=false
        cause=none
        # An unknown duration is treated as a long run: never retry on a guess.
        if [ "$minutes" -ge 0 ] && [ "$minutes" -lt "$UNDER_MINUTES" ] && [ "$attempts" -lt "$PARK_AT" ]; then
          retry=true
          cause=short-run
        fi
        # A long run is repeated only when it was killed, not when it was wrong. The reads are best
        # effort: a log or an annotation list that cannot be fetched leaves the run parked, exactly
        # as before this check existed.
        if [ "$retry" != true ] && [ "$attempts" -lt "$PARK_AT" ] && [ -n "${job_id:-}" ]; then
          work="$(mktemp -d)"
          gh api "repos/$REPO/check-runs/$job_id/annotations" --paginate --jq '.[].message' >"$work/annotations" 2>/dev/null || true
          gh api "repos/$REPO/actions/jobs/$job_id/logs" >"$work/log" 2>/dev/null || true
          kind="$(bash "$ACTION_PATH/classify-failure.sh" "$work/log" "$work/annotations" || echo none)"
          if [ "$kind" != none ]; then
            retry=true
            cause="$kind"
          fi
          rm -rf "$work"
        fi
        # A cancelled agent job is a person or a newer run taking the work back, not an outage.
        # Pliny-Bot #816: refine was cancelled by hand and its label removed, then this step read
        # the eight-minute run as a provider failure, sent it back through the router and parked
        # the issue as stalled.
        if [ "${conclusion:-}" = cancelled ]; then
          retry=false
          cause=cancelled
        fi
        {
          echo "retry=$retry"
          echo "next=$((attempts + 1))"
          echo "minutes=$minutes"
          echo "cause=$cause"
        } >> "$GITHUB_OUTPUT"
        echo "agent job ran for ${minutes}m; attempts so far ${attempts}; retry=${retry}; cause=${cause}"
