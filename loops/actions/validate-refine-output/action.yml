# Managed by @plainconceptsplatform/workflows. Source: loops/actions/validate-refine-output/action.yml. Update with workflows update --force; consumer edits may be overwritten.
name: Validate refine output
description: Verify agent_output.json contains a usable refinement outcome before any GitHub writes.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  marker:
    description: Comment marker removed before evaluating clarification content.
    required: true
  draft-marker:
    description: Marker that identifies a temporal draft body written while questions remain.
    required: true
  comment-prefix:
    description: Comment prefix removed before evaluating clarification content.
    required: true
  issue-number:
    description: Issue number that every refinement outcome must target.
    required: true
  questions-line:
    description: The sentence that opens the batched questions comment. A comment carrying it makes the outcome questions.
    required: false
    default: I have some questions about this issue
outputs:
  valid:
    description: Whether the output contains a usable replacement body or clarification comment.
    value: ${{ steps.validate.outputs.valid }}
  outcome:
    description: "Deterministic refinement outcome: complete, split, questions, or invalid."
    value: ${{ steps.validate.outputs.outcome }}
  reason:
    description: Why the output was refused (which rule, which item), on one line; empty unless the outcome is invalid.
    value: ${{ steps.validate.outputs.reason }}
runs:
  using: composite
  steps:
    - name: Validate refinement outcome
      id: validate
      shell: bash
      env:
        COMMENT_PREFIX: ${{ inputs.comment-prefix }}
        DRAFT_MARKER: ${{ inputs.draft-marker }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        MARKER: ${{ inputs.marker }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        QUESTIONS_LINE: ${{ inputs.questions-line }}
      run: |
        set -euo pipefail

        reason_file="$(mktemp)"
        outcome="$(REFINE_REASON_FILE="$reason_file" bash "${{ github.action_path }}/validate-refine-output.sh" "$OUTPUT_FILE" "$MARKER" "$COMMENT_PREFIX" "$ISSUE_NUMBER" "$DRAFT_MARKER" "$QUESTIONS_LINE")"
        reason="$(head -n 1 "$reason_file" | tr -d '\r' | cut -c1-500)"
        rm -f "$reason_file"
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        echo "valid=$([ "$outcome" != 'invalid' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"

        if [ "$outcome" = 'invalid' ]; then
          echo "::warning title=Refine output refused::${reason:-no reason recorded}. It will not be applied."
        fi
