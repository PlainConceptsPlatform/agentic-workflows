# Managed by @plainconceptsplatform/workflows. Source: loops/actions/cleanup-artifacts/action.yml. Update with workflows update --force; consumer edits may be overwritten.
name: Clean up artifacts
description: >-
  Delete workflow artifacts older than the configured retention period, delete Actions caches
  that belong to finished pull requests or to idle non-default branches, and warn when the
  repository's Actions storage passes a threshold.
inputs:
  token:
    description: GitHub token with actions write access.
    required: true
  artifact-retention-days:
    description: Retention period in days. Invalid or empty values use 3.
    required: false
    default: ''
  cache-idle-days:
    description: Days a non-default-branch cache may go unused before it is deleted. Invalid or empty values use 3.
    required: false
    default: ''
  storage-warn-gb:
    description: Cache plus artifact size, in GB, above which the run warns. Invalid or empty values use 5.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Delete expired artifacts
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const parsedDays = Number.parseInt(process.env.ARTIFACT_RETENTION_DAYS, 10);
          const days = Number.isInteger(parsedDays) && parsedDays > 0 ? parsedDays : 3;
          const cutoff = new Date(Date.now() - days * 24 * 60 * 60 * 1000);

          core.info(`Retention: ${days} days (cutoff ${cutoff.toISOString()})`);

          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            ...context.repo,
            per_page: 100,
          });

          const expired = artifacts.filter((artifact) => new Date(artifact.created_at) < cutoff);

          let deleted = 0;
          const failed = [];

          for (const artifact of expired) {
            // GitHub answers a delete with a 5xx now and then. Three tries, because the
            // alternative is a red daily run over one artifact that tomorrow's run would
            // have removed anyway.
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await github.rest.actions.deleteArtifact({
                  ...context.repo,
                  artifact_id: artifact.id,
                });

                core.info(`Deleted ${artifact.name} (created ${artifact.created_at})`);
                deleted += 1;
                lastError = undefined;
                break;
              } catch (error) {
                lastError = error;
                if (attempt < 3) await new Promise((wait) => setTimeout(wait, attempt * 2000));
              }
            }

            if (lastError) {
              core.warning(
                `Could not delete ${artifact.name} (${artifact.id}) after 3 tries: ${lastError.message}`,
              );
              failed.push({ name: artifact.name, status: lastError.status });
            }
          }

          await core.summary
            .addHeading('Artifact cleanup', 2)
            .addList([
              `Retention: ${days} days (cutoff ${cutoff.toISOString()})`,
              `Deleted: ${deleted}`,
              `Failed to delete: ${failed.length}`,
              `Within retention: ${artifacts.length - expired.length}`,
            ])
            .write();

          // Deleting nothing at all while expired artifacts exist is a permission or
          // configuration problem, and has to be loud. One stubborn artifact among many is
          // the API having a bad minute: tomorrow's run picks it up, and failing here only
          // teaches people to ignore a red cleanup. A 4xx is never transient, so it fails
          // whatever else succeeded.
          const names = failed.map((entry) => entry.name).join(', ');
          const structural = failed.some((entry) => entry.status && entry.status < 500);
          if (failed.length > 0 && (deleted === 0 || structural)) {
            core.setFailed(`${failed.length} artifact(s) could not be deleted: ${names}`);
          } else if (failed.length > 0) {
            core.warning(
              `${failed.length} artifact(s) survived this run and will be retried tomorrow: ${names}`,
            );
          }

    - name: Delete stale caches and report storage
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CACHE_IDLE_DAYS: ${{ inputs.cache-idle-days }}
        STORAGE_WARN_GB: ${{ inputs.storage-warn-gb }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          // Caches are the bigger half of Actions storage: every pull request leaves one per key
          // under refs/pull/N/merge and nothing ever reads it again once the PR is closed. GitHub
          // only evicts at 10 GB per repository, so without this the account fills up first.
          const parse = (value, fallback) => {
            const n = Number.parseFloat(value);
            return Number.isFinite(n) && n > 0 ? n : fallback;
          };
          const idleDays = parse(process.env.CACHE_IDLE_DAYS, 3);
          const warnGb = parse(process.env.STORAGE_WARN_GB, 5);
          const idleCutoff = new Date(Date.now() - idleDays * 24 * 60 * 60 * 1000);

          const { data: repo } = await github.rest.repos.get({ ...context.repo });
          const defaultRef = `refs/heads/${repo.default_branch}`;

          const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
            ...context.repo,
            per_page: 100,
          });

          const prState = new Map();
          const isClosedPr = async (ref) => {
            const match = /^refs\/pull\/(\d+)\//.exec(ref);
            if (!match) return false;
            const number = Number(match[1]);
            if (!prState.has(number)) {
              try {
                const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
                prState.set(number, pr.state === 'closed');
              } catch (error) {
                prState.set(number, error.status === 404);
              }
            }
            return prState.get(number);
          };

          let deleted = 0;
          let freed = 0;
          const failed = [];
          for (const cache of caches) {
            if (cache.ref === defaultRef) continue;
            const idle = new Date(cache.last_accessed_at) < idleCutoff;
            if (!idle && !(await isClosedPr(cache.ref))) continue;
            try {
              await github.rest.actions.deleteActionsCacheById({ ...context.repo, cache_id: cache.id });
              deleted += 1;
              freed += cache.size_in_bytes;
            } catch (error) {
              failed.push(`${cache.key} (${error.status || error.message})`);
            }
          }

          const gb = (bytes) => (bytes / 1e9).toFixed(2);
          const { data: usage } = await github.rest.actions.getActionsCacheUsage({ ...context.repo });
          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            ...context.repo,
            per_page: 100,
          });
          const artifactBytes = artifacts
            .filter((artifact) => !artifact.expired)
            .reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
          const totalBytes = usage.active_caches_size_in_bytes + artifactBytes;

          await core.summary
            .addHeading('Cache cleanup and storage', 2)
            .addList([
              `Caches deleted: ${deleted} (${gb(freed)} GB) - closed PRs or idle more than ${idleDays} days`,
              `Caches failed to delete: ${failed.length}`,
              `Cache storage now: ${gb(usage.active_caches_size_in_bytes)} GB in ${usage.active_caches_count} caches`,
              `Artifact storage: ${gb(artifactBytes)} GB`,
              `Warning threshold: ${warnGb} GB`,
            ])
            .write();

          if (failed.length > 0) core.warning(`${failed.length} cache(s) could not be deleted: ${failed.join(', ')}`);
          if (totalBytes > warnGb * 1e9) {
            core.warning(
              `Actions storage for this repository is ${gb(totalBytes)} GB (caches ${gb(usage.active_caches_size_in_bytes)} GB, ` +
                `artifacts ${gb(artifactBytes)} GB), above ${warnGb} GB. Check cache keys and artifact retention-days.`,
            );
          }
