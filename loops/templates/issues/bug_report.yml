name: Bug report
description: Report a defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do **not** include real secrets or production data — use placeholders.

        For security vulnerabilities, contact the team directly instead of filing a public issue.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Production-down / data loss
        - Major — broken core flow
        - Minor — broken edge case
        - Cosmetic / polish
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often does this happen?
      options:
        - Always
        - Intermittent
        - Only once
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce it?
      placeholder: |
        1. Go to ...
        2. Do ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it occur?
      options:
        - Backend
        - Frontend
        - Both
        - CLI / tooling
        - Configuration / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it's fixed? A checklist a reviewer can verify (include the test that should turn green).
      placeholder: |
        - [ ] ...
        - [ ] A test that fails before the fix and passes after
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Decisions a maintainer must make before this can be planned. Leave blank if none.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Local vs deployed, branch/commit, OS, runtime versions if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs or screenshots. Redact secrets and PII.
      render: shell
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related links
      description: Links to related issues, PRs, discussions, or docs. Leave blank if none.
    validations:
      required: false
