# Managed by @plainconceptsplatform/workflows. Source: loops/templates/ci/app-ci-node-monorepo.yml. Update with `workflows update --force`; consumer edits may be overwritten.
# No mutation testing here, on purpose: a pull request's quality gate is the test suite, and Stryker
# over even one changed page took longer than the rest of CI together. Mutation runs out of band,
# weekly, in `Quality: Mutation testing (scheduled)` (`workflows add --template quality-mutation`).
name: "App: CI (Node monorepo)"

on:
  pull_request:
  # GitHub's merge queue builds the base plus the pull requests ahead; the full CI runs there.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  WEB_PACKAGE: "@app/web"
  DESKTOP_PACKAGE: "@app/desktop"
  MOBILE_PACKAGE: "@app/mobile"
  WEB_EXPORT_PATH: apps/web/out
  PLAYWRIGHT_REPORT_PATH: apps/web/playwright-report
  DESKTOP_MAIN_PATH: apps/desktop/out/main/index.js
  DESKTOP_PRELOAD_PATH: apps/desktop/out/preload/index.cjs
  DESKTOP_PRELOAD_BRIDGE_PATTERN: exposeInMainWorld
  MOBILE_IOS_PATH: apps/mobile/ios
  MOBILE_ANDROID_PATH: apps/mobile/android
  WEB_ARTIFACT_NAME: web-export
  PLAYWRIGHT_ARTIFACT_NAME: playwright-report
  TRUFFLEHOG_IMAGE: "trufflesecurity/trufflehog:latest"
  SEMGREP_IMAGE: "semgrep/semgrep:1.168.0"
  SBOM_ARTIFACT_NAME: app-sbom.cyclonedx.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (Biome)
    if: github.event_name != 'schedule'
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .

  web:
    name: Web (Next.js static export)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'true')
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$WEB_PACKAGE" run typecheck
      - run: pnpm --filter "$WEB_PACKAGE" run test
      - run: pnpm --filter "$WEB_PACKAGE" run lint:fsd
      - run: pnpm --filter "$WEB_PACKAGE" run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.WEB_EXPORT_PATH }}
          retention-days: 3
          if-no-files-found: error

  e2e:
    name: E2E (Playwright)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'true')
    needs: web
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.WEB_EXPORT_PATH }}
      - run: pnpm --filter "$WEB_PACKAGE" exec playwright install --with-deps chromium webkit
      - run: pnpm --filter "$WEB_PACKAGE" run e2e
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ env.PLAYWRIGHT_ARTIFACT_NAME }}
          path: ${{ env.PLAYWRIGHT_REPORT_PATH }}
          retention-days: 7

  desktop:
    name: Desktop (Electron)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'true')
    needs: web
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$DESKTOP_PACKAGE" run typecheck
      - run: pnpm --filter "$DESKTOP_PACKAGE" run build
      - run: |
          test -f "$DESKTOP_MAIN_PATH"
          test -f "$DESKTOP_PRELOAD_PATH"
          grep -q "$DESKTOP_PRELOAD_BRIDGE_PATTERN" "$DESKTOP_PRELOAD_PATH"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.WEB_EXPORT_PATH }}
      - run: pnpm --filter "$DESKTOP_PACKAGE" exec playwright install-deps chromium
      - run: xvfb-run --auto-servernum pnpm --filter "$DESKTOP_PACKAGE" run e2e

  mobile:
    name: Mobile (Capacitor)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'true')
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$MOBILE_PACKAGE" run typecheck
      - run: |
          if [ -d "$MOBILE_IOS_PATH" ] || [ -d "$MOBILE_ANDROID_PATH" ]; then
            pnpm --filter "$WEB_PACKAGE" run build
            pnpm --filter "$MOBILE_PACKAGE" run sync
          else
            echo "::notice::Native projects absent; skipping Capacitor sync."
          fi

  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "${{ github.workspace }}:/repo" "$TRUFFLEHOG_IMAGE" filesystem /repo --only-verified --fail --no-update

  deps-and-iac-scan:
    name: Dependencies and IaC (Trivy)
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  sast-scan:
    name: SAST (Semgrep)
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `.semgrep/` holds the family rules (empty catch blocks, mockup markup in code) when the
      # quality-gates template is installed; without it the scan runs the registry rules alone.
      - run: |
          local_rules=()
          [ -d .semgrep ] && local_rules=(--config .semgrep/)
          docker run --rm -v "${{ github.workspace }}:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --error --metrics=off --oss-only --disable-version-check --config p/default --config p/security-audit --config p/secrets --config p/typescript --config p/react "${local_rules[@]}" --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  sbom:
    name: SBOM (CycloneDX)
    runs-on: agents-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        continue-on-error: true
        with:
          format: cyclonedx-json
          artifact-name: ${{ env.SBOM_ARTIFACT_NAME }}
          syft-version: v1.57.0
          # On a tag that already has a GitHub Release the action attaches the SBOM to it, which
          # needs contents: write this workflow does not have, and fails the run that gates deploy.
          upload-release-assets: false
      # The action downloads the syft binary with a single non-retried GET. A transient GitHub
      # release-CDN 504 (log: "received HTTP status=504 ... _checksums.txt") flips this step to
      # failure and, because SBOM gates deploy, blocks PROD for no code reason. The first attempt is
      # continue-on-error so the job stays live; this retry runs only when it actually failed. If
      # BOTH attempts fail (a real syft/SBOM error, not a flaky download), the job still fails and
      # SBOM stays a gate.
      - name: Retry SBOM on transient asset 504
        if: ${{ steps.sbom.outcome == 'failure' }}
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          format: cyclonedx-json
          artifact-name: ${{ env.SBOM_ARTIFACT_NAME }}
          syft-version: v1.57.0
          # Same guard as above: a tag release needs contents: write, which this job lacks.
          upload-release-assets: false

  # The merge queue requires this check. On a pull request with MERGE_QUEUE on, the heavy jobs are
  # skipped and the full CI runs on the merge group instead; skipped counts as passed.
  full-ci:
    name: Full CI
    needs: [web, e2e, desktop, mobile]
    if: always()
    runs-on: agents-arc
    timeout-minutes: 5
    steps:
      - name: Every heavy job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in failure | cancelled | timed_out) echo "A heavy job ended $result."; exit 1 ;; esac
          done

  # Hands this run's verdict to the router's merge train, which decides whether this pull request
  # is the one in front and what it needs. A pull request opened or updated with a bot token gets
  # no workflow_run event for its CI (the run's actor is the bot), and the train brings people's
  # pull requests up to date with one too, so every pull request on this repository hands over
  # from here. workflow_dispatch is one of the two events GITHUB_TOKEN may raise, so no App token
  # is needed, and the router treats a dispatch as trusted. The hourly schedule is the fallback.
  #
  # If a deploy pipeline calls this workflow with `uses:`, that caller must also grant
  # `actions: write`. A called workflow may not request a scope its caller withheld, and the
  # whole run fails to start with zero jobs and no annotation when it does.
  #
  # Not for Dependabot: its runs get a read-only token, so the dispatch would fail its pull request,
  # and the router's maintenance run merges Dependabot updates instead of the train.
  dispatch-merge-train:
    name: Dispatch merge train
    needs: [lint, web, e2e, desktop, mobile]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: agents-arc
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Hand this run's verdict to the merge train
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          conclusion=success
          for result in $RESULTS; do
            case "$result" in
              failure) conclusion=failure; break ;;
              cancelled | timed_out) conclusion=cancelled ;;
            esac
          done
          # A cancelled run was superseded by a newer push, whose own run dispatches.
          if [ "$conclusion" = cancelled ]; then
            echo "CI was cancelled; not moving the merge train."
            exit 0
          fi
          echo "Moving the merge train for PR #$PR_NUMBER with CI $conclusion (run $RUN_ID)."
          gh workflow run work-router.yml --repo "$REPO" --ref "$REF" \
            -f operation=merge-train -f pr-number="$PR_NUMBER" \
            -f ci-conclusion="$conclusion" -f ci-run-id="$RUN_ID"
