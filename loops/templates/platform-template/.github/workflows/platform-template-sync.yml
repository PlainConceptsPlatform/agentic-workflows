# Managed by @plainconceptsplatform/workflows. Source: loops/templates/platform-template/.github/workflows/platform-template-sync.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "Platform: Template sync"

# Pulls the newest version of the upstream template named in .platform/contract.yml (see
# docs/platform-contracts.md in agentic-workflows). Plain YAML, no model. Without a contract it does
# nothing. With one it runs `sync.update` and opens or updates one pull request from
# `platform/template-sync`. copier is installed when the command starts with `copier`; any other
# command is the repository's to provide. Conflict markers left in an owned file fail the
# conformance guard, so the merge gate repairs the pull request like any red one.
#
# The Platform App token (BOT_APP_ID / BOT_PRIVATE_KEY) reads a private template and pushes, because
# a push made with GITHUB_TOKEN starts no workflow and CI would never run on the sync.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-template-sync
  cancel-in-progress: false

env:
  # copier 9.19.1 needs Python 3.10 or newer on the runner.
  COPIER_VERSION: "9.19.1"
  # The pinned uv the copier step downloads when the runner has no uvx, no pipx and no ensurepip
  # (the self-hosted runner image ships Python without python3-venv, so a venv cannot be made).
  UV_VERSION: "0.13.5"
  UV_SHA256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
  NODE_VERSION: "22"
  SYNC_BRANCH: platform/template-sync

jobs:
  sync:
    name: Sync the platform template
    runs-on: ${{ vars.CI_RUNNER || 'agents-arc' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # An invalid contract fails here, with the file and the field in the error.
      - name: Read the platform contract
        id: contract
        run: |
          set -euo pipefail
          node scripts/check-platform-conformance.mjs --contract | tee -a "$GITHUB_OUTPUT"

      - name: Decide whether to sync
        id: decide
        env:
          CONTRACT: ${{ steps.contract.outputs.contract }}
          SELF: ${{ steps.contract.outputs.self }}
          UPDATE: ${{ steps.contract.outputs.update }}
        run: |
          set -euo pipefail
          run=false
          if [ "$CONTRACT" != present ]; then
            echo "No .platform/contract.yml (nor .copier-answers.yml with .platform/manifest): nothing to sync."
          elif [ "$SELF" = true ]; then
            echo "This repository is the template source.url names: nothing to sync."
          elif [ -z "$UPDATE" ]; then
            echo "The platform contract declares no sync.update: nothing to sync."
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Generate App token
        id: app-token
        if: steps.decide.outputs.run == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # uvx where uv is installed, then pipx, then a virtual environment from the runner's Python, and
      # where that Python cannot make one, a pinned uv checked against its SHA-256.
      - name: Install copier
        if: steps.decide.outputs.run == 'true' && startsWith(steps.contract.outputs.update, 'copier ')
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/copier-bin"
          mkdir -p "$bin"
          if command -v uvx >/dev/null 2>&1; then
            run="uvx --from copier==$COPIER_VERSION copier"
          elif command -v pipx >/dev/null 2>&1; then
            run="pipx run --spec copier==$COPIER_VERSION copier"
          elif python3 -c 'import ensurepip' >/dev/null 2>&1; then
            python3 -m venv "$RUNNER_TEMP/copier-venv"
            "$RUNNER_TEMP/copier-venv/bin/pip" install --quiet "copier==$COPIER_VERSION"
            run="$RUNNER_TEMP/copier-venv/bin/copier"
          else
            tarball="$RUNNER_TEMP/uv.tar.gz"
            curl -fsSL -o "$tarball" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
            echo "${UV_SHA256}  $tarball" | sha256sum --check --strict
            tar -xzf "$tarball" -C "$RUNNER_TEMP"
            run="$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu/uvx --from copier==$COPIER_VERSION copier"
          fi
          cat > "$bin/copier" <<EOF
          #!/usr/bin/env bash
          exec $run "\$@"
          EOF
          chmod +x "$bin/copier"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/copier" --version

      # The token reaches git through process-scoped config only, never a file on the runner.
      - name: Update from the template
        id: update
        if: steps.decide.outputs.run == 'true'
        env:
          UPDATE: ${{ steps.contract.outputs.update }}
          BEFORE: ${{ steps.contract.outputs.version }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          echo "sync.update: $UPDATE"
          bash -euo pipefail -c "$UPDATE"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already on the newest template (${BEFORE:-no version recorded}). Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          after=$(node scripts/check-platform-conformance.mjs --contract | sed -n 's/^version=//p')
          git add --all
          conflicts=$(git grep --cached -l -E '^(<<<<<<<|>>>>>>>)( |$)' -- . || true)
          {
            echo "changed=true"
            echo "tag=${after:-$(git rev-parse --short HEAD)}"
            echo "files<<EOF"
            git diff --cached --name-status
            echo "EOF"
            echo "conflicts<<EOF"
            [ -z "$conflicts" ] || printf '%s\n' "$conflicts"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # One sync pull request at a time. An open one for the same version is left alone, so the
      # conflict resolutions pushed to it survive; a newer version replaces its branch and its text.
      - name: Open or update the sync pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          SOURCE_NAME: ${{ steps.contract.outputs.source_name }}
          SOURCE_WEB: ${{ steps.contract.outputs.source_web }}
          BEFORE: ${{ steps.contract.outputs.version }}
          TAG: ${{ steps.update.outputs.tag }}
          UPDATE: ${{ steps.contract.outputs.update }}
          FILES: ${{ steps.update.outputs.files }}
          CONFLICTS: ${{ steps.update.outputs.conflicts }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          marker="<!-- platform-template-sync: $TAG -->"
          open=$(gh pr list --repo "$REPO" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ] && gh pr view "$open" --repo "$REPO" --json body --jq .body | grep -qF -- "$marker"; then
            echo "Pull request #$open already syncs $TAG. Nothing to do."
            exit 0
          fi
          title="chore(platform): sync $SOURCE_NAME to $TAG"
          git switch --create "$SYNC_BRANCH"
          git commit --quiet --message "$title"
          git push --force "https://github.com/$REPO.git" "HEAD:refs/heads/$SYNC_BRANCH"
          case "$SOURCE_WEB" in
            https://github.com/*) target="[\`$TAG\`]($SOURCE_WEB/releases/tag/$TAG)" ;;
            *) target="\`$TAG\`" ;;
          esac
          body="$RUNNER_TEMP/sync-body.md"
          {
            echo "$marker"
            echo "Sync of the code owned by $SOURCE_NAME from \`${BEFORE:-no recorded version}\` to $target, made by \`$UPDATE\`."
            echo
            if [ -n "$CONFLICTS" ]; then
              echo "### Conflicts"
              echo
              echo "These files carry inline conflict markers where this repository had edited owned code. CI fails on them until they are resolved."
              echo
              printf '%s\n' "$CONFLICTS" | awk '{ printf "- `%s`\n", $0 }'
              echo
            fi
            echo "### Changed files"
            echo
            printf '%s\n' "$FILES" | awk -F '\t' '{ printf "- `%s` %s\n", $NF, $1 }'
          } > "$body"
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$REPO" --title "$title" --body-file "$body"
          else
            gh pr create --repo "$REPO" --base "$BASE" --head "$SYNC_BRANCH" --title "$title" --body-file "$body"
          fi
