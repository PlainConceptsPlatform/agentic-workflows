# Managed by @plainconceptsplatform/workflows. Source: loops/templates/platform-template/.github/workflows/platform-template-sync.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "Platform: Template sync"

# Brings the platform code of a family app up to the newest Kitchen-Sink template tag. Plain YAML,
# no model: copier does the merge, and a person or the merge gate takes it from the pull request.
#
# Does nothing without .copier-answers.yml, the marker a repository gets when it adopts the
# template. With it, `copier update` runs against the newest `v*` tag of the template named in
# `_src_path`. No change means the app is current and the run ends there. Otherwise the result is
# committed to `platform/sync-<tag>` and opened as a pull request titled with the tag. A file the
# app had edited gets copier's inline conflict markers; scripts/check-platform-conformance.mjs
# fails CI on them, so the merge gate repairs the pull request (`remediated`) like any red one.
#
# Kitchen-Sink is private, so the Platform App token (BOT_APP_ID / BOT_PRIVATE_KEY) reads it. The
# same token pushes the branch and opens the pull request, because a push made with GITHUB_TOKEN
# starts no workflow and CI would never run on the sync.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-template-sync
  cancel-in-progress: false

env:
  # copier 9.19.1 needs Python 3.10 or newer on the runner.
  COPIER_VERSION: "9.19.1"

jobs:
  sync:
    name: Sync the platform template
    runs-on: ${{ vars.CI_RUNNER || 'agents-arc' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Has this repository adopted the template?
        id: marker
        run: |
          if [ -f .copier-answers.yml ]; then
            echo "adopted=true" >> "$GITHUB_OUTPUT"
          else
            echo "adopted=false" >> "$GITHUB_OUTPUT"
            echo "No .copier-answers.yml: this repository has not adopted the platform template. Nothing to do."
          fi

      - name: Generate App token
        id: app-token
        if: steps.marker.outputs.adopted == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # uvx where uv is installed, then pipx, then a virtual environment from the runner's Python.
      - name: Install copier
        if: steps.marker.outputs.adopted == 'true'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/copier-bin"
          mkdir -p "$bin"
          if command -v uvx >/dev/null 2>&1; then
            run="uvx --from copier==$COPIER_VERSION copier"
          elif command -v pipx >/dev/null 2>&1; then
            run="pipx run --spec copier==$COPIER_VERSION copier"
          else
            python3 -m venv "$RUNNER_TEMP/copier-venv"
            "$RUNNER_TEMP/copier-venv/bin/pip" install --quiet "copier==$COPIER_VERSION"
            run="$RUNNER_TEMP/copier-venv/bin/copier"
          fi
          cat > "$bin/copier" <<EOF
          #!/usr/bin/env bash
          exec $run "\$@"
          EOF
          chmod +x "$bin/copier"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/copier" --version

      # The token reaches git through process-scoped config only, never a file on the runner.
      - name: Update from the template
        id: update
        if: steps.marker.outputs.adopted == 'true'
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          commit_of() { sed -n 's/^_commit:[[:space:]]*//p' .copier-answers.yml | tr -d "\"'" | head -n 1; }
          before=$(commit_of)
          copier update --trust --defaults --conflict inline
          after=$(commit_of)
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already on the newest template ($before). Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add --all
          conflicts=$(git grep --cached -l -E '^(<<<<<<<|>>>>>>>)( |$)' -- . || true)
          {
            echo "changed=true"
            echo "before=$before"
            echo "tag=$after"
            echo "files<<EOF"
            git diff --cached --name-status
            echo "EOF"
            echo "conflicts<<EOF"
            [ -z "$conflicts" ] || printf '%s\n' "$conflicts"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open the sync pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ steps.update.outputs.before }}
          TAG: ${{ steps.update.outputs.tag }}
          FILES: ${{ steps.update.outputs.files }}
          CONFLICTS: ${{ steps.update.outputs.conflicts }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          branch="platform/sync-$TAG"
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $TAG is already open on $branch. Nothing to do."
            exit 0
          fi
          src=$(sed -n 's/^_src_path:[[:space:]]*//p' .copier-answers.yml | tr -d "\"'" | head -n 1)
          web="${src#git+}"
          web="${web%.git}"
          git switch --create "$branch"
          git commit --quiet --message "chore(platform): sync the platform template to $TAG"
          git push --force "https://github.com/$REPO.git" "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/sync-body.md"
          {
            echo "Platform template sync from \`$BEFORE\` to [\`$TAG\`]($web/releases/tag/$TAG), made by \`copier update\`."
            echo
            if [ -n "$CONFLICTS" ]; then
              echo "### Conflicts"
              echo
              echo "These files carry inline conflict markers where the app had edited platform code. CI fails on them until they are resolved."
              echo
              printf '%s\n' "$CONFLICTS" | awk '{ printf "- `%s`\n", $0 }'
              echo
            fi
            echo "### Changed files"
            echo
            printf '%s\n' "$FILES" | awk -F '\t' '{ printf "- `%s` %s\n", $NF, $1 }'
          } > "$body"
          gh pr create --repo "$REPO" --base "$BASE" --head "$branch" \
            --title "chore(platform): sync the platform template to $TAG" --body-file "$body"
