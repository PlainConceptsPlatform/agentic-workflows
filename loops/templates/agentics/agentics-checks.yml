# Managed by @plainconceptsplatform/workflows. Source: loops/templates/agentics/agentics-checks.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: Agentics checks

on:
  pull_request:
    paths:
      - .github/workflows/*.md
      - .github/workflows/shared/*.md
      - .github/workflows/*.yml
      - .github/workflows/aw.json
      - .github/actions/**
  # A push to the default branch that bypassed review is exactly the case that needs the check:
  # seven broken locks reached Pliny-Bot's main in twenty minutes with no pull request and no
  # run of this workflow. A red run here is the detection.
  push:
    branches: [main]
    paths:
      - .github/workflows/*.md
      - .github/workflows/shared/*.md
      - .github/workflows/*.yml
      - .github/workflows/aw.json
      - .github/actions/**

env:
  # Must match the version the locks were compiled with (first line of every .lock.yml) and the
  # `github/gh-aw/...@vX` import pin in every worker. A different compiler regenerates every lock
  # and the freshness diff measures the version, not the change under review.
  GH_AW_VERSION: v0.87.5
  ACTIONLINT_VERSION: 1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
  SHELLCHECK_VERSION: 0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
  # The same script a developer runs. It wraps `gh aw compile --strict` and applies the
  # repository's post-processing; a bare `gh aw compile` on this side would regenerate every lock
  # without the transform, and the diff below could never be clean.
  AGENTICS_COMPILE_COMMAND: node scripts/compile-agent-workflows.mjs

permissions:
  contents: read

concurrency:
  group: agentics-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-lockfiles:
    name: Verify generated agent lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # gh-aw resolves the `github/gh-aw/...` imports through the GitHub API on every compile,
      # and an unauthenticated gh on a hosted runner refuses API calls.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-aw
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin "$GH_AW_VERSION"
          gh aw --version
      # The compile command is a node script. Hosted images have node; a setup step pins the
      # major version so the script sees the same runtime everywhere.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify the locks and the workers agree on the gh-aw version
        shell: bash
        run: |
          set -euo pipefail
          # `gh aw --version` writes to stderr; without 2>&1 the grep saw nothing and set -e
          # ended the step with no message at all.
          want="$(gh aw --version 2>&1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          [ "$want" = "$GH_AW_VERSION" ] || { echo "::error::gh aw reports '${want:-nothing}', this workflow pins $GH_AW_VERSION"; exit 1; }
          status=0
          for lock in .github/workflows/*.lock.yml; do
            have="$(sed -n '1s/.*"compiler_version":"\([^"]*\)".*/\1/p' "$lock")"
            if [ "$have" != "$want" ]; then
              echo "::error::$lock was compiled by ${have:-an unknown version}; this job runs $want. Recompile with the pinned version, or bump GH_AW_VERSION and the worker import pins together."
              status=1
            fi
          done
          while read -r file pin; do
            if [ "$pin" != "$want" ]; then
              echo "::error::$file imports gh-aw shared files at $pin; this job runs $want."
              status=1
            fi
          done < <(grep -HoE 'github/gh-aw/[^@]*@v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/*.md | sed -E 's/^([^:]*):.*@(v[0-9.]+)$/\1 \2/' | sort -u)
          exit "$status"
      - name: Compile agent workflows strictly
        run: ${{ env.AGENTICS_COMPILE_COMMAND }}
      - name: Verify generated lockfiles are current
        shell: bash
        run: |
          set -euo pipefail
          if git diff --exit-code -- .github/workflows/*.lock.yml; then
            exit 0
          fi
          if git diff --exit-code -I '^[[:space:]]*GH_AW_INFO_MODEL_COSTS:' -- .github/workflows/*.lock.yml; then
            echo "::warning::Only volatile GH_AW_INFO_MODEL_COSTS metadata changed."
            exit 0
          fi
          echo "::error::Generated agent lockfiles are stale. Run '${AGENTICS_COMPILE_COMMAND}' and commit the resulting .lock.yml files."
          git diff -- .github/workflows/*.lock.yml
          exit 1
      # gh aw compile leaves a lock alone when its hashes still match the source, so the script
      # must recognise a lock it already processed. If a second run changes anything, the
      # post-processing is not idempotent and every consumer's freshness check is measuring the
      # transform instead of the drift.
      - name: Verify a second compile changes nothing
        shell: bash
        run: |
          set -euo pipefail
          cp -R .github/workflows "$RUNNER_TEMP/first-pass"
          ${AGENTICS_COMPILE_COMMAND}
          if ! diff -r -I '^[[:space:]]*GH_AW_INFO_MODEL_COSTS:' "$RUNNER_TEMP/first-pass" .github/workflows; then
            echo "::error::Running '${AGENTICS_COMPILE_COMMAND}' twice produced different locks; the post-processing is not idempotent."
            exit 1
          fi

  lint-workflows:
    name: Lint authored workflows and shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Pinned rather than taken from the image: a copy of this job that ran on a self-hosted
      # runner died with "shellcheck: No such file or directory".
      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # actionlint 1.7.7 predates `concurrency.queue`, which GitHub accepts and the router uses;
      # that one message is a known false positive and is ignored by its exact text so anything
      # else under `concurrency` still fails. shellcheck style notes (SC2129 and friends) are
      # opinions about consumer scripts, not defects; warnings and errors still fail the job.
      - name: Lint authored workflows
        shell: bash
        env:
          SHELLCHECK_OPTS: -S warning
        run: |
          set -euo pipefail
          mapfile -t authored < <(git ls-files '.github/workflows/*.yml' | grep -vE '\.lock\.yml$|agentics-maintenance\.yml$')
          if [ "${#authored[@]}" -gt 0 ]; then
            actionlint -ignore 'unexpected key "queue" for "concurrency" section' "${authored[@]}"
          fi
      - name: Lint composite action shell
        shell: bash
        run: find .github/actions -name '*.sh' -print0 | xargs -0 -r shellcheck -x
