# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/agent-feature-chain.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "Agent: Feature Chain"

# One link of a feature chain. It picks the next unfinished story, dispatches an implement for
# it, and exits within seconds. Nothing here waits: the implement worker itself merges its
# pull request and dispatches the next link, so no process ever outlives its own token.
#
# State lives in GitHub, not here. A story is done when its issue is closed, and skipped when
# it carries the review label. Re-running this workflow is always safe: it re-derives the next
# step from that state rather than from anything it remembers.
#
# The feature label is the kill switch. Remove it and the chain stops at the next link.

on:
  workflow_call:
    inputs:
      issue-number:
        description: "Feature issue whose stories are implemented one at a time"
        required: true
        type: string
    secrets:
      BOT_APP_ID:
        description: "GitHub App client ID for bot operations"
        required: true
      BOT_PRIVATE_KEY:
        description: "GitHub App private key for bot operations"
        required: true

env:
  FEATURE_LABEL: feature
  SKIP_LABEL: review
  WORKING_LABEL: bot-working
  STATE_MARKER: "<!-- agent-feature-chain:v1 -->"

permissions:
  contents: read

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Pick the next story and hand it off
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FEATURE: ${{ inputs.issue-number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          labels=$(gh issue view "$FEATURE" --repo "$REPO" --json labels --jq '[.labels[].name]')
          if ! jq -e --arg l "$FEATURE_LABEL" 'index($l)' >/dev/null <<<"$labels"; then
            echo "::notice::#$FEATURE no longer carries $FEATURE_LABEL. Chain stopped."
            exit 0
          fi

          body=$(gh issue view "$FEATURE" --repo "$REPO" --json body --jq '.body // ""')

          # The chain branch is state, and state lives in GitHub: a hidden marker in the
          # feature body names the integration branch every story lands on. First link
          # creates both; every later link (and a resume after any crash) re-derives them.
          CHAIN_BRANCH=$(printf '%s' "$body" | grep -oE '<!-- feature-branch: [^ ]+ -->' | head -1 | sed 's/<!-- feature-branch: //; s/ -->//')
          if [ -z "$CHAIN_BRANCH" ]; then
            title=$(gh issue view "$FEATURE" --repo "$REPO" --json title --jq '.title')
            slug=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//; s/-$//' | cut -c1-32)
            CHAIN_BRANCH="feature/${FEATURE}-${slug}-$(openssl rand -hex 3)"
            base_sha=$(gh api "repos/$REPO/git/refs/heads/$DEFAULT_BRANCH" --jq '.object.sha')
            gh api "repos/$REPO/git/refs" --method POST \
              -f ref="refs/heads/$CHAIN_BRANCH" -f sha="$base_sha" >/dev/null
            new_body=$(printf '%s\n\n<!-- feature-branch: %s -->' "$body" "$CHAIN_BRANCH")
            gh issue edit "$FEATURE" --repo "$REPO" --body "$new_body"
            echo "::notice::Created chain branch $CHAIN_BRANCH and recorded it in #$FEATURE"
          else
            # A resumed chain may predate the branch (or someone deleted it): recreate from
            # the default branch rather than dying, so re-adding the label always works.
            if ! gh api "repos/$REPO/git/refs/heads/$CHAIN_BRANCH" >/dev/null 2>&1; then
              base_sha=$(gh api "repos/$REPO/git/refs/heads/$DEFAULT_BRANCH" --jq '.object.sha')
              gh api "repos/$REPO/git/refs" --method POST \
                -f ref="refs/heads/$CHAIN_BRANCH" -f sha="$base_sha" >/dev/null
              echo "::warning::Chain branch $CHAIN_BRANCH was missing; recreated from $DEFAULT_BRANCH"
            fi
            echo "Chain branch: $CHAIN_BRANCH"
          fi

          printf '%s' "$body" | grep -oE '#[0-9]+' | tr -d '#' | grep -v "^${FEATURE}$" > /tmp/mentions.txt || true
          if [ ! -s /tmp/mentions.txt ]; then
            echo "::error::#$FEATURE mentions no story issues"
            exit 1
          fi

          # Mentions keep their written order: the author's ordering is the execution order.
          next=""
          total=0
          done_count=0
          skipped=""
          seen=""
          while IFS= read -r n; do
            case " $seen " in *" $n "*) continue ;; esac
            seen="$seen $n"
            total=$((total + 1))

            state=$(gh issue view "$n" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "MISSING")
            if [ "$state" = "MISSING" ]; then
              continue
            fi
            if [ "$state" = "CLOSED" ]; then
              done_count=$((done_count + 1))
              continue
            fi

            story_labels=$(gh issue view "$n" --repo "$REPO" --json labels --jq '[.labels[].name]')
            if jq -e --arg l "$SKIP_LABEL" 'index($l)' >/dev/null <<<"$story_labels"; then
              skipped="${skipped}#${n} "
              continue
            fi

            # An implement already owns this story. That run dispatches the next link when it
            # finishes, so this one must not dispatch anything: two links racing would both pick
            # the same first-open story and implement it twice.
            if jq -e --arg l "$WORKING_LABEL" 'index($l)' >/dev/null <<<"$story_labels"; then
              echo "::notice::#$n is already being implemented. This link exits without dispatching."
              exit 0
            fi

            if [ -z "$next" ]; then
              next="$n"
            fi
          done < /tmp/mentions.txt

          echo "Stories: ${total} total, ${done_count} closed, skipped: ${skipped:-none}"

          if [ -n "$next" ]; then
            echo "Next story: #$next"
            gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" --method POST \
              -f ref="$DEFAULT_BRANCH" \
              -f "inputs[operation]=implement" \
              -f "inputs[issue-number]=$next" \
              -f "inputs[feature-chain]=$FEATURE"
            exit 0
          fi

          # Every story is closed or skipped. The stories are already on the default branch, so
          # the finish worker only has to make the accumulated result build and open the one
          # pull request that CI and Merge Gate actually see.
          echo "No stories left. Handing off to the finish worker."
          gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" --method POST \
            -f ref="$DEFAULT_BRANCH" \
            -f "inputs[operation]=feature-finish" \
            -f "inputs[issue-number]=$FEATURE"

          if [ -n "$skipped" ]; then
            echo "::warning::Feature #$FEATURE finished with skipped stories: ${skipped}"
          fi
