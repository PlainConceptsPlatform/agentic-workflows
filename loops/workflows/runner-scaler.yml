# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/runner-scaler.yml.
#
# Ephemeral VM Scale Set autoscaler for the agents-arc runners.
#
# workflow_job is a webhook event, not a workflow trigger, so this fires on workflow_run
# (top-level runs only; reusable calls ride inside their caller) for every workflow whose
# call graph reaches agents-arc, plus a 15-minute reconciliation sweep that fixes drift in
# either direction: dead instances reaped, idle ones armed, queued work given a runner.
#
# requested  -> +1 instance (cap 4), boot, arm a single-job org JIT runner (group agentic)
# completed  -> reconcile
# schedule   -> reconcile
#
# Two tokens, on purpose. RUNNER_SCALER_GH_TOKEN is a fine-grained PAT whose only grant is
# org "Self-hosted runners: rw", used to mint JIT configs and list org runners; it cannot read
# repositories. The job's own GITHUB_TOKEN (permissions.actions: read) answers the "is work
# queued" question. Giving the PAT repo scope instead would work but widens it needlessly.
# Azure uses the Platform Agents Pro service principal. Failures here must never block or
# redden product repos: continue-on-error at the job level.
name: "Runners: scale"

on:
  workflow_run:
    workflows:
      - "All Work Router"
      - "Authorize Bot Work"
      - "App: CI"
      - "App: Deploy"
      - "App: Infra (Bicep)"
      - "Agentics checks"
      - "Agent: Implement Issue"
      - "Agent: Refine Issue"
      - "Agent: Triage Issue"
      - "Agent: Audit"
      - "Agent: Direct"
      - "Agent: Apply Review"
      - "Agent: Merge Gate"
      - "Agent: Finish Feature"
    types: [requested, completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: read

concurrency:
  group: runner-scaler
  cancel-in-progress: false

env:
  RG: agentrunner-pro-rg-01
  VMSS: agentrunner-vmss-01
  MAX_RUNNERS: "8"
  RUNNER_LABEL: agents-arc

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_SCALER_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SCALER_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_SCALER_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SCALER_SUBSCRIPTION_ID }}"}'

      - name: Reconcile the fleet
        env:
          GH_TOKEN: ${{ secrets.RUNNER_SCALER_GH_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name == 'workflow_run' && github.event.action || 'sweep' }}
        run: |
          set -euo pipefail

          arm_runner() {
            local id="$1"
            for t in $(seq 1 40); do
              out=$(az vmss run-command invoke -g "$RG" -n "$VMSS" --instance-id "$id" \
                --command-id RunShellScript \
                --scripts 'if [ -f /opt/runner/.ready ] && [ ! -f /opt/runner/.claimed ]; then touch /opt/runner/.claimed && echo CLAIMED; elif [ -f /opt/runner/.claimed ]; then echo TAKEN; else echo WAIT; fi' \
                --query "value[0].message" -o tsv 2>/dev/null | tr -d '\r' || true)
              echo "$out" | grep -q CLAIMED && break
              echo "$out" | grep -q TAKEN && { echo "instance $id already claimed"; return 1; }
              sleep 12
            done
            jit=$(gh api -X POST "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runners/generate-jitconfig" \
              -f name="vmss-${id}-${GITHUB_RUN_ID}" -F runner_group_id=6 \
              -f "labels[]=${RUNNER_LABEL}" -f work_folder=_work --jq .encoded_jit_config)
            az vmss run-command invoke -g "$RG" -n "$VMSS" --instance-id "$id" \
              --command-id RunShellScript \
              --scripts "systemd-run --unit=gha-runner --uid=runner --gid=runner --working-directory=/opt/actions-runner /opt/actions-runner/run.sh --jitconfig '$jit'" \
              --query "value[0].message" -o tsv >/dev/null
            echo "armed runner on instance $id"
          }

          # az on this runner emits CRLF; every numeric read below goes through this.
          strip_cr() { tr -d '\r'; }

          scale_up_one() { top_up 1; }

          # num <value> -- gh prints API errors on stdout, so a failed call would otherwise
          # flow into an arithmetic test as a JSON blob and abort the whole sweep.
          num() { case "$1" in ''|*[!0-9]*) echo 0 ;; *) echo "$1" ;; esac; }

          # Count queued jobs that want our label, not queued runs. A run holds many jobs and
          # gh-aw locks split into several tiny ones, so run counts understate demand badly.
          # The queue lives in the repo, which the scaler PAT deliberately cannot read (its
          # only grant is org "Self-hosted runners"); the job GITHUB_TOKEN has actions: read,
          # so it answers this and the PAT stays minimal.
          queued_jobs() {
            local ids n total=0 jq_count
            jq_count="[.jobs[]|select(.status==\"queued\" and (.labels|index(\"${RUNNER_LABEL}\")))]|length"
            ids=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" --jq '.workflow_runs[]|select(.status=="queued" or .status=="in_progress")|.id' 2>/dev/null || true)
            for id in $ids; do
              n=$(num "$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq "$jq_count" 2>/dev/null)")
              total=$((total + n))
            done
            echo "$total"
          }

          # Runners that can take work now or shortly: idle online registrations plus
          # instances still booting, so one burst is not provisioned twice.
          supply() {
            local idle booting
            idle=$(num "$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runners" --jq '[.runners[]|select(.busy==false and .status=="online")]|length' 2>/dev/null)")
            booting=$(num "$(az vmss list-instances -g "$RG" -n "$VMSS" --query "length([?provisioningState!='Succeeded'])" -o tsv 2>/dev/null | strip_cr)")
            echo $((idle + booting))
          }

          # top_up [max_add] -- provision the whole deficit in one scale call, then arm every
          # new instance concurrently. Arming one VM per pass cost about four minutes of dead
          # time per job, which is what made second-long jobs look stalled.
          top_up() {
            local limit="${1:-$MAX_RUNNERS}" q s deficit cap target before after new pids=""
            q=$(queued_jobs); s=$(supply)
            deficit=$((q - s))
            echo "queued_jobs=$q supply=$s deficit=$deficit"
            if [ "$deficit" -le 0 ]; then echo "supply covers the queue"; return 0; fi
            if [ "$deficit" -gt "$limit" ]; then deficit=$limit; fi
            cap=$(num "$(az vmss show -g "$RG" -n "$VMSS" --query sku.capacity -o tsv 2>/dev/null | strip_cr)")
            target=$((cap + deficit))
            if [ "$target" -gt "$MAX_RUNNERS" ]; then target=$MAX_RUNNERS; fi
            if [ "$target" -le "$cap" ]; then echo "at capacity ($cap/$MAX_RUNNERS)"; return 0; fi
            before=$(az vmss list-instances -g "$RG" -n "$VMSS" --query "[].instanceId" -o tsv 2>/dev/null | strip_cr | sort)
            echo "scaling $cap -> $target"
            az vmss scale -g "$RG" -n "$VMSS" --new-capacity "$target" -o none
            after=$(az vmss list-instances -g "$RG" -n "$VMSS" --query "[].instanceId" -o tsv 2>/dev/null | strip_cr | sort)
            new=$(comm -13 <(echo "$before") <(echo "$after"))
            if [ -z "$new" ]; then echo "no new instance appeared"; return 0; fi
            for id in $new; do
              arm_runner "$id" || true &
              pids="$pids $!"
            done
            for p in $pids; do wait "$p" || true; done
            echo "armed wave:" $new
          }

          reap_and_arm() {
            for id in $(az vmss list-instances -g "$RG" -n "$VMSS" --query "[].instanceId" -o tsv | tr -d '\r'); do
              state=$(az vmss run-command invoke -g "$RG" -n "$VMSS" --instance-id "$id" \
                --command-id RunShellScript \
                --scripts 'if [ ! -f /opt/runner/.ready ]; then echo BOOTING; elif [ ! -f /opt/runner/.claimed ]; then echo IDLE; elif systemctl is-active --quiet gha-runner; then echo BUSY; else echo DEAD; fi' \
                --query "value[0].message" -o tsv 2>/dev/null | tr -d '\r' | grep -oE "BOOTING|IDLE|BUSY|DEAD" | head -1 || echo UNKNOWN)
              echo "instance $id: $state"
              if [ "$state" = "DEAD" ]; then
                az vmss delete-instances -g "$RG" -n "$VMSS" --instance-ids "$id" --no-wait -o none
                echo "deleted $id"
              elif [ "$state" = "IDLE" ]; then
                arm_runner "$id" || true
              fi
            done
          }

          # num <call output> -- gh prints API errors on stdout, so a failed call would
          # otherwise flow into an arithmetic test as a JSON blob and abort the sweep.
          num() { case "$1" in ''|*[!0-9]*) echo 0 ;; *) echo "$1" ;; esac; }

          queued_needs() {
            local q idle
            # the queue lives in the repo, which the scaler PAT deliberately cannot read:
            # its only grant is org "Self-hosted runners". The job's own GITHUB_TOKEN has
            # actions: read, so it answers this question and the PAT stays minimal.
            q=$(num "$(GH_TOKEN="$REPO_TOKEN" gh api               "repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=10"               --jq ".total_count" 2>/dev/null)")
            idle=$(num "$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runners"               --jq '[.runners[]|select(.busy==false and .status=="online")]|length' 2>/dev/null)")
            echo "queued=$q idle=$idle"
            [ "$q" -gt 0 ] && [ "$idle" -eq 0 ]
          }

          top_up() {
            # one requested event means one run, but a run holds many jobs: keep adding
            # runners while work is queued and nothing idle can take it, up to capacity
            for i in 1 2 3 4; do
              queued_needs || break
              scale_up_one || break
            done
          }

          case "$EVENT" in
            requested) scale_up_one || true ;;
            completed) reap_and_arm; top_up ;;
            *) reap_and_arm; top_up ;;
          esac
