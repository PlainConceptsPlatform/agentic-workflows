# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/agentics-merge-belt.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "Agentics: Merge Belt"

# The merge belt: the merge train, the merge gate it hands pull requests to, the merge of a pull
# request a person approved, and the hourly reconcile. No model runs here except the gate. These
# jobs used to be routes of work-router.yml, so every CI completion and every hourly tick opened a
# router run with all of its jobs. They now run here, on the events they need. work-router.yml
# still accepts `operation=merge-gate`, `merge-train` and `reconcile-bot-pr-runs`, and a person
# adding the `merge-gate` label, and forwards them here.

# The titles are the ones the router gave these runs. merge-train.sh finds the gates on the belt
# by the "Agent: Merge Gate - PR #" title and the " (repair)" suffix, so neither may change.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && inputs.operation == 'merge-gate'
  && github.actor == 'github-actions[bot]'
  && format('Agentics: Merge Train - CI on PR #{0}', inputs.pr-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'merge-gate'
  && format('Agent: Merge Gate - PR #{0}{1}', inputs.pr-number, inputs.ci-conclusion == 'failure' && ' (repair)' || '')
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'merge-train'
  && inputs.pr-number != ''
  && format('Agentics: Merge Train - CI on PR #{0}', inputs.pr-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'merge-train'
  && format('Agentics: Merge Train{0}', '')
  || github.event_name == 'workflow_dispatch'
  && format('Agentics: Reconcile - manual{0}', '')
  || github.event_name == 'schedule'
  && format('Agentics: Reconcile - hourly{0}', '')
  || github.event_name == 'workflow_run'
  && format('Event: CI {0} on {1}', github.event.workflow_run.conclusion, github.event.workflow_run.head_branch)
  || github.event_name == 'pull_request_target'
  && format('Event: PR #{0} {1} by {2}', github.event.pull_request.number, github.event.action, github.actor)
  || github.event_name == 'pull_request_review'
  && format('Event: Review on PR #{0} by {1}', github.event.pull_request.number, github.actor)
  || github.event_name }}

# The part of this file a repository may change. `workflows update` keeps these values. A key that
# also lives in work-router.yml (CI_WORKFLOW_NAME, TRUSTED_BOTS, MERGE_TRAIN_HOLD_LABEL) is copied
# from the router on every update, so the router stays the one place to change it.
env:
  # The CI workflow the belt reads its verdict from. Copied from work-router.yml, and mirrored
  # into the workflow_run trigger below by the installer.
  CI_WORKFLOW_NAME: "App: CI"
  # The bot identities the belt trusts. Copied from work-router.yml.
  TRUSTED_BOTS: "github-actions[bot] app/github-actions platform-devbox[bot]"
  # How many failed merge-gate attempts one pull request head may consume before the belt
  # parks it for a person. The route matrix asserts it agrees with the merge-gate worker's
  # MAX_ATTEMPTS, because a belt that gives up later than the worker says burns whole runs.
  MAX_GATE_ATTEMPTS: "6"
  # Pull requests with this label stay off the merge train. Copied from work-router.yml.
  MERGE_TRAIN_HOLD_LABEL: "hold"
  # How many times a `blocked` verdict, or a merge that did not happen, is retried once the base
  # branch has moved. After that the pull request waits for a person or a new commit.
  MERGE_TRAIN_MAX_RETRIES: "3"
  # "true" lets a stack root merge itself once every child has landed and CI is green, through the
  # same gate as any pull request: a change over the blast radius limit, a protected path or an
  # unresolved finding still goes to a person. "false" keeps every root for a human.
  MERGE_TRAIN_STACK_ROOT_AUTOMERGE: "true"
  # "true" logs the move the train would make and makes none. For trying the train on a
  # repository before letting it act.
  MERGE_TRAIN_DRY_RUN: "false"
  # How many pull requests the merge train may have in repair at once. A repair moves nothing on
  # the default branch, so repairs of different pull requests do not race; only merges are serial.
  # 1 repairs one pull request at a time.
  MERGE_TRAIN_REPAIRS: "1"
  # Working hours, Monday to Friday, that refine's questions wait for an answer. Every question
  # carries the answer the bot would take; once this passes with no reply, or as soon as the
  # author reacts with a thumbs-up, the hourly reconcile sends the issue back to refine with those
  # answers and refine labels it `assumed`. A question marked as needing a decision is never
  # assumed. "0" turns this off, and questions wait for a person however long that takes.
  REFINE_ANSWER_TIMEOUT_HOURS: "24"

on:
  # A person's approval merges a pull request the gate handed to them (merge-approved).
  pull_request_review:
    types: [submitted]

  # A merge moved the base branch, so the next pull request in line can move.
  pull_request_target:
    types: [closed]

  # CI completion on a pull request moves the merge train, green or red: the train decides
  # whether that pull request is the one in front, and what it needs.
  #
  # Delivery (verified 2026-09-06 in Pliny-Bot): GitHub delivers workflow_run only for CI runs
  # whose actor is a human. A pull request opened or updated with a bot token has the bot as the
  # actor of every CI run that follows, and no workflow_run arrives for any of them. For those
  # the consumer CI's dispatch job (templates/ci) and the hourly schedule are the paths.
  # Security: workflow_run runs from the default branch with secrets, but the train only ever
  # moves pull requests from this repository opened by a trusted bot or someone with write
  # access, and the gate's subject job checks the same again.
  workflow_run:
    # Mirrored from env.CI_WORKFLOW_NAME by the installer. A trigger evaluates no expression.
    workflows: ["App: CI"]
    types: [completed]

  # Cron to route mapping lives in .github/actions/classify-route/classify-route.sh.
  schedule:
    - cron: "17 * * * *" # reconcile-bot-pr-runs, which also ticks the merge train

  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        type: choice
        options:
          - merge-gate
          - merge-train
          - reconcile-bot-pr-runs
      pr-number:
        description: "Pull request number (required for merge-gate)"
        required: false
        type: string
      ci-conclusion:
        description: "CI conclusion for merge-gate dispatch"
        required: false
        type: choice
        options:
          - success
          - failure
          - action_required
      ci-run-id:
        description: "CI workflow run ID for merge-gate dispatch"
        required: false
        type: string
      attempts_so_far:
        description: "Failed merge-gate attempts already made against this CI verdict (filled by the train, not by humans)"
        required: false
        type: string
        default: '0'

permissions:
  contents: read

jobs:
  classify:
    # The same off switch as authorize; jobs that need only classify stop here.
    if: vars.AGENTIC_WORKFLOWS_DISABLED == ''
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      route: ${{ steps.route.outputs.route }}
      issue-number: ${{ steps.route.outputs.issue-number }}
      pr-number: ${{ steps.route.outputs.pr-number }}
      linked-issue: ${{ steps.route.outputs.linked-issue }}
      ci-conclusion: ${{ steps.route.outputs.ci-conclusion }}
      ci-run-id: ${{ steps.route.outputs.ci-run-id }}
      merge-gate-attempts: ${{ steps.route.outputs.merge-gate-attempts }}
      attempts: ${{ steps.route.outputs.attempts }}
      refine-mode: ${{ steps.route.outputs.refine-mode }}
      triage-mode: ${{ steps.route.outputs.triage-mode }}
      trigger-kind: ${{ steps.route.outputs.trigger-kind }}
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify event into a single route
        id: route
        uses: ./.github/actions/classify-route
        with:
          token: ${{ github.token }}

  # The merge belt is one lock for the whole repository, not one group per pull request.
  # A batch of six overnight pull requests means every merge moves the default branch
  # under the other five; gates running at once would each rebase onto a base another
  # gate is about to invalidate. The merge train dispatches one gate at a time, oldest pull
  # request first; the lock is what still holds when a person or a consumer CI dispatches one
  # beside it.
  #
  # `queue: max` keeps up to 100 gates waiting in order. Without it GitHub keeps one pending run
  # per group and silently cancels the previous one: in one week Numa cancelled 12 gates and
  # finished 6, and those pull requests were merged by hand without a verdict.
  call-merge-gate:
    needs: classify
    if: needs.classify.outputs.route == 'merge-gate'
    uses: ./.github/workflows/agent-merge-gate.lock.yml
    # A gate that was handed red CI repairs and pushes: it can never merge (the validator blocks a
    # non-success conclusion), so it moves nothing on the default branch and cannot race another
    # gate. Those run in a group of their own per pull request, in parallel, while everything that
    # may merge still waits its turn on the one belt.
    concurrency:
      group: ${{ needs.classify.outputs.ci-conclusion == 'failure' && format('merge-repair-{0}', needs.classify.outputs.pr-number) || (vars.MERGE_QUEUE == 'true' && format('merge-gate-{0}', needs.classify.outputs.pr-number) || 'merge-belt') }}
      cancel-in-progress: false
      queue: max
    permissions: write-all
    with:
      pr-number: ${{ needs.classify.outputs.pr-number }}
      linked-issue: ${{ needs.classify.outputs.linked-issue }}
      ci-conclusion: ${{ needs.classify.outputs.ci-conclusion }}
      ci-run-id: ${{ needs.classify.outputs.ci-run-id }}
      attempts_so_far: ${{ needs.classify.outputs.merge-gate-attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # The merge train: one step for the oldest open pull request that can move, bot or person.
  # It merges the base branch into a green pull request that fell behind, hands a red,
  # conflicting or green-and-current one to the gate, and skips one a person has to decide on,
  # so a parked pull request never blocks the line. One gate in flight at a time; everything
  # else waits untouched. It ticks on every merge, every CI completion, after every gate (this
  # job waits for call-merge-gate in the same run), and hourly as the fallback. Deterministic:
  # it reads GitHub and dispatches, and never checks out or runs pull request code.
  #
  # One tick at a time. A pending tick replaced by a newer one loses nothing: each reads the
  # whole repository afresh.
  merge-train:
    needs: [classify, call-merge-gate]
    if: >
      always() &&
      needs.classify.result == 'success' &&
      !github.event.repository.fork &&
      (
        needs.classify.outputs.route == 'merge-train' ||
        needs.classify.outputs.route == 'merge-gate' ||
        needs.classify.outputs.route == 'reconcile-bot-pr-runs' ||
        (github.event_name == 'pull_request_target' &&
         github.event.action == 'closed' &&
         github.event.pull_request.merged == true)
      )
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 15
    concurrency:
      group: merge-train
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The App token, not GITHUB_TOKEN: a gate dispatch and a branch update made with
      # GITHUB_TOKEN start no workflow, so the gate would never run and CI never rerun.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: ./.github/actions/merge-train
        with:
          token: ${{ steps.app-token.outputs.token }}
          ci-workflow-name: ${{ env.CI_WORKFLOW_NAME }}
          trusted-bots: ${{ env.TRUSTED_BOTS }}
          hold-label: ${{ env.MERGE_TRAIN_HOLD_LABEL }}
          max-gate-attempts: ${{ env.MAX_GATE_ATTEMPTS }}
          max-retries: ${{ env.MERGE_TRAIN_MAX_RETRIES }}
          stack-root-automerge: ${{ env.MERGE_TRAIN_STACK_ROOT_AUTOMERGE }}
          max-repairs: ${{ env.MERGE_TRAIN_REPAIRS }}
          dry-run: ${{ env.MERGE_TRAIN_DRY_RUN }}
          ci-run-id: ${{ needs.classify.outputs.ci-run-id }}
          ci-conclusion: ${{ needs.classify.outputs.ci-conclusion }}
          # Repository variable, read by the repository's CI as well: one switch for both sides.
          ci-depth-tiered: ${{ vars.CI_DEPTH_TIERED || 'false' }}
          merge-queue: ${{ vars.MERGE_QUEUE || 'false' }}

  # The decision the gate parked for: a person with write access approves a pull request the
  # gate handed to them (human-review or owner-review), and the bot merges the commit they
  # approved. Re-running the gate would only reproduce the same parked verdict.
  merge-approved:
    needs: classify
    if: needs.classify.outputs.route == 'merge-approved'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    concurrency:
      group: merge-approved-${{ needs.classify.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout for App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Merge the approved commit
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.classify.outputs.pr-number }}
          ISSUE: ${{ needs.classify.outputs.linked-issue }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::Not merging #$PR: $1"; exit 0; }

          permission=$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || echo none)
          case "$permission" in admin|maintain|write) ;; *) skip "$REVIEWER has $permission access" ;; esac

          read -r state author head_sha < <(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .user.login, .head.sha] | @tsv')
          [ "$state" = open ] || skip "it is $state"
          # The gate parks pull requests by people too. Its author needs write access, like
          # everyone the merge train carries; a bot needs to be one this router trusts.
          case " $TRUSTED_BOTS " in
            *" $author "*) ;;
            *)
              author_permission=$(gh api "repos/$REPO/collaborators/$author/permission" --jq '.permission' 2>/dev/null || echo none)
              case "$author_permission" in admin|maintain|write) ;; *) skip "it was opened by $author, who has $author_permission access" ;; esac
              ;;
          esac
          [ "$head_sha" = "$REVIEW_COMMIT" ] || skip "$REVIEWER approved ${REVIEW_COMMIT:0:7}, the head is now ${head_sha:0:7}"

          # Another reviewer's change request still stands.
          decision=$(gh pr view "$PR" --repo "$REPO" --json reviewDecision --jq '.reviewDecision // ""')
          [ "$decision" = APPROVED ] || skip "the review decision is '${decision:-none}'"

          # The gate parked it for a person. A protected-path hold comments on the issue rather
          # than the pull request, so the issue's labels speak for it.
          verdict=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select((.body | contains("<!-- agent-merge-gate -->")) and (.body | contains("**Verdict:**"))) | .body' |
            grep -oE '\*\*Verdict:\*\* [a-z-]+' | tail -1 | sed 's/.* //' || true)
          if [ -z "$verdict" ] && [ -n "$ISSUE" ]; then
            labels=$(gh api "repos/$REPO/issues/$ISSUE/labels" --jq '[.[].name] | join(" ")')
            case " $labels " in *" blocked "*) ;; *" owner-review "*) verdict=owner-review ;; esac
          fi
          case "$verdict" in human-review|owner-review) ;; *) skip "the gate's verdict is '${verdict:-none}', not a hand-over" ;; esac

          ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == env.CI_WORKFLOW_NAME)] | sort_by(.created_at) | last | .conclusion // ""')
          [ "$ci" = success ] || skip "$CI_WORKFLOW_NAME on ${head_sha:0:7} is '${ci:-not run}'"

          # Into the merge queue where the base branch has one, merged otherwise.
          landed=$(HEAD_SHA="$head_sha" GITHUB_OUTPUT=/dev/stdout bash ./.github/actions/land-pull-request/land-pull-request.sh | sed -n 's/^landed=//p' | tail -1)
          if [ -n "$landed" ]; then echo "merged=true" >> "$GITHUB_OUTPUT"; fi
      - name: Clear the issue's labels
        if: steps.merge.outputs.merged == 'true' && needs.classify.outputs.linked-issue != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.classify.outputs.linked-issue }}
        run: |
          for label in implement bot-working review owner-review blocked pr-pending; do
            gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/$label" >/dev/null 2>&1 || true
          done
      # GITHUB_TOKEN: its comment raises no event for the router to read.
      - name: Say whose approval merged it
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.classify.outputs.pr-number }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
        run: gh pr comment "$PR" --repo "$REPO" --body "Merged on @$REVIEWER's approval of \`${REVIEW_COMMIT:0:7}\`."

  reconcile-bot-pr-runs:
    needs: classify
    if: needs.classify.outputs.route == 'reconcile-bot-pr-runs'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
      # the stale reservation sweep clears bot-working from parked issues
      issues: write
    env:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
    steps:
      - name: Checkout for App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      # Runs only the default-branch workflow and never checks out pull-request code.
      # External users cannot impersonate github-actions[bot].
      # Moving pull requests towards a merge is the merge train's, which this schedule also ticks.
      - name: Approve trusted bot CI and clear stale reservations
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Stale reservation sweep. Labelling ten issues at once labels all ten immediately,
          # because authorize-bot-work is keyed per issue, while each implement queue lets exactly
          # one run at a time. A queued run that is cancelled therefore leaves its issue
          # carrying bot-working with no run and no pull request: parked, invisible, and not
          # re-triggerable, because classify refuses an issue that is already reserved.
          #
          # The live runs are read by status, not as the repository's latest hundred runs. Every
          # comment and label is a router run, so a busy repository pushes an implement that has
          # waited two hours in the queue out of the latest hundred, and the sweep then cleared
          # bot-working from issues whose runs were alive and about to start (Pliny-Bot #693 and
          # #707, both still queued from 07:32). Runs that are not finished are few, whatever
          # their age.
          active_runs=$(for status in queued in_progress pending waiting requested; do
              gh api "repos/$REPO/actions/runs?status=$status&per_page=100" --jq '.workflow_runs[]' 2>/dev/null || true
            done | jq -s '{workflow_runs: .}')
          gh issue list --repo "$REPO" --label bot-working --state open --limit 100 \
            --json number --jq '.[].number' |
            while IFS= read -r issue; do
              [ -n "$issue" ] || continue

              live=$(jq "[.workflow_runs[]
                  | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\")
                  | select((.display_title + \" \") | test(\"#${issue}[^0-9]\"))] | length" <<<"$active_runs")
              [ "${live:-0}" -eq 0 ] || continue

              has_pr=$(gh pr list --repo "$REPO" --state open --json body \
                --jq "[.[] | select(((.body // \"\") + \" \") | ascii_downcase | test(\"clos(e|es|ed) #${issue}[^0-9]|fix(es|ed)? #${issue}[^0-9]|resolves? #${issue}[^0-9]\"))] | length")
              [ "${has_pr:-0}" -eq 0 ] || continue

              echo "Clearing a stale bot-working reservation on #$issue: no run, no pull request."
              gh issue edit "$issue" --repo "$REPO" --remove-label bot-working
            done

          gh api "repos/$REPO/pulls?state=open&per_page=100" |
            jq -r --arg repo "$REPO" '
              .[]
              | select(
                    # Bind the login first. Inside index(...) the input is the array, so a bare
                    # .user.login there indexes the array and jq dies with "Cannot index array
                    # with string \"user\"", taking the whole hourly belt with it.
                    ((.user.login) as $login | (env.TRUSTED_BOTS | split(" ")) | index($login) != null)
                    and .draft == false
                    and .head.repo.full_name == $repo
                 )
              | [.number, .head.ref, .head.sha] | @tsv
            ' |
            while IFS=$'\t' read -r _ branch _; do
              gh api "repos/$REPO/actions/runs?status=action_required&branch=$branch" \
                --jq '.workflow_runs[]
                  | select(
                      .event == "pull_request"
                      and .name == env.CI_WORKFLOW_NAME
                    )
                  | .id' |
                while IFS= read -r run_id; do
                  echo "Approving trusted bot run $run_id"
                  gh api "repos/$REPO/actions/runs/$run_id/approve" --method POST
                done
            done
      # Refine's questions do not wait forever. Nine of the 21 batches that were really asked in
      # Odyssey, Numa, Bots and DeliveryMetrics up to November 2026 never got a reply, and those
      # issues stayed parked. Each question now carries the answer the bot would take, and once
      # the working hours pass, or the author or an assignee reacts with a thumbs-up, refine runs
      # again in assume mode and takes them. Batches written before the proposals existed, and any
      # batch holding a question that needs a decision, still wait for a person.
      - name: Take refine's proposed answers once nobody replied in time
        if: env.REFINE_ANSWER_TIMEOUT_HOURS != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REFINE_MARKER: "<!-- agent-refine -->"
          QUESTIONS_LINE: "I have some questions about this issue"
          PROPOSED_TAG: "**Proposed:**"
          DECISION_TAG: "**Your decision needed:**"
        run: |
          set -euo pipefail
          timeout_hours="${REFINE_ANSWER_TIMEOUT_HOURS:-24}"

          # Hours since $1 that fall on a weekday, in UTC, counted up to the timeout and no further.
          working_hours_since() {
            local t now h=0
            t=$(date -u -d "$1" +%s)
            now=$(date -u +%s)
            while [ "$t" -lt "$now" ] && [ "$h" -lt "$timeout_hours" ]; do
              [ "$(date -u -d "@$t" +%u)" -le 5 ] && h=$((h + 1))
              t=$((t + 3600))
            done
            echo "$h"
          }

          gh issue list --repo "$REPO" --state open --label refine --label review --limit 100 \
            --json number,author,assignees,labels \
            --jq '.[] | select([.labels[].name] | (index("bot-working") or index("assumed")) | not)
                  | [.number, ([.author.login] + [.assignees[].login] | join(" "))] | @tsv' |
            while IFS=$'\t' read -r issue people; do
              [ -n "$issue" ] || continue
              comments=$(gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" | jq -s 'add // []')
              asked=$(jq -c --arg marker "$REFINE_MARKER" --arg line "$QUESTIONS_LINE" '
                [.[] | select(.user.type == "Bot" and (.body | contains($marker)) and (.body | contains($line)))]
                | last // empty | {id, created_at, body}' <<<"$comments")
              [ -n "$asked" ] || continue
              asked_at=$(jq -r '.created_at' <<<"$asked")
              body=$(jq -r '.body' <<<"$asked")

              # A person spoke after the questions: that reply is refine's to read, not a silence.
              replied=$(jq --arg at "$asked_at" '[.[] | select(.user.type != "Bot" and .created_at > $at)] | length' <<<"$comments")
              [ "$replied" -eq 0 ] || continue
              case "$body" in *"$DECISION_TAG"*) echo "#$issue waits for a decision; not assuming."; continue ;; esac
              case "$body" in *"$PROPOSED_TAG"*) ;; *) continue ;; esac

              accepted=false
              thumbs=$(gh api "repos/$REPO/issues/comments/$(jq -r '.id' <<<"$asked")/reactions" \
                --jq '[.[] | select(.content == "+1") | .user.login] | join(" ")' 2>/dev/null || true)
              for login in $thumbs; do
                case " $people " in *" $login "*) accepted=true ;; esac
              done
              hours=$(working_hours_since "$asked_at")
              if [ "$accepted" = true ]; then
                echo "#$issue: the proposed answers were accepted with a thumbs-up; refining with them."
              elif [ "$hours" -ge "$timeout_hours" ]; then
                echo "#$issue: no reply in ${timeout_hours} working hours; refining with the proposed answers."
              else
                continue
              fi
              gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" --method POST \
                -f ref="$(gh api "repos/$REPO" --jq .default_branch)" \
                -f "inputs[operation]=refine" -f "inputs[issue-number]=$issue" -f "inputs[mode]=assume"
            done
