# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/work-router.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "# Main Work Router"

# Owns every repository automation trigger. Classifies each event into exactly one route,
# then calls at most one worker or runs one deterministic job. No model runs here.

# GitHub titles an issue-triggered run with the issue title, so every run on one issue reads
# the same. Name it after the event instead. This is evaluated before any job, so it can
# describe the trigger but not the route the classifier picks.
run-name: >-
  ${{ github.event_name == 'issues'
  && github.event.action == 'opened'
  && format('Event: Issue opened - #{0} {1} by {2}', github.event.issue.number, github.event.issue.title, github.actor)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'implement')
  && format('Agent: Implement - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'refine')
  && format('Agent: Refine - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'direct')
  && format('Working: Direct - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'triage')
  && format('Agent: Triage - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && format('Working: #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'implement'
  && endsWith(github.actor, '[bot]')
  && format('Agent: Implement - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'refine'
  && endsWith(github.actor, '[bot]')
  && format('Agent: Refine - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'direct'
  && endsWith(github.actor, '[bot]')
  && format('Working: Direct - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && format('Event: {0} on #{1} by {2}', github.event.label.name, github.event.issue.number, github.actor)
  || github.event_name == 'issue_comment'
  && format('Event: Comment on #{0} by {1}', github.event.issue.number, github.actor)
  || github.event_name == 'pull_request_review'
  && format('Event: Review on PR #{0} by {1}', github.event.pull_request.number, github.actor)
  || github.event_name == 'pull_request_review_comment'
  && format('Event: Review comment on PR #{0} by {1}', github.event.pull_request.number, github.actor)
  || github.event_name == 'pull_request_target'
  && format('Event: PR #{0} {1} by {2}', github.event.pull_request.number, github.event.action, github.actor)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'triage'
  && format('Agent: Triage - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'refine'
  && format('Agent: Refine - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'implement'
  && format('Agent: Implement - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && (inputs.operation == 'merge-gate' || inputs.operation == 'merge-train' || inputs.operation == 'reconcile-bot-pr-runs')
  && format('Event: {0}{1} forwarded to Agentics: Merge Belt', inputs.operation, inputs.pr-number != '' && format(' on PR #{0}', inputs.pr-number) || '')
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'evidence'
  && format('Agentics: Evidence - PR #{0}', inputs.pr-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'batch'
  && format('Working: Batch - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'audit'
  && format('Agent: Audit - manual{0}', '')
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'docs-audit'
  && format('Agent: Docs Audit - manual{0}', '')
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'release'
  && format('Agent: Release{0}', '')
  || github.event_name == 'workflow_dispatch'
  && (inputs.operation == 'housekeeping' || inputs.operation == 'audit-close' || inputs.operation == 'cleanup-artifacts')
  && format('Event: {0} forwarded to Agentics: Housekeeping', inputs.operation)
  || github.event_name == 'workflow_dispatch'
  && format('dispatch: {0}', inputs.operation)
  || github.event_name == 'schedule'
  && github.event.schedule == '17 1 * * 1'
  && format('Agent: Audit - weekly{0}', '')
  || github.event_name == 'schedule'
  && github.event.schedule == '47 2 1,15 * *'
  && format('Agent: Docs Audit - fortnightly{0}', '')
  || github.event_name == 'schedule'
  && format('schedule {0}', github.event.schedule)
  || github.event_name }}

# The two values a repository is expected to change, and the only part of this file that is
# not the package's. `workflows update` keeps whatever is here and puts the package's router
# around it, so change them here and nowhere else.
#
# Neither can be read where it is also needed: GitHub evaluates no expression in a
# `workflow_run.workflows:` list or in a `cron:`. The installer therefore mirrors both values
# into the literal lines that need them (the audit slot below, the workflow_run trigger of
# agentics-merge-belt.yml), and the route matrix asserts the copies still agree. Everything
# that runs inside a job reads them from an env: block, including the classifier, which takes
# AUDIT_CRON from this environment.
env:
  # The CI workflow the merge belt reads its verdict from. A repository whose CI has another
  # name gets no gate at all: the belt logs "no completed CI run" and the pull request waits
  # forever, which is a silent failure rather than a red run. No job here reads it any more;
  # `workflows update` copies it into agentics-merge-belt.yml, so this stays the place to set it.
  CI_WORKFLOW_NAME: "App: CI"
  # Slot 0. Every consumer installs this same router, and the agent fleet is one shared,
  # two-VM scale set, so a second repository left on slot 0 audits at the same minute as the
  # first and the two of them consume the whole fleet. Pick a free slot per repository: see
  # "Scheduling across repositories" in the package README.
  AUDIT_CRON: "17 1 * * 1"
  # The same idea for the documentation audit, if it is installed: see the same section of the
  # package README. Two days a month, so a slot is a pair of days rather than a weekday.
  DOCS_AUDIT_CRON: "47 2 1,15 * *"
  # The bot identities whose label changes and pull requests this router trusts. Space
  # separated, and every login the same account can present: GitHub reports an App as
  # `name[bot]` on some endpoints and `app/name` on others, so both spellings belong here.
  # Adding a third bot used to mean finding four hand-written comparisons across this file.
  TRUSTED_BOTS: "github-actions[bot] app/github-actions platform-devbox[bot]"
  # The housekeeping settings (HOUSEKEEPING_*, DEPENDABOT_*, AUDIT_STALE_AFTER_DAYS) live in
  # agentics-housekeeping.yml, and the merge train's (MAX_GATE_ATTEMPTS, MERGE_TRAIN_* except
  # the hold label, REFINE_ANSWER_TIMEOUT_HOURS) in agentics-merge-belt.yml, next to the jobs
  # that read them.
  # The merge train takes the oldest open pull request, bot or person, and moves it one step at a
  # time until it merges or a person has to decide. A pull request with this label stays off it.
  # `workflows update` copies this value into agentics-merge-belt.yml and
  # agentics-housekeeping.yml, whose Dependabot merge skips the same label.
  MERGE_TRAIN_HOLD_LABEL: "hold"
  # "true" lets a chain of features run without a person between them. A feature whose issue is
  # blocked by another (GitHub's "blocked by" relation, or a `Blocked by #N` line in its body) keeps
  # its children held until that feature's stack root merges; the merge brings the default branch
  # into the waiting feature's branch, releases its children, and leaves an "Unattended report"
  # issue naming every pull request that merged on a judgement call. Set the merge gate's own
  # UNATTENDED to the same value. "false" leaves features to be started and read by a person.
  UNATTENDED: "false"
  # How many implement runs may work at once. Each queue is FIFO and serial. An issue joins the
  # queue of its split parent when it has one, so the children of one refine never run side by
  # side on the code they share; independent issues spread across the queues. 1 is one queue
  # for everything, as before this existed. Raise it only with a fleet that has the VMs.
  IMPLEMENT_PARALLELISM: "1"
  # Whether a merged pull request's verification plan is replayed and its screenshots archived on
  # the pull request (evidence.yml). It needs nothing configured: the app starts with the root
  # `pnpm run dev`, and a pull request with no plan costs one API call. Set it to "false" for a
  # repository whose app cannot start on a runner; operation=evidence still works by hand.
  EVIDENCE_ENABLED: "true"

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  pull_request_target:
    # opened / reopened / synchronize feed bot-approve. labeled with merge-gate is forwarded to
    # agentics-merge-belt.yml. A merge into a feature branch lands a stack child
    # (land-stack-child), and every merge routes to evidence, which replays the pull request's
    # verification plan. agentics-merge-belt.yml hears the same merge to move the merge train.
    types: [opened, synchronize, reopened, labeled, closed]

  # CI completions (workflow_run) move the merge train in agentics-merge-belt.yml.

  # Cron to route mapping lives in .github/actions/classify-route/classify-route.sh.
  schedule:
    - cron: "17 1 * * 1" # audit slot, mirrored from env.AUDIT_CRON by the installer
    - cron: "47 2 1,15 * *" # docs-audit slot, mirrored from env.DOCS_AUDIT_CRON by the installer
    # The hourly reconcile is in agentics-merge-belt.yml; the housekeeping, audit-close and
    # cleanup-artifacts crons are in agentics-housekeeping.yml.

  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        type: choice
        options:
          - refine
          - implement
          - triage
          - apply-review
          - merge-gate
          - merge-train
          - evidence
          - audit
          - docs-audit
          - audit-close
          - cleanup-artifacts
          - reconcile-bot-pr-runs
          - housekeeping
          - validate
          - release
      issue-number:
        description: "Issue number (required for refine / implement / direct)"
        required: false
        type: string
      pr-number:
        description: "Pull request number (required for apply-review / merge-gate / evidence)"
        required: false
        type: string
      mode:
        description: "Refine mode: first, rerefine or assume"
        required: false
        type: choice
        options:
          - first
          - rerefine
          - assume
      ci-conclusion:
        description: "CI conclusion for merge-gate dispatch"
        required: false
        type: choice
        options:
          - success
          - failure
          - action_required
      ci-run-id:
        description: "CI workflow run ID for merge-gate dispatch"
        required: false
        type: string
      attempts_so_far:
        description: "Failed merge-gate attempts already made against this CI verdict (filled by the router, not by humans)"
        required: false
        type: string
        default: '0'
      trigger-kind:
        description: "Audit trigger: scheduled or manual"
        required: false
        type: choice
        options:
          - manual
          - scheduled
      dry-run:
        description: "Housekeeping only: print every intended change and write nothing"
        required: false
        type: boolean
        default: false
      version-bump:
        description: "Release version bump: patch, minor, major, or auto"
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  # Public repositories must check repository permission before an event can start a model.
  authorize:
    # Off switch: a repository variable AGENTIC_WORKFLOWS_DISABLED, with any value, stops every
    # route. Every other job needs this one or classify, so nothing runs. For a repository that has
    # the workflows installed but is not ready for them.
    if: vars.AGENTIC_WORKFLOWS_DISABLED == ''
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      is_outside_collaborator: ${{ steps.check.outputs.is_outside_collaborator }}
    steps:
      - name: Check the actor can start an agent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Events with no human actor. `schedule` and `workflow_run` are the fleet triggering
          # itself; `workflow_dispatch` is already restricted by GitHub to write and above.
          case "$EVENT" in
            schedule | workflow_run | workflow_dispatch)
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$EVENT has no untrusted actor."
              exit 0
              ;;
          esac

          # Platform bot owns Safe Outputs. Its label changes must be able to
          # start the follow-on worker, even though GitHub does not report it
          # as a repository collaborator.
          for bot in $TRUSTED_BOTS; do
            if [ "$ACTOR" = "$bot" ]; then
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
            --jq '.permission' 2>/dev/null || echo "none")

          case "$permission" in
            admin | maintain | write)
              # Write or better is a colleague, org member or not: an outside collaborator who
              # was given write is somebody the team chose to work with, and triaging what they
              # open starts an agent nobody asked for. Only read access is the outside door.
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$ACTOR has $permission permission."
              ;;
            read)
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$ACTOR is an outside collaborator (read permission). Triage route eligible."
              ;;
            *)
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$ACTOR has '$permission' permission on this repository. No agent will run."
              ;;
          esac

  classify:
    # The same off switch as authorize; jobs that need only classify stop here.
    if: vars.AGENTIC_WORKFLOWS_DISABLED == ''
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      route: ${{ steps.route.outputs.route }}
      issue-number: ${{ steps.route.outputs.issue-number }}
      pr-number: ${{ steps.route.outputs.pr-number }}
      linked-issue: ${{ steps.route.outputs.linked-issue }}
      ci-conclusion: ${{ steps.route.outputs.ci-conclusion }}
      ci-run-id: ${{ steps.route.outputs.ci-run-id }}
      merge-gate-attempts: ${{ steps.route.outputs.merge-gate-attempts }}
      attempts: ${{ steps.route.outputs.attempts }}
      refine-mode: ${{ steps.route.outputs.refine-mode }}
      triage-mode: ${{ steps.route.outputs.triage-mode }}
      trigger-kind: ${{ steps.route.outputs.trigger-kind }}
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify event into a single route
        id: route
        uses: ./.github/actions/classify-route
        with:
          token: ${{ github.token }}

  call-refine:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'refine' && needs.authorize.outputs.trusted == 'true'
    uses: ./.github/workflows/agent-refine.lock.yml
    concurrency:
      group: refine-${{ needs.classify.outputs.issue-number }}
      cancel-in-progress: false
    # write-all, not a narrower map: every worker's agent job declares `permissions: read-all`,
    # which requests read on every scope. A caller granting less cannot satisfy it, and GitHub
    # rejects the call with a startup failure before any job is created. The real boundary is the
    # worker's own read-all plus safe-outputs, not this grant.
    permissions: write-all
    with:
      issue-number: ${{ needs.classify.outputs.issue-number }}
      mode: ${{ needs.classify.outputs.refine-mode }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # Checks whether an open bot PR already exists for the issue. If it does, implement is
  # skipped - the merge-gate will handle fixing the existing PR. This prevents duplicate
  # PRs when retries are triggered after a merge-gate failure.
  check-implement-pr:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'implement' && needs.authorize.outputs.trusted == 'true'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has-open-pr: ${{ steps.check.outputs.has-open-pr }}
    steps:
      - name: Check for existing open bot PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
        run: |
          set -euo pipefail
          # A refine-to-implement transition emits two label events (the implement label,
          # then the worker re-adding bot-working) and each one classifies to implement.
          # The older router run wins: a younger run that finds an older live implement
          # route for the same issue skips instead of queueing a duplicate worker. Only
          # bot-actor titles are counted, so a human's "waiting for bot-working" run can
          # never block the real one.
          for st in in_progress queued; do
            dupes=$(gh api "repos/$REPO/actions/workflows/work-router.yml/runs?status=$st&per_page=100"               --jq "[.workflow_runs[]
                | select(.id < $GITHUB_RUN_ID)
                | select(
                    ((.display_title | startswith(\"Working (Implement)\")) and (.display_title | contains(\"(#${ISSUE_NUMBER})\")))
                    or
                    ((.display_title | contains(\"implement label on #${ISSUE_NUMBER} by\")) and (.display_title | endswith(\"[bot]\")))
                  )
              ] | length" 2>/dev/null || echo 0)
            if [ "${dupes:-0}" -gt 0 ]; then
              echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
              echo "::notice::An older router run is already implementing #$ISSUE_NUMBER; skipping the duplicate."
              exit 0
            fi
          done

          # Marker-first: implement stamps <!-- implement-pr: N --> on the issue when its
          # pull request is created, so the duplicate check is an exact lookup. Only an
          # OPEN marker PR blocks; a merged or closed one means a re-implement is legitimate.
          marker_pr=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' \
            | grep -oE '<!-- implement-pr: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$marker_pr" ]; then
            state=$(gh pr view "$marker_pr" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo GONE)
            if [ "$state" = "OPEN" ]; then
              echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Issue #$ISSUE_NUMBER is marked as implemented by open PR #$marker_pr. Skipping duplicate implement."
              exit 0
            fi
            echo "Marker PR #$marker_pr is $state; a fresh implement is allowed."
          fi

          existing=$(gh pr list --repo "$REPO" --state open --json number,author,body \
            --jq "[.[]
              | select(.author.login | startswith(\"app/\") or endswith(\"[bot]\"))
              | (.body | ascii_downcase) as \$body
              | select(\$body | contains(\"close #${ISSUE_NUMBER}\") or contains(\"closes #${ISSUE_NUMBER}\") or contains(\"closed #${ISSUE_NUMBER}\") or contains(\"fix #${ISSUE_NUMBER}\") or contains(\"fixes #${ISSUE_NUMBER}\") or contains(\"fixed #${ISSUE_NUMBER}\") or contains(\"resolve #${ISSUE_NUMBER}\") or contains(\"resolves #${ISSUE_NUMBER}\") or contains(\"resolved #${ISSUE_NUMBER}\"))
            ] | length")
          if [ "$existing" -gt 0 ]; then
            echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Issue #$ISSUE_NUMBER already has an open bot PR. Skipping implement to prevent duplicates."
            exit 0
          fi

          # A person working on the issue rarely writes a closing keyword: Pliny-Bot #633 said
          # "Implements #627", and an hour later the bot opened #639 for the same issue. Any open
          # pull request by a person that names the issue in its title, body or branch holds it.
          human=$(gh pr list --repo "$REPO" --state open --json number,author,title,body,headRefName \
            --jq "[.[]
              | select((.author.login | startswith(\"app/\") or endswith(\"[bot]\")) | not)
              | select(((.title + \"\n\" + (.body // \"\")) | test(\"#${ISSUE_NUMBER}([^0-9]|$)\"))
                  or (.headRefName | test(\"(issue|gh)[-_/]?${ISSUE_NUMBER}([^0-9]|$)\"; \"i\")))
              | .number] | first // empty")
          if [ -n "$human" ]; then
            echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Open PR #$human by a person names #$ISSUE_NUMBER. Skipping implement so the two do not collide."
          else
            echo "has-open-pr=false" >> "$GITHUB_OUTPUT"
          fi

  # A stack child implements on the feature branch its parent issue names. The agent sandbox
  # cannot resolve that branch itself -- agents have no git credentials and checkout a pinned
  # default-branch SHA -- so the router reads the marker and resolves the dispatch ref before
  # the worker starts. Refine stamps `<!-- stack-root-branch: feat/N -->` both on the PARENT
  # feature issue and on every child body at hand-over, so the child is self-describing for
  # the implement prompt, which reads only the child's context. The split-parent chain is the
  # fallback when a child predates the stamp (retries of issues split by an earlier refine).
  # Missing, empty or garbled markers fail closed: the child takes the flat call-implement
  # path and lands on the default branch, exactly what a repo without stacks does today.
  # The in-flight check exists because a dispatched agent-implement run is invisible to
  # check-implement-pr's older-run dupe check: this router run completes as soon as
  # `gh workflow run` returns (fire-and-forget), while a workflow_call caller stays
  # in_progress -- and the dispatch run's title "Working (Implement)" and the App-token
  # label events' actor "app/..." both miss the title conditions that check matches.
  # head_branch is the discriminator: a dispatched implement's run records the dispatch ref,
  # feat/N, while a workflow_call run's head_branch is the default branch. Filtering
  # in_progress/queued agent-implement.lock.yml runs by head_branch therefore isolates stack
  # implements with zero effect on flat runs.
  check-stack-branch:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'implement' && needs.authorize.outputs.trusted == 'true'
    runs-on: agents-arc
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      is-stack: ${{ steps.stack.outputs.is-stack }}
      stack-branch: ${{ steps.stack.outputs.stack-branch }}
      stack-in-flight: ${{ steps.inflight.outputs.stack-in-flight }}
      stack-blocked: ${{ steps.blocked.outputs.stack-blocked }}
      flat-blocked: ${{ steps.flatblocked.outputs.flat-blocked }}
      implement-queue: ${{ steps.queue.outputs.queue }}
    steps:
      # Which implement queue this issue waits in. The children of one refine share a queue,
      # keyed on their split parent, because they build on each other's code and two of them at
      # once would each cut from a main the other is about to change. Anything else is keyed on
      # its own number. A body that cannot be read keys on the issue: a wrong queue only costs
      # parallelism, never order within a feature.
      - name: Pick the implement queue
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
        run: |
          set -euo pipefail
          queues="${IMPLEMENT_PARALLELISM:-1}"
          case "$queues" in ''|*[!0-9]*|0) queues=1 ;; esac
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')
          parent=$(printf '%s' "$body" | grep -oE '<!-- split-parent: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
          key="${parent:-$ISSUE_NUMBER}"

          # The queue is the key's place among the keys of every issue waiting for an implement, not
          # the key modulo the number of queues. Three independent issues whose numbers were all
          # multiples of three (Pliny-Bot #726, #750 and #694, whose parent is #690) landed in queue
          # zero together and ran one after another behind a three-hour run while two queues sat
          # empty. A place among the waiting keys puts independent issues in different queues, and
          # the children of one refine, which share a key, still share one.
          waiting=$(
            { printf '%s\n' "$key"
              gh issue list --repo "$REPO" --label "implement" --state open --limit 100 --json number,body \
                --jq '.[] | ((.body // "") | capture("<!-- split-parent: (?<p>[0-9]+) -->").p) // (.number | tostring)' \
                2>/dev/null || true
            } | grep -E '^[0-9]+$' | sort -un
          )
          place=0
          index=0
          for candidate in $waiting; do
            [ "$candidate" = "$key" ] && place=$index
            index=$((index + 1))
          done
          queue=$(( place % queues ))
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
          echo "#$ISSUE_NUMBER waits in implement queue $queue of $queues (keyed on #$key, place $place among $index waiting)."
      - name: Resolve the feature branch from the stack markers
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
        run: |
          set -euo pipefail
          echo "is-stack=false" >> "$GITHUB_OUTPUT"
          echo "stack-branch=" >> "$GITHUB_OUTPUT"

          # Read failures degrade to the flat path, never to a failed job: call-implement
          # names this job in its needs, so a failure here would block a perfectly ordinary
          # flat implement run. A repo without stack markers must behave exactly as before.
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')
          # Marker-first: the child may carry its own resolved marker from an earlier hop.
          # `|| true` on both pipelines: under `set -o pipefail`, grep's exit 1 on no match
          # (the common flat case) or head's SIGPIPE on a multi-marker body must not fail
          # the job -- call-implement needs this job, so a failure here would block flat
          # implements too.
          branch=$(printf '%s' "$body" | grep -oE '<!-- stack-root-branch: [^ ]+ -->' | head -1 | sed -E 's/<!-- stack-root-branch: ([^ ]+) -->/\1/' || true)

          if [ -z "$branch" ]; then
            # No marker on the child: follow the split-parent chain to the feature issue,
            # where refine stamps the stack root.
            parent=$(printf '%s' "$body" \
              | grep -oE '<!-- split-parent: [0-9]+ -->' | head -1 \
              | grep -oE '[0-9]+' || true)
            if [ -n "$parent" ]; then
              parent_body=$(gh issue view "$parent" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')
              branch=$(printf '%s' "$parent_body" \
                | grep -oE '<!-- stack-root-branch: [^ ]+ -->' | head -1 \
                | sed -E 's/<!-- stack-root-branch: ([^ ]+) -->/\1/' || true)
            fi
          fi

          # Fail closed on anything unreadable or unsafe: a missing marker, a garbled
          # split parent, or a marker naming a deleted branch all take the flat path.
          if ! printf '%s' "$branch" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::notice::Issue #$ISSUE_NUMBER carries no readable stack-root-branch marker; taking the flat path."
            exit 0
          fi
          if ! gh api "repos/$REPO/branches/$(printf '%s' "$branch" | sed 's|/|%2F|g')" --jq '.name' >/dev/null 2>&1; then
            echo "::notice::Stack root branch $branch no longer exists on the remote; taking the flat path."
            echo "stack-branch=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is-stack=true" >> "$GITHUB_OUTPUT"
          echo "stack-branch=$branch" >> "$GITHUB_OUTPUT"

      # A child whose `Blocked by #N` sibling has not landed is held, not dispatched: dispatched now
      # it would cut from a feature branch that lacks the sibling's work. Lyceum #112 (units,
      # blocked by #111, modules) was dispatched alongside #111 and would have built units on a
      # feat/45 with no modules. The in-flight check below cannot catch that: both routers ran
      # before either dispatch existed, and serialising runs would still start #112 before #111's
      # pull request merged. The landing of the blocker releases the child (land-stack-child).
      # Held, it keeps `implement` and loses `bot-working`, so it reads as
      # waiting rather than stuck.
      - name: Hold a child whose blockers have not landed
        id: blocked
        if: steps.stack.outputs.is-stack == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
          STACK_BRANCH: ${{ steps.stack.outputs.stack-branch }}
        run: |
          set -euo pipefail
          echo "stack-blocked=false" >> "$GITHUB_OUTPUT"
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')
          waiting=""
          for b in $(printf '%s' "$body" | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' | sort -u || true); do
            gh issue view "$b" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open || continue
            # Open, but landed if a pull request that closes it has merged into the feature branch:
            # the release fires on that merge and the gate closes the issue a moment later, or not
            # at all when it fails. Reading the issue state alone would hold the child again with
            # no later landing left to release it.
            landed=$(gh pr list --repo "$REPO" --state merged --base "$STACK_BRANCH" --search "#$b in:body"               --json body --jq "[.[] | select(.body | test(\"(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?) #${b}([^0-9]|$)\"))] | length" 2>/dev/null || echo 0)
            [ "${landed:-0}" -gt 0 ] && continue
            waiting="$waiting #$b"
          done
          # Unattended, a whole feature can wait on another one: its issue is blocked by a feature
          # whose stack root has not merged into the default branch. Every child of it waits, whatever
          # its own siblings say, and stack-landed releases them when that root merges.
          if [ "${UNATTENDED:-false}" = true ]; then
            feature=$(printf '%s' "$body" | grep -oE '<!-- split-parent: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
            if [ -n "$feature" ]; then
              for b in $( { gh api "repos/$REPO/issues/$feature/dependencies/blocked_by" --jq '.[].number' 2>/dev/null || true
                            gh issue view "$feature" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
                              | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' || true
                          } | sort -u ); do
                # A feature's own children are not what the feature waits on. Refine's tracker lists them
                # in the feature body as "#N ... Blocked by #M", and reading those lines as the feature's
                # blockers held every child behind its siblings, and the first one behind itself.
                info=$(gh issue view "$b" --repo "$REPO" --json state,body 2>/dev/null) || continue
                printf '%s' "$info" | jq -e '(.state // "" | ascii_downcase) == "open"' >/dev/null || continue
                printf '%s' "$info" | jq -r '.body // ""' | grep -qF "<!-- split-parent: ${feature} -->" && continue
                waiting="$waiting #$b"
              done
            fi
          fi
          # One child of a stack at a time. A sibling's pull request still open on the feature branch
          # means this child would cut from a branch that is about to change under it, and whichever
          # lands second conflicts (Odyssey feat/323: three children built side by side, two left
          # DIRTY). That sibling's landing releases the next child. The child's own pull request,
          # if it has one, is not a sibling.
          if [ -z "$waiting" ]; then
            for pr in $(gh pr list --repo "$REPO" --state open --base "$STACK_BRANCH" --limit 100 --json number,body \
                          --jq ".[] | select(.body | test(\"(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?) #${ISSUE_NUMBER}([^0-9]|$)\") | not) | .number" 2>/dev/null || true); do
              waiting="$waiting #$pr"
            done
          fi
          [ -n "$waiting" ] || exit 0
          echo "::notice::#$ISSUE_NUMBER is blocked by$waiting, not yet landed; holding it."
          echo "stack-blocked=true" >> "$GITHUB_OUTPUT"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label bot-working >/dev/null 2>&1 || true
          marker='<!-- stack-held -->'
          if ! gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF "$marker"; then
            {
              printf '%s\n' "$marker"
              printf "Held until%s have landed: this child builds on them. It keeps \`implement\` and is released when they merge (a sibling into \`%s\`, a feature it waits on into the default branch).\n" "$waiting" "$STACK_BRANCH"
            } > /tmp/held.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/held.md >/dev/null || true
          fi

      # Unattended, a feature refine did not split takes the flat path, which has no stack to wait
      # in. Blocked by a feature that has not landed, it would build on a default branch without
      # that feature. It is held the same way a child is, and stack-landed releases it.
      - name: Hold an unsplit feature whose blockers have not landed
        id: flatblocked
        if: steps.stack.outputs.is-stack != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
        run: |
          set -euo pipefail
          echo "flat-blocked=false" >> "$GITHUB_OUTPUT"
          [ "${UNATTENDED:-false}" = true ] || exit 0
          waiting=""
          for b in $( { gh api "repos/$REPO/issues/$ISSUE_NUMBER/dependencies/blocked_by" --jq '.[].number' 2>/dev/null || true
                        gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
                          | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' || true
                      } | sort -u ); do
            gh issue view "$b" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open || continue
            waiting="$waiting #$b"
          done
          [ -n "$waiting" ] || exit 0
          echo "::notice::#$ISSUE_NUMBER is blocked by$waiting, not yet landed; holding it."
          echo "flat-blocked=true" >> "$GITHUB_OUTPUT"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label bot-working >/dev/null 2>&1 || true
          marker='<!-- stack-held -->'
          if ! gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF "$marker"; then
            # shellcheck disable=SC2016
            printf '%s\nHeld until%s have landed on the default branch: this feature builds on them. It keeps `implement` and is released when they merge.\n' "$marker" "$waiting" > /tmp/held.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/held.md >/dev/null || true
          fi

      - name: Detect an in-flight implement on the feature branch
        id: inflight
        if: steps.stack.outputs.is-stack == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STACK_BRANCH: ${{ steps.stack.outputs.stack-branch }}
        run: |
          set -euo pipefail
          echo "stack-in-flight=false" >> "$GITHUB_OUTPUT"
          # Only dispatched stack implements run with head_branch = feat/N; a workflow_call
          # (flat) implement run's head_branch is the default branch, so this filter never
          # sees it. This closes the dupe-visibility gap left by fire-and-forget dispatch.
          for status in in_progress queued; do
            live=$(gh api "repos/$REPO/actions/workflows/agent-implement.lock.yml/runs?status=$status&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_branch == \"${STACK_BRANCH}\")] | length" 2>/dev/null || echo 0)
            if [ "${live:-0}" -gt 0 ]; then
              echo "::notice::An implement run is already in flight on $STACK_BRANCH; skipping dispatch."
              echo "stack-in-flight=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

  call-implement:
    needs: [classify, authorize, check-implement-pr, check-stack-branch]
    if: needs.classify.outputs.route == 'implement' && needs.authorize.outputs.trusted == 'true' && needs.check-implement-pr.outputs.has-open-pr != 'true' && needs.check-stack-branch.outputs.is-stack != 'true' && needs.check-stack-branch.outputs.flat-blocked != 'true'
    uses: ./.github/workflows/agent-implement.lock.yml
    # One FIFO queue per IMPLEMENT_PARALLELISM slot, chosen by check-stack-branch: the children of
    # one refine always share a queue, independent issues spread across them.
    concurrency:
      group: implement-queue-${{ needs.check-stack-branch.outputs.implement-queue || '0' }}
      cancel-in-progress: false
      # FIFO, up to 100 waiting. Without this the default `queue: single` cancels whatever
      # was pending, so labelling six issues at once implements one and drops the rest.
      queue: max
    permissions: write-all
    with:
      issue-number: ${{ needs.classify.outputs.issue-number }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # Stack children dispatch agent-implement by `gh workflow run --ref feat/N` instead of calling
  # it: a workflow_call would pin the callee to THIS event's SHA, which for a label event is
  # the default branch, not the feature branch. Dispatch on the feature ref makes the callee's
  # GITHUB_SHA the feature tip, so the agent patches exactly the tree its PR will target, and
  # the compile-time checkout ternary keys off `workflow_dispatch` to checkout github.ref_name.
  # The dispatch itself carries no secrets (gh workflow run cannot forward them); the
  # dispatched run reads REPO-LEVEL OPENAI_API_KEY / CODEX_API_KEY / COPILOT_GITHUB_TOKEN, the
  # stack-activation prerequisite documented alongside the markers. BOT_APP_ID / BOT_PRIVATE_KEY
  # are already repo-level. dispatch-triage proves the pattern: same app-token mint, same
  # `actions: write` scope needed for `gh workflow run`.
  dispatch-implement:
    needs: [classify, authorize, check-implement-pr, check-stack-branch]
    if: >
      needs.classify.outputs.route == 'implement' &&
      needs.authorize.outputs.trusted == 'true' &&
      needs.check-implement-pr.outputs.has-open-pr != 'true' &&
      needs.check-stack-branch.outputs.is-stack == 'true' &&
      needs.check-stack-branch.outputs.stack-in-flight != 'true' &&
      needs.check-stack-branch.outputs.stack-blocked != 'true'
    runs-on: agents-arc
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Dispatch stack implement on the feature branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          STACK_BRANCH: ${{ needs.check-stack-branch.outputs.stack-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
          ATTEMPTS: ${{ needs.classify.outputs.attempts }}
        run: |
          set -euo pipefail
          # A dispatch on the feature ref runs the feature branch's own copy of the workflows, so a
          # branch cut before a workflow fix keeps running the old one: Pliny-Bot #774 ran every
          # tier on glm-5-2 from feat/767 after main had dropped the pin. Bring the default branch
          # in first. A conflict (409) leaves the branch as it is; the run still goes ahead.
          code=$(gh api -X POST "repos/$REPO/merges" -f base="$STACK_BRANCH" -f head="$DEFAULT_BRANCH"             -f commit_message="chore: bring $DEFAULT_BRANCH into $STACK_BRANCH before a child runs"             --silent -i 2>/dev/null | head -1 | awk '{print $2}' || true)
          echo "Merged $DEFAULT_BRANCH into $STACK_BRANCH: HTTP ${code:-unknown} (201 merged, 204 up to date, 409 conflict)"
          gh workflow run agent-implement.lock.yml --repo "$REPO" --ref "$STACK_BRANCH" \
            -f issue-number="$ISSUE_NUMBER" \
            -f attempts_so_far="$ATTEMPTS"

  dispatch-triage:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'triage' && needs.authorize.outputs.is_outside_collaborator == 'true'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Dispatch trusted triage run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
          MODE: ${{ needs.classify.outputs.triage-mode }}
        run: |
          set -euo pipefail
          gh workflow run work-router.yml --repo "$REPO" --ref "$REF" \
            -f operation=triage \
            -f issue-number="$ISSUE_NUMBER" \
            -f mode="$MODE"

  call-triage:
    needs: [classify, authorize]
    # Triage on issue open is for read-only outside collaborators only (handled by dispatch-triage).
    # A trusted actor who opens an issue should not start triage - they can add refine/implement/direct
    # labels or manually dispatch triage. All other triage routes (labeled, comment, dispatch) are trusted.
    if: needs.classify.outputs.route == 'triage' && needs.authorize.outputs.trusted == 'true' && !(github.event_name == 'issues' && github.event.action == 'opened')
    uses: ./.github/workflows/agent-triage.lock.yml
    concurrency:
      group: triage-${{ needs.classify.outputs.issue-number }}
      cancel-in-progress: false
    permissions: write-all
    with:
      issue-number: ${{ needs.classify.outputs.issue-number }}
      mode: ${{ needs.classify.outputs.triage-mode }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  call-apply-review:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'apply-review' && needs.authorize.outputs.trusted == 'true'
    uses: ./.github/workflows/agent-apply-review.lock.yml
    concurrency:
      group: pr-feedback-${{ needs.classify.outputs.pr-number }}
      cancel-in-progress: false
    permissions: write-all
    with:
      pr-number: ${{ needs.classify.outputs.pr-number }}
      linked-issue: ${{ needs.classify.outputs.linked-issue }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # Screenshots of a merged pull request, replayed from the verification plan its implementation
  # wrote and archived beside that plan. Plain YAML with no model, so no secret is passed and the
  # grant is exactly what the publish job writes: one commit of evidence/ folders and one comment. Its capture
  # job runs the pull request's code with read-only access; only publish holds these writes, and it
  # runs no repository code.
  call-evidence:
    needs: classify
    if: needs.classify.outputs.route == 'evidence'
    uses: ./.github/workflows/evidence.yml
    concurrency:
      group: evidence-${{ needs.classify.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      pr-number: ${{ needs.classify.outputs.pr-number }}

  call-audit:
    needs: classify
    if: needs.classify.outputs.route == 'audit'
    uses: ./.github/workflows/agent-audit.lock.yml
    concurrency:
      group: audit
      cancel-in-progress: false
    permissions: write-all
    with:
      trigger-kind: ${{ needs.classify.outputs.trigger-kind }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  call-docs-audit:
    needs: classify
    if: needs.classify.outputs.route == 'docs-audit'
    uses: ./.github/workflows/agent-docs-audit.lock.yml
    concurrency:
      group: docs-audit
      cancel-in-progress: false
    permissions: write-all
    with:
      trigger-kind: ${{ needs.classify.outputs.trigger-kind }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  call-release:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'release' && needs.authorize.outputs.trusted == 'true'
    uses: ./.github/workflows/agent-release.lock.yml
    permissions: write-all
    with:
      version-bump: ${{ github.event.inputs.version-bump || 'auto' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      # The release PR is pushed and opened with the App token so its CI runs; see conclude.
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}

  bot-approve:
    needs: classify
    if: >
      needs.classify.outputs.route == 'bot-approve' &&
        (github.actor == 'app/github-actions' || github.actor == 'platform-devbox[bot]')
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Approve pending workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api "repos/$REPO/actions/runs?status=action_required&branch=$BRANCH" \
              --jq '.workflow_runs[].id'
          )

          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "No runs awaiting approval on branch $BRANCH"
            exit 0
          fi

          for run_id in "${run_ids[@]}"; do
            echo "Approving run $run_id"
            gh api "repos/$REPO/actions/runs/$run_id/approve" --method POST
          done

  # A stack child landing. A pull request merged into a feature branch rather than the default
  # branch is one child of a stack: it may unblock siblings that waited on it, and it may be the
  # last one, which makes the root pull request ready for a person. Event-gated rather than a
  # route because a merge already routes to evidence. It NEVER checks out or runs pull request
  # code; it reads issues and pull requests through the API and writes labels and one comment.
  land-stack-child:
    needs: classify
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout for App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Release unblocked children and announce a complete stack
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Stacked delivery: the merged pull request merged into a feature branch, not the
          # default branch, so this is a child landing. If the feature branch has no open
          # children left and its root pull request is green, the stack is complete and a
          # comment on the root pull request tells the human it is ready for the root merge.
          # Repos without stack markers never reach the interesting part: the event PR's base
          # was the default branch, so the guard below fails immediately. Fully idempotent:
          # the completion comment carries its own marker, and a run that finds it already
          # present exits without writing anything.
          event_base=$(gh api "repos/$REPO/pulls/$EVENT_PR" --jq '.base.ref // empty' 2>/dev/null || echo '')
          if [ -n "$event_base" ] && [ "$event_base" != "$DEFAULT_BRANCH" ]; then
            echo "PR #$EVENT_PR merged into a feature branch; checking the stack."
            # The implement worker's pull request closes exactly its own child issue, so
            # the closed issue comes from the linked closing references (the resolved form
            # GitHub computes whatever keyword the agent wrote), with the body text as
            # fallback for a PR created before that guarantee.
            closed_issue=$(gh pr view "$EVENT_PR" --repo "$REPO" --json closingIssuesReferences \
              --jq '.closingIssuesReferences[0].number // empty' 2>/dev/null || true)
            [ -n "$closed_issue" ] || closed_issue=$(gh api "repos/$REPO/pulls/$EVENT_PR" --jq '.body // ""' \
              | grep -oiE '(closes?|fixes?|resolves?) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            if [ -z "$closed_issue" ]; then
              echo "PR #$EVENT_PR closes no issue; not a stack child. Nothing to do."
            else
              # Refine stamps the split-parent marker on every child body it hands over, so
              # the child's own body names the feature issue. The reverse sub-issues
              # listing has no equivalent per-child lookup: the sub-issues API only walks
              # downward from the parent.
              parent=$(printf '%s' "$(gh issue view "$closed_issue" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')" \
                | grep -oE '<!-- split-parent: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
              if [ -z "$parent" ]; then
                echo "#$closed_issue is not a stack child issue (no parent found); nothing stack-related to do."
              else
                root_pr=$(printf '%s' "$(gh issue view "$parent" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')" \
                  | grep -oE '<!-- stack-root-pr: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
                # Case-insensitive on purpose, here and in the child count below: `gh pr view` and
                # `gh issue view` read GraphQL and answer OPEN, where the REST API answers open. An
                # exact `open` never matched, so no root was ever open and no child was ever counted
                # open, and the stack-complete announcement could not fire (Lyceum #44, router run
                # 38752856518: "Stack #44 has no open root pull request" with #70 open).
                root_open=false
                [ -n "$root_pr" ] && root_open=$(gh pr view "$root_pr" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open && echo true || echo false)
                if [ "$root_open" != true ]; then
                  echo "Stack #$parent has no open root pull request; nothing to announce."
                else
                  # The same child listing refine uses to hand work out: the sub-issues
                  # link safe_outputs writes, with the body-marker search as fallback. A
                  # stack parent always has children, so a listing that finds none means
                  # the lookups failed, and announcing completion of a stack we cannot
                  # see would be wrong -- stay silent and let a rerun decide.
                  children=$(gh api "repos/$REPO/issues/$parent/sub_issues" --jq '.[].number' 2>/dev/null || true)
                  if [ -z "$children" ]; then
                    children=$(gh issue list --repo "$REPO" --state open --limit 50 \
                      --search "\"<!-- split-parent: ${parent} -->\" in:body" --json number --jq '.[].number' || true)
                  fi
                  if [ -z "$children" ]; then
                    echo "Cannot list any child of stack #$parent; leaving completion undetected for a rerun."
                  else
                  # Release the children this landing unblocks. check-stack-branch holds a child
                  # whose `Blocked by #N` sibling is still open, and nothing else re-dispatches it,
                  # so the landing does: re-adding `implement` with the App token is a bot label
                  # event, which the router routes straight to implement. The child that just
                  # landed counts as done even before the gate closes its issue a moment later.
                  #
                  # One child per landing, the lowest-numbered one that is free. Releasing every free
                  # sibling at once started three implements on Odyssey's feat/323 within a second;
                  # each cut from the same branch, and every landing left the others conflicting. The
                  # next landing releases the next child. A held child with no `Blocked by` of its
                  # own (held because a sibling was in flight) is free once it carries the hold marker.
                  # shellcheck disable=SC2086
                  for child in $(printf '%s\n' $children | sort -n); do
                    [ "$child" = "$closed_issue" ] && continue
                    meta=$(gh issue view "$child" --repo "$REPO" --json state,labels,body 2>/dev/null || echo '{}')
                    printf '%s' "$meta" | jq -e '(.state // "" | ascii_downcase) == "open"' >/dev/null || continue
                    printf '%s' "$meta" | jq -e '[.labels[]?.name] | (index("implement") != null) and (index("bot-working") == null) and (index("pr-pending") == null)' >/dev/null || continue
                    blockers=$(printf '%s' "$meta" | jq -r '.body // ""' | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
                    if [ -z "$blockers" ]; then
                      gh api "repos/$REPO/issues/$child/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF '<!-- stack-held -->' || continue
                    fi
                    waiting=""
                    for b in $blockers; do
                      [ "$b" = "$closed_issue" ] && continue
                      if gh issue view "$b" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open; then
                        waiting="$waiting #$b"
                      fi
                    done
                    if [ -n "$waiting" ]; then
                      echo "#$child still waits on$waiting."
                      continue
                    fi
                    gh issue edit "$child" --repo "$REPO" --remove-label implement >/dev/null 2>&1 || true
                    gh issue edit "$child" --repo "$REPO" --add-label implement >/dev/null
                    echo "Released #$child: everything it was blocked by has landed. The next landing releases the next one."
                    break
                  done
                  open_children=0
                  for child in $children; do
                    # Landed, though the gate may not have closed its issue yet.
                    [ "$child" = "$closed_issue" ] && continue
                    if gh issue view "$child" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open; then
                      open_children=$((open_children + 1))
                    fi
                  done
                  if [ "$open_children" -gt 0 ]; then
                    echo "$open_children child issue(s) still open on stack #$parent; the stack continues."
                  else
                    # Announce as soon as the last child lands, whatever the root's CI is doing at
                    # this instant. The landing itself pushes to the feature branch, so the root's CI
                    # is usually still running here; waiting for green left the announcement unposted
                    # with nothing to post it later but the six-hourly housekeeping (Odyssey #332 sat
                    # with an auto-merge verdict, held, from 00:09 until a person announced it). The
                    # gate still reads CI and mergeability itself before it merges the root.
                    completion_marker='<!-- stack-complete -->'
                    # The announcement is a pull request comment, and pull request
                    # comments live at the issue endpoint for the pull request number,
                    # so the marker is looked for where the comment was posted.
                    already=$(gh api "repos/$REPO/issues/$root_pr/comments?per_page=100" \
                      --jq "[.[] | select(.body | contains(\"$completion_marker\"))] | length" 2>/dev/null || echo 0)
                    if [ "${already:-0}" -gt 0 ]; then
                      echo "Stack #$parent already has a completion announcement; staying silent."
                    else
                      gh pr comment "$root_pr" --repo "$REPO" --body "Stack complete: all children have merged into the feature branch. This root pull request is ready to merge into $DEFAULT_BRANCH once its CI is green: the merge gate decides it next, and a person is asked only when its blast radius or a finding says so. $completion_marker"
                      echo "Stack #$parent complete: announced root PR #$root_pr."
                    fi
                  fi
                  fi
                fi
              fi
            fi
          fi

  # A stack root merged into the default branch: the feature is in. When the repository works
  # unattended two things follow: the next feature in a chain starts, and a report is left for the
  # person who comes back. Event-gated, like land-stack-child, because a merge already routes to
  # evidence. It NEVER checks out or runs pull request code; it reads and writes through the API.
  stack-landed:
    needs: classify
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout for App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Start the next feature in the chain and write the report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${UNATTENDED:-false}" != true ]; then
            echo "UNATTENDED is not true: features are chained and reported by a person."
            exit 0
          fi

          # The feature this root delivered: a closed issue that names this pull request as its
          # stack root. A merge that is not a stack root (every ordinary pull request) ends here.
          parent=""
          for issue in $(gh pr view "$EVENT_PR" --repo "$REPO" --json closingIssuesReferences \
                           --jq '.closingIssuesReferences[].number' 2>/dev/null || true); do
            root=$(gh issue view "$issue" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
              | grep -oE '<!-- stack-root-pr: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
            if [ "$root" = "$EVENT_PR" ]; then parent="$issue"; break; fi
          done
          if [ -z "$parent" ]; then
            echo "PR #$EVENT_PR is not a stack root; nothing to do."
            exit 0
          fi
          root_branch=$(gh pr view "$EVENT_PR" --repo "$REPO" --json headRefName --jq '.headRefName')
          echo "Stack #$parent landed on $DEFAULT_BRANCH through #$EVENT_PR ($root_branch)."

          # What a feature waits on is read from the issue's native "blocked by" relation and from
          # `Blocked by #N` lines in its body, because refine rewrites a body and the relation
          # survives that. Open ones only; the feature that just landed counts as done even before
          # GitHub has closed its issue.
          blockers_of() {
            {
              gh api "repos/$REPO/issues/$1/dependencies/blocked_by" --jq '.[] | select(.state == "open") | .number' 2>/dev/null || true
              for b in $(gh issue view "$1" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
                           | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' | sort -u || true); do
                # The feature's own children, listed in its tracker with their own "Blocked by", are not blockers.
                info=$(gh issue view "$b" --repo "$REPO" --json state,body 2>/dev/null) || continue
                printf '%s' "$info" | jq -e '(.state // "" | ascii_downcase) == "open"' >/dev/null || continue
                printf '%s' "$info" | jq -r '.body // ""' | grep -qF "<!-- split-parent: $1 -->" && continue
                echo "$b"
              done
            } | grep -vx "$parent" | sort -u || true
          }
          depends_on_parent() {
            { gh api "repos/$REPO/issues/$1/dependencies/blocked_by" --jq '.[].number' 2>/dev/null || true
              gh issue view "$1" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
                | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' || true
            } | grep -qx "$parent"
          }

          # The held children of every feature that was waiting on this one.
          declare -A next_branch
          declare -A next_children
          candidates=$(gh issue list --repo "$REPO" --state open --label implement --limit 200 \
            --json number,labels,body \
            --jq '.[] | select([.labels[].name] | index("bot-working") | not)
                      | select(.body | test("<!-- split-parent: [0-9]+ -->"))
                      | [.number, (.body | capture("<!-- split-parent: (?<p>[0-9]+) -->").p)] | @tsv')
          while IFS=$'\t' read -r child feature; do
            [ -n "${child:-}" ] || continue
            depends_on_parent "$feature" || continue
            [ -z "$(blockers_of "$feature")" ] || { echo "Feature #$feature still waits on other work; leaving #$child held."; continue; }
            if [ -z "${next_branch[$feature]:-}" ]; then
              next_branch[$feature]=$(gh issue view "$feature" --repo "$REPO" --json body --jq '.body // ""' \
                | grep -oE '<!-- stack-root-branch: [^ ]+ -->' | head -1 | sed -E 's/<!-- stack-root-branch: ([^ ]+) -->/\1/' || true)
            fi
            next_children[$feature]="${next_children[$feature]:-} $child"
          done <<< "$candidates"

          for feature in "${!next_children[@]}"; do
            branch="${next_branch[$feature]:-}"
            if ! printf '%s' "$branch" | grep -qE '^[A-Za-z0-9._/-]+$'; then
              echo "Feature #$feature has no readable stack branch; its children stay held."
              continue
            fi
            # The feature branch was cut from a default branch that did not have the feature that
            # just landed, and its children build on it. Bring the default branch in first. A
            # conflict is a person's.
            # 201 merged, 204 already up to date; both exit 0. A conflict (409) or a missing branch
            # exits non-zero with the reason on stderr.
            if ! answer=$(gh api -X POST "repos/$REPO/merges" -f base="$branch" -f head="$DEFAULT_BRANCH" \
                   -f commit_message="Merge $DEFAULT_BRANCH into $branch: #$parent landed" 2>&1 >/dev/null); then
              answer=$(printf '%s' "$answer" | tr '\n' ' ' | cut -c1-200)
              echo "::warning::Merging $DEFAULT_BRANCH into $branch failed ($answer); feature #$feature stays held."
              gh label create needs-human --repo "$REPO" --color B60205 --description "A person has to look" >/dev/null 2>&1 || true
              gh issue edit "$feature" --repo "$REPO" --add-label needs-human >/dev/null 2>&1 || true
              gh issue comment "$feature" --repo "$REPO" --body "Feature #$parent landed on $DEFAULT_BRANCH, but \`$DEFAULT_BRANCH\` could not be merged into \`$branch\` ($answer). The children of this feature stay held until a person resolves the branch and re-adds \`implement\` to the first one." >/dev/null || true
              continue
            fi
            # One child per feature, the lowest-numbered free one; each landing on the feature branch
            # releases the next (land-stack-child), so siblings never build side by side.
            # shellcheck disable=SC2086
            for child in $(printf '%s\n' ${next_children[$feature]} | sort -n); do
              own=$(gh issue view "$child" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null \
                | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
              waiting=""
              for b in $own; do
                gh issue view "$b" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open && waiting="$waiting #$b" || true
              done
              if [ -n "$waiting" ]; then
                echo "#$child still waits on$waiting inside its feature."
                continue
              fi
              gh issue edit "$child" --repo "$REPO" --remove-label implement >/dev/null 2>&1 || true
              gh issue edit "$child" --repo "$REPO" --add-label implement >/dev/null
              echo "Released #$child of feature #$feature."
              break
            done
          done

          # A feature refine did not split waits on the issue itself, held by check-stack-branch with
          # `implement` kept. It cuts from the default branch, which now has what it waited on.
          flat=$(gh issue list --repo "$REPO" --state open --label implement --limit 200 \
            --json number,labels,body \
            --jq '.[] | select([.labels[].name] | index("bot-working") | not)
                      | select(.body | test("<!-- split-parent: [0-9]+ -->") | not) | .number')
          for issue in $flat; do
            depends_on_parent "$issue" || continue
            [ -z "$(blockers_of "$issue")" ] || { echo "#$issue still waits on other work."; continue; }
            gh issue edit "$issue" --repo "$REPO" --remove-label implement >/dev/null 2>&1 || true
            gh issue edit "$issue" --repo "$REPO" --add-label implement >/dev/null
            echo "Released unsplit feature #$issue."
          done

          # The report: what merged without a person, and what the gate noted on the way. One issue
          # per feature, written once; its marker makes a rerun a no-op.
          marker="<!-- unattended-report: $parent -->"
          if [ -n "$(gh issue list --repo "$REPO" --state all --search "\"$marker\" in:body" --json number --jq '.[].number')" ]; then
            echo "Report for #$parent already exists."
            exit 0
          fi
          title=$(gh issue view "$parent" --repo "$REPO" --json title --jq '.title')
          {
            echo "$marker"
            echo "Feature #$parent was delivered without a person: root pull request #$EVENT_PR is in \`$DEFAULT_BRANCH\`."
            echo
            echo "## Merged pull requests"
            echo
          } > /tmp/report.md
          flagged=0
          for pr in $(gh pr list --repo "$REPO" --state merged --base "$root_branch" --limit 100 --json number --jq '.[].number') "$EVENT_PR"; do
            line=$(gh pr view "$pr" --repo "$REPO" --json title,url --jq '"- [#\(.url | split("/") | last)](\(.url)) \(.title)"')
            notes=$(gh api "repos/$REPO/issues/$pr/comments?per_page=100" --paginate \
              --jq '.[].body | select(contains("Accepted unattended")) | capture("Accepted unattended \\| (?<f>[^|]+) \\|").f' 2>/dev/null | tail -1 || true)
            if [ -n "$notes" ]; then
              flagged=$((flagged + 1))
              printf '%s: **%s**\n' "$line" "$notes" >> /tmp/report.md
            else
              printf '%s\n' "$line" >> /tmp/report.md
            fi
          done
          {
            echo
            if [ "$flagged" -gt 0 ]; then
              echo "## Look at these"
              echo
              echo "$flagged pull request(s) above merged on a judgement call, not on a measured fact. Each was bold above with what the gate accepted. Nothing here was a verified critical or high finding, a protected path, a failing check or a high blast radius, because those still stop a merge. Read them when you can, and revert any you would not have merged."
            else
              echo "Nothing was merged on a judgement call. Every pull request passed the gate on measured facts."
            fi
          } >> /tmp/report.md
          label=unattended-report
          [ "$flagged" -gt 0 ] && label=needs-human
          gh label create needs-human --repo "$REPO" --color B60205 --description "A person has to look" >/dev/null 2>&1 || true
          gh label create unattended-report --repo "$REPO" --color 0E8A16 --description "What an unattended feature delivered" >/dev/null 2>&1 || true
          gh issue create --repo "$REPO" --title "Unattended report: $title" --label "$label" --body-file /tmp/report.md

  # The merge gate, the merge train and the merge of an approved pull request live in
  # agentics-merge-belt.yml, which hears CI completions, merges and approvals itself. A person
  # adding the merge-gate label, and a dispatch of merge-gate or merge-train to this router, are
  # passed on to that file, so the old entry points keep working.
  #
  # The route, not the operation, is forwarded: a consumer CI that still dispatches merge-gate
  # with GITHUB_TOKEN has already been classified as a merge train tick here. The App token, not
  # GITHUB_TOKEN, carries the forward, because a merge-gate dispatched by github-actions[bot]
  # classifies as that same CI handover and would never reach the gate.
  forward-merge-train:
    needs: classify
    if: >-
      needs.classify.outputs.route == 'merge-gate' ||
      needs.classify.outputs.route == 'merge-train'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Forward the route to agentics-merge-belt.yml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          ROUTE: ${{ needs.classify.outputs.route }}
          PR_NUMBER: ${{ needs.classify.outputs.pr-number }}
          CI_CONCLUSION: ${{ needs.classify.outputs.ci-conclusion }}
          CI_RUN_ID: ${{ needs.classify.outputs.ci-run-id }}
          ATTEMPTS: ${{ needs.classify.outputs.merge-gate-attempts }}
        run: |
          set -euo pipefail
          # Only the inputs that have a value: ci-conclusion is a choice, and an empty one is refused.
          args=(-f operation="$ROUTE")
          [ -z "$PR_NUMBER" ] || args+=(-f pr-number="$PR_NUMBER")
          [ -z "$CI_CONCLUSION" ] || args+=(-f ci-conclusion="$CI_CONCLUSION")
          [ -z "$CI_RUN_ID" ] || args+=(-f ci-run-id="$CI_RUN_ID")
          [ "$ROUTE" != merge-gate ] || args+=(-f attempts_so_far="${ATTEMPTS:-0}")
          gh workflow run agentics-merge-belt.yml --repo "$REPO" --ref "$REF" "${args[@]}"
          echo "::notice::Forwarded ${ROUTE}${PR_NUMBER:+ for #$PR_NUMBER} to agentics-merge-belt.yml"

  # reconcile-bot-pr-runs runs hourly in agentics-merge-belt.yml. A dispatch of it to this router
  # is passed on to that file. GitHub lets GITHUB_TOKEN start a workflow_dispatch run.
  forward-reconcile:
    needs: classify
    if: needs.classify.outputs.route == 'reconcile-bot-pr-runs'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Forward the operation to agentics-merge-belt.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run agentics-merge-belt.yml --repo "$REPO" --ref "$REF" -f operation=reconcile-bot-pr-runs
          echo "::notice::Forwarded operation=reconcile-bot-pr-runs to agentics-merge-belt.yml"

  # The housekeeping, audit-close and cleanup-artifacts jobs live in agentics-housekeeping.yml,
  # which runs them on its own crons. A dispatch of one of their operations to this router is
  # passed on to that file, so the old entry point keeps working. GitHub lets GITHUB_TOKEN start a
  # workflow_dispatch run, so no App token is needed here.
  forward-housekeeping:
    needs: classify
    if: >-
      needs.classify.outputs.route == 'housekeeping' ||
      needs.classify.outputs.route == 'audit-close' ||
      needs.classify.outputs.route == 'cleanup-artifacts'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Forward the operation to agentics-housekeeping.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          OPERATION: ${{ needs.classify.outputs.route }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
        run: |
          set -euo pipefail
          gh workflow run agentics-housekeeping.yml --repo "$REPO" --ref "$REF" \
            -f operation="$OPERATION" \
            -f dry-run="$DRY_RUN"
          echo "::notice::Forwarded operation=${OPERATION} to agentics-housekeeping.yml"

  validate:
    needs: classify
    if: needs.classify.outputs.route == 'validate'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-route-matrix
      - uses: ./.github/actions/verify-composite-actions
