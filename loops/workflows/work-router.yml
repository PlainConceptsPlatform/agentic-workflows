# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/work-router.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "# Main Work Router"

# Owns every repository automation trigger. Classifies each event into exactly one route,
# then calls at most one worker or runs one deterministic job. No model runs here.

# GitHub titles an issue-triggered run with the issue title, so every run on one issue reads
# the same. Name it after the event instead. This is evaluated before any job, so it can
# describe the trigger but not the route the classifier picks.
run-name: >-
  ${{ github.event_name == 'issues'
  && github.event.action == 'opened'
  && format('Event: Issue opened - #{0} {1} by {2}', github.event.issue.number, github.event.issue.title, github.actor)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'implement')
  && format('Agent: Implement - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'refine')
  && format('Agent: Refine - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'direct')
  && format('Working: Direct - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && contains(github.event.issue.labels.*.name, 'triage')
  && format('Agent: Triage - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'bot-working'
  && format('Working: #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'implement'
  && endsWith(github.actor, '[bot]')
  && format('Agent: Implement - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'refine'
  && endsWith(github.actor, '[bot]')
  && format('Agent: Refine - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && github.event.label.name == 'direct'
  && endsWith(github.actor, '[bot]')
  && format('Working: Direct - #{0} {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'issues'
  && format('Event: {0} on #{1} by {2}', github.event.label.name, github.event.issue.number, github.actor)
  || github.event_name == 'issue_comment'
  && format('Event: Comment on #{0} by {1}', github.event.issue.number, github.actor)
  || github.event_name == 'pull_request_review'
  && format('Event: Review on PR #{0} by {1}', github.event.pull_request.number, github.actor)
  || github.event_name == 'pull_request_review_comment'
  && format('Event: Review comment on PR #{0} by {1}', github.event.pull_request.number, github.actor)
  || github.event_name == 'pull_request_target'
  && format('Event: PR #{0} {1} by {2}', github.event.pull_request.number, github.event.action, github.actor)
  || github.event_name == 'workflow_run'
  && format('Event: CI {0} on {1}', github.event.workflow_run.conclusion, github.event.workflow_run.head_branch)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'triage'
  && format('Agent: Triage - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'refine'
  && format('Agent: Refine - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'implement'
  && format('Agent: Implement - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'merge-gate'
  && format('Agent: Merge Gate - PR #{0}', inputs.pr-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'evidence'
  && format('Agentics: Evidence - PR #{0}', inputs.pr-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'batch'
  && format('Working: Batch - #{0}', inputs.issue-number)
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'audit'
  && format('Agent: Audit - manual{0}', '')
  || github.event_name == 'workflow_dispatch'
  && inputs.operation == 'release'
  && format('Agent: Release{0}', '')
  || github.event_name == 'workflow_dispatch'
  && format('dispatch: {0}', inputs.operation)
  || github.event_name == 'schedule'
  && github.event.schedule == '17 1 * * 1'
  && format('Agent: Audit - weekly{0}', '')
  || github.event_name == 'schedule'
  && github.event.schedule == '43 3 * * *'
  && format('Agentics: Audit Close - daily{0}', '')
  || github.event_name == 'schedule'
  && github.event.schedule == '0 6 * * *'
  && format('Agentics: Cleanup - daily{0}', '')
  || github.event_name == 'schedule'
  && github.event.schedule == '17 * * * *'
  && format('Agentics: Reconcile - hourly{0}', '')
  || github.event_name == 'schedule'
  && github.event.schedule == '23 */6 * * *'
  && format('Agentics: Maintenance - 6h{0}', '')
  || github.event_name == 'schedule'
  && format('schedule {0}', github.event.schedule)
  || github.event_name }}

# The two values a repository is expected to change, and the only part of this file that is
# not the package's. `workflows update` keeps whatever is here and puts the package's router
# around it, so change them here and nowhere else.
#
# Neither can be read where it is also needed: GitHub evaluates no expression in a
# `workflow_run.workflows:` list or in a `cron:`. The installer therefore mirrors both values
# into those two literal lines below, and the route matrix asserts the copies still agree.
# Everything that runs inside a job reads them from here, including the classifier, which
# takes AUDIT_CRON from this environment.
env:
  # The CI workflow the merge belt reads its verdict from. A repository whose CI has another
  # name gets no gate at all: the belt logs "no completed CI run" and the pull request waits
  # forever, which is a silent failure rather than a red run.
  CI_WORKFLOW_NAME: "App: CI"
  # Slot 0. Every consumer installs this same router, and the agent fleet is one shared,
  # two-VM scale set, so a second repository left on slot 0 audits at the same minute as the
  # first and the two of them consume the whole fleet. Pick a free slot per repository: see
  # "Scheduling across repositories" in the package README.
  AUDIT_CRON: "17 1 * * 1"
  # The bot identities whose label changes and pull requests this router trusts. Space
  # separated, and every login the same account can present: GitHub reports an App as
  # `name[bot]` on some endpoints and `app/name` on others, so both spellings belong here.
  # Adding a third bot used to mean finding four hand-written comparisons across this file.
  TRUSTED_BOTS: "github-actions[bot] app/github-actions platform-devbox[bot]"
  # How long an issue may sit parked with `stalled` before the janitor retries it, and how many
  # times it tries before leaving the issue to a person. Only machine failures are retried; a
  # verdict the agent reached on purpose is reported and never re-run, because re-running a
  # decision reproduces it.
  HOUSEKEEPING_RETRY_AFTER_HOURS: "6"
  HOUSEKEEPING_MAX_RETRIES: "3"
  # A bot pull request older than this with no merge-gate verdict at all is reported, never
  # closed: the janitor deletes branches and labels, never someone's work.
  HOUSEKEEPING_STALE_PR_DAYS: "3"
  # The single issue that lists what genuinely needs a person. Set it empty to turn the digest
  # off and keep the rest of the janitor.
  HOUSEKEEPING_DIGEST_TITLE: "Needs a human"
  # How long an audit report may sit open before it is labelled `stale-audit`. The audit's own
  # backpressure ignores a stale report, so three abandoned reports can no longer disable the
  # weekly audit for good; the digest lists them instead. Two missed weekly cycles.
  AUDIT_STALE_AFTER_DAYS: "14"
  # How many failed merge-gate attempts one pull request head may consume before the belt
  # parks it for a person. It was written as the literal 6 in four places here while the
  # merge-gate worker carried its own MAX_ATTEMPTS; the route matrix now asserts the two
  # agree, because a belt that gives up later than the worker says burns whole runs.
  MAX_GATE_ATTEMPTS: "6"
  # Whether a merged pull request's verification plan is replayed and its screenshots archived on
  # the pull request (evidence.yml). It needs nothing configured: the app starts with the root
  # `pnpm run dev`, and a pull request with no plan costs one API call. Set it to "false" for a
  # repository whose app cannot start on a runner; operation=evidence still works by hand.
  EVIDENCE_ENABLED: "true"

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  pull_request_target:
    # opened / reopened / synchronize feed conflict detection (detect-pr-conflicts) and
    # bot-approve. closed feeds detect-pr-conflicts: when a PR merges, the target branch
    # moved and previously-mergeable sibling bot PRs may now conflict. A merge also routes to
    # evidence, which replays the pull request's verification plan.
    types: [opened, synchronize, reopened, labeled, closed]

  # CI completion on a pull request. The classifier admits only conclusion == failure with an
  # attached pull request; a green run reaches the gate through the consumer CI's
  # dispatch-merge-gate job and the reconcile belt, so routing success here would double-fire
  # the gate on every passing PR.
  #
  # Delivery (verified 2026-09-06 in Pliny-Bot): GitHub delivers workflow_run only for CI runs
  # whose actor is a human. A bot pull request is opened with GITHUB_TOKEN, the CI runs that
  # follow have the bot as their actor, and no workflow_run arrives for any of them (four
  # human-actor runs produced four router runs; three bot-actor runs produced none). For bot
  # pull requests the consumer CI's dispatch-merge-gate job (templates/ci) and the hourly
  # reconcile-bot-pr-runs belt are the paths. Security: workflow_run runs from the default
  # branch with secrets, but the gate's subject job rejects any PR that is not open and
  # bot-authored, so a fork PR's failing CI cannot start privileged work.
  workflow_run:
    # Mirrored from env.CI_WORKFLOW_NAME by the installer. A trigger evaluates no expression.
    workflows: ["App: CI"]
    types: [completed]

  # Cron to route mapping lives in .github/actions/classify-route/classify-route.sh.
  schedule:
    - cron: "17 1 * * 1" # audit slot, mirrored from env.AUDIT_CRON by the installer
    - cron: "43 3 * * *"
    - cron: "0 6 * * *"
    - cron: "17 * * * *"
    - cron: "23 */6 * * *" # housekeeping: retry what stalled, tidy what it stranded

  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        type: choice
        options:
          - refine
          - implement
          - triage
          - apply-review
          - merge-gate
          - evidence
          - audit
          - audit-close
          - cleanup-artifacts
          - reconcile-bot-pr-runs
          - housekeeping
          - validate
          - release
      issue-number:
        description: "Issue number (required for refine / implement / direct)"
        required: false
        type: string
      pr-number:
        description: "Pull request number (required for apply-review / merge-gate / evidence)"
        required: false
        type: string
      mode:
        description: "Refine mode: first or rerefine"
        required: false
        type: choice
        options:
          - first
          - rerefine
      ci-conclusion:
        description: "CI conclusion for merge-gate dispatch"
        required: false
        type: choice
        options:
          - success
          - failure
          - action_required
      ci-run-id:
        description: "CI workflow run ID for merge-gate dispatch"
        required: false
        type: string
      attempts_so_far:
        description: "Failed merge-gate attempts already made against this CI verdict (filled by the router, not by humans)"
        required: false
        type: string
        default: '0'
      trigger-kind:
        description: "Audit trigger: scheduled or manual"
        required: false
        type: choice
        options:
          - manual
          - scheduled
      dry-run:
        description: "Housekeeping only: print every intended change and write nothing"
        required: false
        type: boolean
        default: false
      version-bump:
        description: "Release version bump: patch, minor, major, or auto"
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  # Public repositories must check repository permission before an event can start a model.
  authorize:
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      is_outside_collaborator: ${{ steps.check.outputs.is_outside_collaborator }}
    steps:
      - name: Check the actor can start an agent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Events with no human actor. `schedule` and `workflow_run` are the fleet triggering
          # itself; `workflow_dispatch` is already restricted by GitHub to write and above.
          case "$EVENT" in
            schedule | workflow_run | workflow_dispatch)
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$EVENT has no untrusted actor."
              exit 0
              ;;
          esac

          # Platform bot owns Safe Outputs. Its label changes must be able to
          # start the follow-on worker, even though GitHub does not report it
          # as a repository collaborator.
          for bot in $TRUSTED_BOTS; do
            if [ "$ACTOR" = "$bot" ]; then
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
            --jq '.permission' 2>/dev/null || echo "none")

          case "$permission" in
            admin | maintain | write)
              # Write or better is a colleague, org member or not: an outside collaborator who
              # was given write is somebody the team chose to work with, and triaging what they
              # open starts an agent nobody asked for. Only read access is the outside door.
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$ACTOR has $permission permission."
              ;;
            read)
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$ACTOR is an outside collaborator (read permission). Triage route eligible."
              ;;
            *)
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "is_outside_collaborator=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$ACTOR has '$permission' permission on this repository. No agent will run."
              ;;
          esac

  classify:
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      route: ${{ steps.route.outputs.route }}
      issue-number: ${{ steps.route.outputs.issue-number }}
      pr-number: ${{ steps.route.outputs.pr-number }}
      linked-issue: ${{ steps.route.outputs.linked-issue }}
      ci-conclusion: ${{ steps.route.outputs.ci-conclusion }}
      ci-run-id: ${{ steps.route.outputs.ci-run-id }}
      merge-gate-attempts: ${{ steps.route.outputs.merge-gate-attempts }}
      attempts: ${{ steps.route.outputs.attempts }}
      refine-mode: ${{ steps.route.outputs.refine-mode }}
      triage-mode: ${{ steps.route.outputs.triage-mode }}
      trigger-kind: ${{ steps.route.outputs.trigger-kind }}
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify event into a single route
        id: route
        uses: ./.github/actions/classify-route
        with:
          token: ${{ github.token }}

  call-refine:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'refine' && needs.authorize.outputs.trusted == 'true'
    uses: ./.github/workflows/agent-refine.lock.yml
    concurrency:
      group: refine-${{ needs.classify.outputs.issue-number }}
      cancel-in-progress: false
    # write-all, not a narrower map: every worker's agent job declares `permissions: read-all`,
    # which requests read on every scope. A caller granting less cannot satisfy it, and GitHub
    # rejects the call with a startup failure before any job is created. The real boundary is the
    # worker's own read-all plus safe-outputs, not this grant.
    permissions: write-all
    with:
      issue-number: ${{ needs.classify.outputs.issue-number }}
      mode: ${{ needs.classify.outputs.refine-mode }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # Checks whether an open bot PR already exists for the issue. If it does, implement is
  # skipped - the merge-gate will handle fixing the existing PR. This prevents duplicate
  # PRs when retries are triggered after a merge-gate failure.
  check-implement-pr:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'implement' && needs.authorize.outputs.trusted == 'true'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has-open-pr: ${{ steps.check.outputs.has-open-pr }}
    steps:
      - name: Check for existing open bot PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
        run: |
          set -euo pipefail
          # A refine-to-implement transition emits two label events (the implement label,
          # then the worker re-adding bot-working) and each one classifies to implement.
          # The older router run wins: a younger run that finds an older live implement
          # route for the same issue skips instead of queueing a duplicate worker. Only
          # bot-actor titles are counted, so a human's "waiting for bot-working" run can
          # never block the real one.
          for st in in_progress queued; do
            dupes=$(gh api "repos/$REPO/actions/workflows/work-router.yml/runs?status=$st&per_page=100"               --jq "[.workflow_runs[]
                | select(.id < $GITHUB_RUN_ID)
                | select(
                    ((.display_title | startswith(\"Working (Implement)\")) and (.display_title | contains(\"(#${ISSUE_NUMBER})\")))
                    or
                    ((.display_title | contains(\"implement label on #${ISSUE_NUMBER} by\")) and (.display_title | endswith(\"[bot]\")))
                  )
              ] | length" 2>/dev/null || echo 0)
            if [ "${dupes:-0}" -gt 0 ]; then
              echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
              echo "::notice::An older router run is already implementing #$ISSUE_NUMBER; skipping the duplicate."
              exit 0
            fi
          done

          # Marker-first: implement stamps <!-- implement-pr: N --> on the issue when its
          # pull request is created, so the duplicate check is an exact lookup. Only an
          # OPEN marker PR blocks; a merged or closed one means a re-implement is legitimate.
          marker_pr=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' \
            | grep -oE '<!-- implement-pr: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$marker_pr" ]; then
            state=$(gh pr view "$marker_pr" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo GONE)
            if [ "$state" = "OPEN" ]; then
              echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Issue #$ISSUE_NUMBER is marked as implemented by open PR #$marker_pr. Skipping duplicate implement."
              exit 0
            fi
            echo "Marker PR #$marker_pr is $state; a fresh implement is allowed."
          fi

          existing=$(gh pr list --repo "$REPO" --state open --json number,author,body \
            --jq "[.[]
              | select(.author.login | startswith(\"app/\") or endswith(\"[bot]\"))
              | (.body | ascii_downcase) as \$body
              | select(\$body | contains(\"close #${ISSUE_NUMBER}\") or contains(\"closes #${ISSUE_NUMBER}\") or contains(\"closed #${ISSUE_NUMBER}\") or contains(\"fix #${ISSUE_NUMBER}\") or contains(\"fixes #${ISSUE_NUMBER}\") or contains(\"fixed #${ISSUE_NUMBER}\") or contains(\"resolve #${ISSUE_NUMBER}\") or contains(\"resolves #${ISSUE_NUMBER}\") or contains(\"resolved #${ISSUE_NUMBER}\"))
            ] | length")
          if [ "$existing" -gt 0 ]; then
            echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Issue #$ISSUE_NUMBER already has an open bot PR. Skipping implement to prevent duplicates."
          else
            echo "has-open-pr=false" >> "$GITHUB_OUTPUT"
          fi

  # A stack child implements on the feature branch its parent issue names. The agent sandbox
  # cannot resolve that branch itself -- agents have no git credentials and checkout a pinned
  # default-branch SHA -- so the router reads the marker and resolves the dispatch ref before
  # the worker starts. Refine stamps `<!-- stack-root-branch: feat/N -->` both on the PARENT
  # feature issue and on every child body at hand-over, so the child is self-describing for
  # the implement prompt, which reads only the child's context. The split-parent chain is the
  # fallback when a child predates the stamp (retries of issues split by an earlier refine).
  # Missing, empty or garbled markers fail closed: the child takes the flat call-implement
  # path and lands on the default branch, exactly what a repo without stacks does today.
  # The in-flight check exists because a dispatched agent-implement run is invisible to
  # check-implement-pr's older-run dupe check: this router run completes as soon as
  # `gh workflow run` returns (fire-and-forget), while a workflow_call caller stays
  # in_progress -- and the dispatch run's title "Working (Implement)" and the App-token
  # label events' actor "app/..." both miss the title conditions that check matches.
  # head_branch is the discriminator: a dispatched implement's run records the dispatch ref,
  # feat/N, while a workflow_call run's head_branch is the default branch. Filtering
  # in_progress/queued agent-implement.lock.yml runs by head_branch therefore isolates stack
  # implements with zero effect on flat runs.
  check-stack-branch:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'implement' && needs.authorize.outputs.trusted == 'true'
    runs-on: agents-arc
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      is-stack: ${{ steps.stack.outputs.is-stack }}
      stack-branch: ${{ steps.stack.outputs.stack-branch }}
      stack-in-flight: ${{ steps.inflight.outputs.stack-in-flight }}
      stack-blocked: ${{ steps.blocked.outputs.stack-blocked }}
    steps:
      - name: Resolve the feature branch from the stack markers
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
        run: |
          set -euo pipefail
          echo "is-stack=false" >> "$GITHUB_OUTPUT"
          echo "stack-branch=" >> "$GITHUB_OUTPUT"

          # Read failures degrade to the flat path, never to a failed job: call-implement
          # names this job in its needs, so a failure here would block a perfectly ordinary
          # flat implement run. A repo without stack markers must behave exactly as before.
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')
          # Marker-first: the child may carry its own resolved marker from an earlier hop.
          # `|| true` on both pipelines: under `set -o pipefail`, grep's exit 1 on no match
          # (the common flat case) or head's SIGPIPE on a multi-marker body must not fail
          # the job -- call-implement needs this job, so a failure here would block flat
          # implements too.
          branch=$(printf '%s' "$body" | grep -oE '<!-- stack-root-branch: [^ ]+ -->' | head -1 | sed -E 's/<!-- stack-root-branch: ([^ ]+) -->/\1/' || true)

          if [ -z "$branch" ]; then
            # No marker on the child: follow the split-parent chain to the feature issue,
            # where refine stamps the stack root.
            parent=$(printf '%s' "$body" \
              | grep -oE '<!-- split-parent: [0-9]+ -->' | head -1 \
              | grep -oE '[0-9]+' || true)
            if [ -n "$parent" ]; then
              parent_body=$(gh issue view "$parent" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')
              branch=$(printf '%s' "$parent_body" \
                | grep -oE '<!-- stack-root-branch: [^ ]+ -->' | head -1 \
                | sed -E 's/<!-- stack-root-branch: ([^ ]+) -->/\1/' || true)
            fi
          fi

          # Fail closed on anything unreadable or unsafe: a missing marker, a garbled
          # split parent, or a marker naming a deleted branch all take the flat path.
          if ! printf '%s' "$branch" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::notice::Issue #$ISSUE_NUMBER carries no readable stack-root-branch marker; taking the flat path."
            exit 0
          fi
          if ! gh api "repos/$REPO/branches/$(printf '%s' "$branch" | sed 's|/|%2F|g')" --jq '.name' >/dev/null 2>&1; then
            echo "::notice::Stack root branch $branch no longer exists on the remote; taking the flat path."
            echo "stack-branch=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is-stack=true" >> "$GITHUB_OUTPUT"
          echo "stack-branch=$branch" >> "$GITHUB_OUTPUT"

      # A child whose `Blocked by #N` sibling has not landed is held, not dispatched: dispatched now
      # it would cut from a feature branch that lacks the sibling's work. Lyceum #112 (units,
      # blocked by #111, modules) was dispatched alongside #111 and would have built units on a
      # feat/45 with no modules. The in-flight check below cannot catch that: both routers ran
      # before either dispatch existed, and serialising runs would still start #112 before #111's
      # pull request merged. The landing of the blocker releases the child (the stack block in
      # detect-pr-conflicts). Held, it keeps `implement` and loses `bot-working`, so it reads as
      # waiting rather than stuck.
      - name: Hold a child whose blockers have not landed
        id: blocked
        if: steps.stack.outputs.is-stack == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
          STACK_BRANCH: ${{ steps.stack.outputs.stack-branch }}
        run: |
          set -euo pipefail
          echo "stack-blocked=false" >> "$GITHUB_OUTPUT"
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')
          waiting=""
          for b in $(printf '%s' "$body" | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' | sort -u || true); do
            gh issue view "$b" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open || continue
            # Open, but landed if a pull request that closes it has merged into the feature branch:
            # the release fires on that merge and the gate closes the issue a moment later, or not
            # at all when it fails. Reading the issue state alone would hold the child again with
            # no later landing left to release it.
            landed=$(gh pr list --repo "$REPO" --state merged --base "$STACK_BRANCH" --search "#$b in:body"               --json body --jq "[.[] | select(.body | test(\"(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?) #${b}([^0-9]|$)\"))] | length" 2>/dev/null || echo 0)
            [ "${landed:-0}" -gt 0 ] && continue
            waiting="$waiting #$b"
          done
          [ -n "$waiting" ] || exit 0
          echo "::notice::#$ISSUE_NUMBER is blocked by$waiting, not yet landed on $STACK_BRANCH; holding it."
          echo "stack-blocked=true" >> "$GITHUB_OUTPUT"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label bot-working >/dev/null 2>&1 || true
          marker='<!-- stack-held -->'
          if ! gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF "$marker"; then
            printf '%s\nHeld until%s have landed on `%s`: this child builds on them. It keeps `implement` and is released when they merge.\n' \
              "$marker" "$waiting" "$STACK_BRANCH" > /tmp/held.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/held.md >/dev/null || true
          fi

      - name: Detect an in-flight implement on the feature branch
        id: inflight
        if: steps.stack.outputs.is-stack == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STACK_BRANCH: ${{ steps.stack.outputs.stack-branch }}
        run: |
          set -euo pipefail
          echo "stack-in-flight=false" >> "$GITHUB_OUTPUT"
          # Only dispatched stack implements run with head_branch = feat/N; a workflow_call
          # (flat) implement run's head_branch is the default branch, so this filter never
          # sees it. This closes the dupe-visibility gap left by fire-and-forget dispatch.
          for status in in_progress queued; do
            live=$(gh api "repos/$REPO/actions/workflows/agent-implement.lock.yml/runs?status=$status&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_branch == \"${STACK_BRANCH}\")] | length" 2>/dev/null || echo 0)
            if [ "${live:-0}" -gt 0 ]; then
              echo "::notice::An implement run is already in flight on $STACK_BRANCH; skipping dispatch."
              echo "stack-in-flight=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

  call-implement:
    needs: [classify, authorize, check-implement-pr, check-stack-branch]
    if: needs.classify.outputs.route == 'implement' && needs.authorize.outputs.trusted == 'true' && needs.check-implement-pr.outputs.has-open-pr != 'true' && needs.check-stack-branch.outputs.is-stack != 'true'
    uses: ./.github/workflows/agent-implement.lock.yml
    concurrency:
      group: implement-global
      cancel-in-progress: false
      # FIFO, up to 100 waiting. Without this the default `queue: single` cancels whatever
      # was pending, so labelling six issues at once implements one and drops the rest.
      queue: max
    permissions: write-all
    with:
      issue-number: ${{ needs.classify.outputs.issue-number }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # Stack children dispatch agent-implement by `gh workflow run --ref feat/N` instead of calling
  # it: a workflow_call would pin the callee to THIS event's SHA, which for a label event is
  # the default branch, not the feature branch. Dispatch on the feature ref makes the callee's
  # GITHUB_SHA the feature tip, so the agent patches exactly the tree its PR will target, and
  # the compile-time checkout ternary keys off `workflow_dispatch` to checkout github.ref_name.
  # The dispatch itself carries no secrets (gh workflow run cannot forward them); the
  # dispatched run reads REPO-LEVEL OPENAI_API_KEY / CODEX_API_KEY / COPILOT_GITHUB_TOKEN, the
  # stack-activation prerequisite documented alongside the markers. BOT_APP_ID / BOT_PRIVATE_KEY
  # are already repo-level. dispatch-triage proves the pattern: same app-token mint, same
  # `actions: write` scope needed for `gh workflow run`.
  dispatch-implement:
    needs: [classify, authorize, check-implement-pr, check-stack-branch]
    if: >
      needs.classify.outputs.route == 'implement' &&
      needs.authorize.outputs.trusted == 'true' &&
      needs.check-implement-pr.outputs.has-open-pr != 'true' &&
      needs.check-stack-branch.outputs.is-stack == 'true' &&
      needs.check-stack-branch.outputs.stack-in-flight != 'true' &&
      needs.check-stack-branch.outputs.stack-blocked != 'true'
    runs-on: agents-arc
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Dispatch stack implement on the feature branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          STACK_BRANCH: ${{ needs.check-stack-branch.outputs.stack-branch }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
          ATTEMPTS: ${{ needs.classify.outputs.attempts }}
        run: |
          set -euo pipefail
          gh workflow run agent-implement.lock.yml --repo "$REPO" --ref "$STACK_BRANCH" \
            -f issue-number="$ISSUE_NUMBER" \
            -f attempts_so_far="$ATTEMPTS"

  dispatch-triage:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'triage' && needs.authorize.outputs.is_outside_collaborator == 'true'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Dispatch trusted triage run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue-number }}
          MODE: ${{ needs.classify.outputs.triage-mode }}
        run: |
          set -euo pipefail
          gh workflow run work-router.yml --repo "$REPO" --ref "$REF" \
            -f operation=triage \
            -f issue-number="$ISSUE_NUMBER" \
            -f mode="$MODE"

  call-triage:
    needs: [classify, authorize]
    # Triage on issue open is for read-only outside collaborators only (handled by dispatch-triage).
    # A trusted actor who opens an issue should not start triage - they can add refine/implement/direct
    # labels or manually dispatch triage. All other triage routes (labeled, comment, dispatch) are trusted.
    if: needs.classify.outputs.route == 'triage' && needs.authorize.outputs.trusted == 'true' && !(github.event_name == 'issues' && github.event.action == 'opened')
    uses: ./.github/workflows/agent-triage.lock.yml
    concurrency:
      group: triage-${{ needs.classify.outputs.issue-number }}
      cancel-in-progress: false
    permissions: write-all
    with:
      issue-number: ${{ needs.classify.outputs.issue-number }}
      mode: ${{ needs.classify.outputs.triage-mode }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  call-apply-review:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'apply-review' && needs.authorize.outputs.trusted == 'true'
    uses: ./.github/workflows/agent-apply-review.lock.yml
    concurrency:
      group: pr-feedback-${{ needs.classify.outputs.pr-number }}
      cancel-in-progress: false
    permissions: write-all
    with:
      pr-number: ${{ needs.classify.outputs.pr-number }}
      linked-issue: ${{ needs.classify.outputs.linked-issue }}
      attempts_so_far: ${{ needs.classify.outputs.attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # The merge belt is one lock for the whole repository, not one group per pull request.
  # A batch of six overnight pull requests means every merge moves the default branch
  # under the other five; gates running at once would each rebase onto a base another
  # gate is about to invalidate. Serialising the belt means each gate sees a main that
  # only changes between gates, every merge re-arms the siblings through
  # detect-pr-conflicts's rescan, and the queue drains one pull request at a time.
  #
  # `queue: max` keeps up to 100 gates waiting in order. Without it GitHub keeps one pending run
  # per group and silently cancels the previous one: in one week Numa cancelled 12 gates and
  # finished 6, and those pull requests were merged by hand without a verdict.
  call-merge-gate:
    needs: classify
    if: needs.classify.outputs.route == 'merge-gate'
    uses: ./.github/workflows/agent-merge-gate.lock.yml
    concurrency:
      group: merge-belt
      cancel-in-progress: false
      queue: max
    permissions: write-all
    with:
      pr-number: ${{ needs.classify.outputs.pr-number }}
      linked-issue: ${{ needs.classify.outputs.linked-issue }}
      ci-conclusion: ${{ needs.classify.outputs.ci-conclusion }}
      ci-run-id: ${{ needs.classify.outputs.ci-run-id }}
      attempts_so_far: ${{ needs.classify.outputs.merge-gate-attempts }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  # The decision the gate parked for: a person with write access approves a bot pull request the
  # gate handed to them (human-review or owner-review), and the bot merges the commit they
  # approved. Re-running the gate would only reproduce the same parked verdict.
  merge-approved:
    needs: classify
    if: needs.classify.outputs.route == 'merge-approved'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    concurrency:
      group: merge-approved-${{ needs.classify.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout for App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Merge the approved commit
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.classify.outputs.pr-number }}
          ISSUE: ${{ needs.classify.outputs.linked-issue }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::Not merging #$PR: $1"; exit 0; }

          permission=$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || echo none)
          case "$permission" in admin|maintain|write) ;; *) skip "$REVIEWER has $permission access" ;; esac

          read -r state author head_sha < <(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .user.login, .head.sha] | @tsv')
          [ "$state" = open ] || skip "it is $state"
          case " $TRUSTED_BOTS " in *" $author "*) ;; *) skip "it was opened by $author, not the bot" ;; esac
          [ "$head_sha" = "$REVIEW_COMMIT" ] || skip "$REVIEWER approved ${REVIEW_COMMIT:0:7}, the head is now ${head_sha:0:7}"

          # Another reviewer's change request still stands.
          decision=$(gh pr view "$PR" --repo "$REPO" --json reviewDecision --jq '.reviewDecision // ""')
          [ "$decision" = APPROVED ] || skip "the review decision is '${decision:-none}'"

          # The gate parked it for a person. A protected-path hold comments on the issue rather
          # than the pull request, so the issue's labels speak for it.
          verdict=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select((.body | contains("<!-- agent-merge-gate -->")) and (.body | contains("**Verdict:**"))) | .body' |
            grep -oE '\*\*Verdict:\*\* [a-z-]+' | tail -1 | sed 's/.* //' || true)
          if [ -z "$verdict" ] && [ -n "$ISSUE" ]; then
            labels=$(gh api "repos/$REPO/issues/$ISSUE/labels" --jq '[.[].name] | join(" ")')
            case " $labels " in *" blocked "*) ;; *" owner-review "*) verdict=owner-review ;; esac
          fi
          case "$verdict" in human-review|owner-review) ;; *) skip "the gate's verdict is '${verdict:-none}', not a hand-over" ;; esac

          ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == env.CI_WORKFLOW_NAME)] | sort_by(.created_at) | last | .conclusion // ""')
          [ "$ci" = success ] || skip "$CI_WORKFLOW_NAME on ${head_sha:0:7} is '${ci:-not run}'"

          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$head_sha"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: Clear the issue's labels
        if: steps.merge.outputs.merged == 'true' && needs.classify.outputs.linked-issue != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.classify.outputs.linked-issue }}
        run: |
          for label in implement bot-working review owner-review blocked pr-pending; do
            gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/$label" >/dev/null 2>&1 || true
          done
      # GITHUB_TOKEN: its comment raises no event for the router to read.
      - name: Say whose approval merged it
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.classify.outputs.pr-number }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
        run: gh pr comment "$PR" --repo "$REPO" --body "Merged on @$REVIEWER's approval of \`${REVIEW_COMMIT:0:7}\`."

  # Screenshots of a merged pull request, replayed from the verification plan its implementation
  # wrote and archived beside that plan. Plain YAML with no model, so no secret is passed and the
  # grant is exactly what the publish job writes: one commit of evidence/ folders and one comment. Its capture
  # job runs the pull request's code with read-only access; only publish holds these writes, and it
  # runs no repository code.
  call-evidence:
    needs: classify
    if: needs.classify.outputs.route == 'evidence'
    uses: ./.github/workflows/evidence.yml
    concurrency:
      group: evidence-${{ needs.classify.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      pr-number: ${{ needs.classify.outputs.pr-number }}

  call-audit:
    needs: classify
    if: needs.classify.outputs.route == 'audit'
    uses: ./.github/workflows/agent-audit.lock.yml
    concurrency:
      group: audit
      cancel-in-progress: false
    permissions: write-all
    with:
      trigger-kind: ${{ needs.classify.outputs.trigger-kind }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      CODEX_API_KEY: ${{ secrets.FORGE_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.FORGE_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}

  call-release:
    needs: [classify, authorize]
    if: needs.classify.outputs.route == 'release' && needs.authorize.outputs.trusted == 'true'
    uses: ./.github/workflows/agent-release.lock.yml
    permissions: write-all
    with:
      version-bump: ${{ github.event.inputs.version-bump || 'auto' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.FORGE_API_KEY }}
      # The release PR is pushed and opened with the App token so its CI runs; see conclude.
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}

  bot-approve:
    needs: classify
    if: >
      needs.classify.outputs.route == 'bot-approve' &&
        (github.actor == 'app/github-actions' || github.actor == 'platform-devbox[bot]')
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Approve pending workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api "repos/$REPO/actions/runs?status=action_required&branch=$BRANCH" \
              --jq '.workflow_runs[].id'
          )

          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "No runs awaiting approval on branch $BRANCH"
            exit 0
          fi

          for run_id in "${run_ids[@]}"; do
            echo "Approving run $run_id"
            gh api "repos/$REPO/actions/runs/$run_id/approve" --method POST
          done

  # Conflict watcher for bot pull requests. Merge-conflict state is only available from the
  # mergeability API, which the pure classifier cannot read, so this is an event-gated
  # deterministic dispatcher rather than a classify route (it runs alongside bot-approve on
  # the same pull_request_target event). It NEVER checks out or runs pull request code - it
  # reads mergeability through the API and dispatches the Merge Gate - so it is safe on
  # pull_request_target. Two entry points:
  #   opened / reopened / synchronize → check the pull request that changed. Gated to this
  #     repository's own branches so a fork PR never starts this App-token job.
  #   closed & merged                 → the target branch moved, so re-check every open
  #     pull request that may have just become conflicted (the "main changed after another PR
  #     merged" case). A merge into the default branch is an inherently trusted internal event.
  # It dispatches only for open, non-draft pull requests whose head is this
  # repository AND whose CI has already concluded (dispatching while CI is still pending would
  # make the gate read a 'pending' verdict and prematurely ask for human review; that PR is
  # covered by the CI-completion route instead). The gate's subject job re-validates ownership
  # before any agent runs.
  detect-pr-conflicts:
    needs: classify
    if: >
      github.event_name == 'pull_request_target' &&
      (
        (github.event.action == 'closed' && github.event.pull_request.merged == true) ||
        (
          (github.event.action == 'opened' ||
           github.event.action == 'reopened' ||
           github.event.action == 'synchronize') &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout for App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Dispatch Merge Gate for conflicting bot pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTION: ${{ github.event.action }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Dispatch the Merge Gate for one pull request when it is a red-CI open, non-draft
          # pull request on this repository whose CI has concluded - the
          # conflict case is one arm of that, because a conflicting PR never gets a fresh
          # CI run of its own; a merge conflict with red or concluded CI is the same
          # "needs the gate" signal. A green non-conflicting PR is left for the merge belt
          # to pick up when its checks finish (bot-approve / reconcile).
          # GitHub computes mergeability on demand. The first read of a pull request nobody has
          # opened recently answers UNKNOWN through the API and null through REST, while it works
          # the answer out in the background. Reading once therefore reports "not conflicting"
          # for precisely the stale conflicting pull requests that need the gate. Ask until it
          # settles.
          mergeable_state() {
            local pr="$1" state=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              state=$(gh pr view "$pr" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
              [ "$state" = "UNKNOWN" ] || break
              sleep 5
            done
            echo "$state"
          }

          # A gate already queued or running for this pull request will read the same CI verdict;
          # a second dispatch would wait in the belt's queue and run the same gate twice. Same
          # live-run test as the reconcile belt's stale-reservation sweep, keyed on the exact
          # title run-name gives a gate dispatch.
          gate_is_live() {
            local pr="$1" status live
            for status in queued in_progress waiting pending; do
              live=$(gh api "repos/$REPO/actions/workflows/work-router.yml/runs?status=$status&per_page=100" \
                --jq "[.workflow_runs[] | select(.display_title == \"Working (Merge Gate): PR #${pr}\")] | length" 2>/dev/null || echo 0)
              [ "${live:-0}" -eq 0 ] || return 0
            done
            return 1
          }

          maybe_dispatch() {
            pr="$1"
            [ -n "$pr" ] || return 0

            meta=$(gh api "repos/$REPO/pulls/$pr" \
              --jq '{state:.state, draft:.draft, bot:.user.type, head:(.head.repo.full_name // "")}' \
              2>/dev/null || echo '')
            [ -n "$meta" ] || return 0
            if [ "$(jq -r '.state' <<<"$meta")" != "open" ] \
              || [ "$(jq -r '.draft' <<<"$meta")" != "false" ] \
              || [ "$(jq -r '.head'  <<<"$meta")" != "$REPO" ]; then
              return 0
            fi

            # Only dispatch when CI has already concluded. A conflict while CI is still
            # running is handled by the CI-completion route; dispatching now would make the
            # gate read a 'pending' conclusion and prematurely ask for human review.
            head_sha=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
            ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100" \
              --jq '[.workflow_runs[]
                | select(.name == env.CI_WORKFLOW_NAME and .status == "completed"
                         and (.conclusion == "success" or .conclusion == "failure"))]
                | sort_by(.created_at) | last // empty')
            if [ -z "$ci" ]; then
              # A conflicting pull request has no merge ref for GitHub to build, so a
              # `pull_request` CI workflow can never run on that head: refs/pull/N/merge is a
              # 404 for as long as the conflict lasts. Waiting for a verdict that cannot arrive
              # deadlocks the belt, because resolving the conflict is the gate's own job. Fall
              # back to the branch's last verdict so the gate runs; it stays on the remediation
              # path and cannot merge on a stale conclusion.
              head_ref=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.ref')
              mergeable_now=$(mergeable_state "$pr")
              if [ "$mergeable_now" != "CONFLICTING" ]; then
                echo "PR #$pr has no concluded CI run; deferring to the CI-completion route."
                return 0
              fi
              ci=$(gh api "repos/$REPO/actions/runs?branch=$head_ref&per_page=100" \
                --jq '[.workflow_runs[]
                  | select(.name == env.CI_WORKFLOW_NAME and .status == "completed"
                           and (.conclusion == "success" or .conclusion == "failure"))]
                  | sort_by(.created_at) | last // empty')
              if [ -z "$ci" ]; then
                echo "PR #$pr conflicts and has no CI verdict on any head; nothing to gate on yet."
                return 0
              fi
              echo "PR #$pr conflicts, so CI cannot run on $head_sha at all; gating on the branch's last verdict."
            fi
            ci_conclusion=$(jq -r '.conclusion' <<<"$ci")
            ci_finished=$(jq -r '.updated_at' <<<"$ci")
            ci_run_id=$(jq -r '.id' <<<"$ci")

            # GitHub computes mergeability asynchronously; poll until it is known (not null).
            mergeable=""
            for _ in 1 2 3 4 5 6; do
              mergeable=$(gh api "repos/$REPO/pulls/$pr" --jq '.mergeable // "null"' 2>/dev/null || echo null)
              [ "$mergeable" = "null" ] || break
              sleep 5
            done

            if [ "$mergeable" != "false" ] && [ "$ci_conclusion" != "failure" ]; then
              # Mergeable and green: the reconcile belt and the PR's own checks finish it.
              return 0
            fi

            # A terminal verdict newer than this CI run means a gate already decided;
            # failed attempts (the attempt marker) deliberately do not count.
            verdict=$(gh api "repos/$REPO/issues/$pr/comments?per_page=100" \
              --jq '[.[] | select((.body | contains("<!-- agent-merge-gate -->")) and (.body | contains("**Verdict:**"))) | .created_at] | max // empty')
            linked_issue=$(gh pr view "$pr" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty' 2>/dev/null || true)
            if [ -n "$linked_issue" ]; then
              issue_verdict=$(gh api "repos/$REPO/issues/$linked_issue/comments?per_page=100" \
                --jq '[.[] | select((.body | contains("<!-- agent-merge-gate -->")) and (.body | contains("**Verdict:**"))) | .created_at] | max // empty')
              if [ -n "$issue_verdict" ] && { [ -z "$verdict" ] || [ "$issue_verdict" \> "$verdict" ]; }; then
                verdict="$issue_verdict"
              fi
            fi
            # A verdict parks the CODE it was given on, not the CI run that prompted it.
            # Comparing against the CI finish time meant any later run on the same commits
            # reopened a park a human already owned. The newest commit on the branch is the
            # right key: push, and the gate decides again; re-run CI, and the park holds.
            head_committed=$(gh pr view "$pr" --repo "$REPO" \
              --json commits --jq '[.commits[].committedDate] | max // empty' 2>/dev/null || true)
            horizon="${head_committed:-$ci_finished}"
            if [ -n "$verdict" ] && [ "$verdict" \> "$horizon" ]; then
              echo "PR #$pr has a gate verdict newer than its head commit; the park holds, skipping."
              return 0
            fi

            attempts=$(gh api "repos/$REPO/issues/$pr/comments?per_page=100" \
              --jq '[.[] | select(.body | contains("<!-- agent-merge-gate-attempt -->")) | select(.created_at > "'"$horizon"'") ] | length')
            if [ -n "$linked_issue" ]; then
              issue_attempts=$(gh api "repos/$REPO/issues/$linked_issue/comments?per_page=100" \
                --jq '[.[] | select(.body | contains("<!-- agent-merge-gate-attempt -->")) | select(.created_at > "'"$horizon"'") ] | length')
              attempts=$((attempts + issue_attempts))
            fi
            if [ "$attempts" -ge "$MAX_GATE_ATTEMPTS" ]; then
              echo "PR #$pr already consumed $attempts gate attempts on this head, parking for review."
              return 0
            fi
            if gate_is_live "$pr"; then
              echo "PR #$pr: a merge-gate run is already live; not dispatching another."
              return 0
            fi

            echo "PR #$pr is $([ "$mergeable" = "false" ] && echo conflicting || echo red-CI) (CI $ci_conclusion); dispatching Merge Gate (attempt $((attempts + 1)) of $MAX_GATE_ATTEMPTS)."
            gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" \
              --method POST \
              -f ref="$DEFAULT_BRANCH" \
              -f "inputs[operation]=merge-gate" \
              -f "inputs[pr-number]=$pr" \
              -f "inputs[ci-conclusion]=$ci_conclusion" \
              -f "inputs[ci-run-id]=$ci_run_id" \
                -f "inputs[attempts_so_far]=$attempts"
          }

          if [ "$ACTION" = "closed" ]; then
            # The target branch just moved. Any previously-mergeable bot PR may now conflict.
            # The just-merged PR is now closed and is skipped by maybe_dispatch's state check.
            gh api "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | select(.user.type == "Bot" and .draft == false) | .number' |
              while IFS= read -r pr; do
                maybe_dispatch "$pr"
              done

            # Stacked delivery: the merged pull request merged into a feature branch, not the
            # default branch, so this is a child landing. If the feature branch has no open
            # children left and its root pull request is green, the stack is complete and a
            # comment on the root pull request tells the human it is ready for the root merge.
            # Repos without stack markers never reach the interesting part: the event PR's base
            # was the default branch, so the guard below fails immediately. Fully idempotent:
            # the completion comment carries its own marker, and a run that finds it already
            # present exits without writing anything.
            event_base=$(gh api "repos/$REPO/pulls/$EVENT_PR" --jq '.base.ref // empty' 2>/dev/null || echo '')
            if [ -n "$event_base" ] && [ "$event_base" != "$DEFAULT_BRANCH" ]; then
              echo "PR #$EVENT_PR merged into a feature branch; checking the stack."
              # The implement worker's pull request closes exactly its own child issue, so
              # the closed issue comes from the linked closing references (the resolved form
              # GitHub computes whatever keyword the agent wrote), with the body text as
              # fallback for a PR created before that guarantee.
              closed_issue=$(gh pr view "$EVENT_PR" --repo "$REPO" --json closingIssuesReferences \
                --jq '.closingIssuesReferences[0].number // empty' 2>/dev/null || true)
              [ -n "$closed_issue" ] || closed_issue=$(gh api "repos/$REPO/pulls/$EVENT_PR" --jq '.body // ""' \
                | grep -oiE '(closes?|fixes?|resolves?) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
              if [ -z "$closed_issue" ]; then
                echo "PR #$EVENT_PR closes no issue; not a stack child. Nothing to do."
              else
                # Refine stamps the split-parent marker on every child body it hands over, so
                # the child's own body names the feature issue. The reverse sub-issues
                # listing has no equivalent per-child lookup: the sub-issues API only walks
                # downward from the parent.
                parent=$(printf '%s' "$(gh issue view "$closed_issue" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')" \
                  | grep -oE '<!-- split-parent: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
                if [ -z "$parent" ]; then
                  echo "#$closed_issue is not a stack child issue (no parent found); nothing stack-related to do."
                else
                  root_pr=$(printf '%s' "$(gh issue view "$parent" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo '')" \
                    | grep -oE '<!-- stack-root-pr: [0-9]+ -->' | head -1 | grep -oE '[0-9]+' || true)
                  # Case-insensitive on purpose, here and in the child count below: `gh pr view` and
                  # `gh issue view` read GraphQL and answer OPEN, where the REST API answers open. An
                  # exact `open` never matched, so no root was ever open and no child was ever counted
                  # open, and the stack-complete announcement could not fire (Lyceum #44, router run
                  # 38752856518: "Stack #44 has no open root pull request" with #70 open).
                  root_open=false
                  [ -n "$root_pr" ] && root_open=$(gh pr view "$root_pr" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open && echo true || echo false)
                  if [ "$root_open" != true ]; then
                    echo "Stack #$parent has no open root pull request; nothing to announce."
                  else
                    # The same child listing refine uses to hand work out: the sub-issues
                    # link safe_outputs writes, with the body-marker search as fallback. A
                    # stack parent always has children, so a listing that finds none means
                    # the lookups failed, and announcing completion of a stack we cannot
                    # see would be wrong -- stay silent and let a rerun decide.
                    children=$(gh api "repos/$REPO/issues/$parent/sub_issues" --jq '.[].number' 2>/dev/null || true)
                    if [ -z "$children" ]; then
                      children=$(gh issue list --repo "$REPO" --state open --limit 50 \
                        --search "\"<!-- split-parent: ${parent} -->\" in:body" --json number --jq '.[].number' || true)
                    fi
                    if [ -z "$children" ]; then
                      echo "Cannot list any child of stack #$parent; leaving completion undetected for a rerun."
                    else
                    # Release the children this landing unblocks. check-stack-branch holds a child
                    # whose `Blocked by #N` sibling is still open, and nothing else re-dispatches it,
                    # so the landing does: re-adding `implement` with the App token is a bot label
                    # event, which the router routes straight to implement. The child that just
                    # landed counts as done even before the gate closes its issue a moment later.
                    for child in $children; do
                      [ "$child" = "$closed_issue" ] && continue
                      meta=$(gh issue view "$child" --repo "$REPO" --json state,labels,body 2>/dev/null || echo '{}')
                      printf '%s' "$meta" | jq -e '(.state // "" | ascii_downcase) == "open"' >/dev/null || continue
                      printf '%s' "$meta" | jq -e '[.labels[]?.name] | (index("implement") != null) and (index("bot-working") == null)' >/dev/null || continue
                      blockers=$(printf '%s' "$meta" | jq -r '.body // ""' | grep -oiE 'blocked by #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
                      [ -n "$blockers" ] || continue
                      waiting=""
                      for b in $blockers; do
                        [ "$b" = "$closed_issue" ] && continue
                        if gh issue view "$b" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open; then
                          waiting="$waiting #$b"
                        fi
                      done
                      if [ -n "$waiting" ]; then
                        echo "#$child still waits on$waiting."
                        continue
                      fi
                      gh issue edit "$child" --repo "$REPO" --remove-label implement >/dev/null 2>&1 || true
                      gh issue edit "$child" --repo "$REPO" --add-label implement >/dev/null
                      echo "Released #$child: everything it was blocked by has landed."
                    done
                    open_children=0
                    for child in $children; do
                      # Landed, though the gate may not have closed its issue yet.
                      [ "$child" = "$closed_issue" ] && continue
                      if gh issue view "$child" --repo "$REPO" --json state --jq '.state' 2>/dev/null | grep -qix open; then
                        open_children=$((open_children + 1))
                      fi
                    done
                    if [ "$open_children" -gt 0 ]; then
                      echo "$open_children child issue(s) still open on stack #$parent; the stack continues."
                    else
                      # The root pull request must be green and mergeable. Green: a successful
                      # CI run on its head SHA. Mergeable: the same on-demand computation
                      # every gate dispatch already relies on; UNKNOWN settles in the
                      # background, so ask until it does, like mergeable_state() does.
                      root_state=UNKNOWN
                      for _ in 1 2 3 4 5 6; do
                        root_state=$(gh pr view "$root_pr" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
                        [ "$root_state" = "UNKNOWN" ] || break
                        sleep 5
                      done
                      root_sha=$(gh api "repos/$REPO/pulls/$root_pr" --jq '.head.sha')
                      root_ci=$(gh api "repos/$REPO/actions/runs?head_sha=$root_sha&per_page=100" \
                        --jq '[.workflow_runs[]
                          | select(.name == env.CI_WORKFLOW_NAME and .status == "completed"
                                   and .conclusion == "success")]
                        | sort_by(.created_at) | last // empty')
                      if [ -z "$root_ci" ] || [ "$root_state" != "MERGEABLE" ]; then
                        echo "Root PR #$root_pr is not green/mergeable yet; the human will merge when it is."
                      else
                        completion_marker='<!-- stack-complete -->'
                        # The announcement is a pull request comment, and pull request
                        # comments live at the issue endpoint for the pull request number,
                        # so the marker is looked for where the comment was posted.
                        already=$(gh api "repos/$REPO/issues/$root_pr/comments?per_page=100" \
                          --jq "[.[] | select(.body | contains(\"$completion_marker\"))] | length" 2>/dev/null || echo 0)
                        if [ "${already:-0}" -gt 0 ]; then
                          echo "Stack #$parent already has a completion announcement; staying silent."
                        else
                          gh pr comment "$root_pr" --repo "$REPO" --body "Stack complete: all children have merged into the feature branch and CI is green. This root pull request is ready for a human to review and merge into $DEFAULT_BRANCH. $completion_marker"
                          echo "Stack #$parent complete: announced root PR #$root_pr."
                        fi
                      fi
                    fi
                    fi
                  fi
                fi
              fi
            fi
          else
            maybe_dispatch "$EVENT_PR"
          fi

  reconcile-bot-pr-runs:
    needs: classify
    if: needs.classify.outputs.route == 'reconcile-bot-pr-runs'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
      # the stale reservation sweep clears bot-working from parked issues
      issues: write
    env:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
    steps:
      - name: Checkout for App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      # Runs only the default-branch workflow and never checks out pull-request code.
      # External users cannot impersonate github-actions[bot].
      - name: Approve checks and dispatch Merge Gate for trusted bot pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # GitHub computes mergeability on demand. The first read of a pull request nobody has
          # opened recently answers UNKNOWN through the API and null through REST, while it works
          # the answer out in the background. Reading once therefore reports "not conflicting"
          # for precisely the stale conflicting pull requests that need the gate. Ask until it
          # settles.
          mergeable_state() {
            local pr="$1" state=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              state=$(gh pr view "$pr" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
              [ "$state" = "UNKNOWN" ] || break
              sleep 5
            done
            echo "$state"
          }

          # A gate already queued or running for this pull request will read the same CI verdict;
          # a second dispatch would wait in the belt's queue and run the same gate twice.
          gate_is_live() {
            local pr="$1" status live
            for status in queued in_progress waiting pending; do
              live=$(gh api "repos/$REPO/actions/workflows/work-router.yml/runs?status=$status&per_page=100" \
                --jq "[.workflow_runs[] | select(.display_title == \"Working (Merge Gate): PR #${pr}\")] | length" 2>/dev/null || echo 0)
              [ "${live:-0}" -eq 0 ] || return 0
            done
            return 1
          }

          # Stale reservation sweep. Labelling ten issues at once labels all ten immediately,
          # because authorize-bot-work is keyed per issue, while implement-global lets exactly
          # one run at a time. A queued run that is cancelled therefore leaves its issue
          # carrying bot-working with no run and no pull request: parked, invisible, and not
          # re-triggerable, because classify refuses an issue that is already reserved.
          gh issue list --repo "$REPO" --label bot-working --state open --limit 100 \
            --json number --jq '.[].number' |
            while IFS= read -r issue; do
              [ -n "$issue" ] || continue

              live=$(gh api "repos/$REPO/actions/runs?per_page=100" \
                --jq "[.workflow_runs[]
                  | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\")
                  | select((.display_title + \" \") | test(\"#${issue}[^0-9]\"))] | length")
              [ "${live:-0}" -eq 0 ] || continue

              has_pr=$(gh pr list --repo "$REPO" --state open --json body \
                --jq "[.[] | select(((.body // \"\") + \" \") | ascii_downcase | test(\"clos(e|es|ed) #${issue}[^0-9]|fix(es|ed)? #${issue}[^0-9]|resolves? #${issue}[^0-9]\"))] | length")
              [ "${has_pr:-0}" -eq 0 ] || continue

              echo "Clearing a stale bot-working reservation on #$issue: no run, no pull request."
              gh issue edit "$issue" --repo "$REPO" --remove-label bot-working
            done

          gh api "repos/$REPO/pulls?state=open&per_page=100" |
            jq -r --arg repo "$REPO" '
              .[]
              | select(
                    # Bind the login first. Inside index(...) the input is the array, so a bare
                    # .user.login there indexes the array and jq dies with "Cannot index array
                    # with string \"user\"", taking the whole hourly belt with it.
                    ((.user.login) as $login | (env.TRUSTED_BOTS | split(" ")) | index($login) != null)
                    and .draft == false
                    and .head.repo.full_name == $repo
                 )
              | [.number, .head.ref, .head.sha] | @tsv
            ' |
            while IFS=$'\t' read -r pr_number branch head_sha; do
              gh api "repos/$REPO/actions/runs?status=action_required&branch=$branch" \
                --jq '.workflow_runs[]
                  | select(
                      .event == "pull_request"
                      and .name == env.CI_WORKFLOW_NAME
                    )
                  | .id' |
                while IFS= read -r run_id; do
                  echo "Approving trusted bot run $run_id"
                  gh api "repos/$REPO/actions/runs/$run_id/approve" --method POST
                done

              ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100" \
                --jq '[.workflow_runs[]
                  | select(
                      .name == env.CI_WORKFLOW_NAME
                      and .event == "pull_request"
                      and .status == "completed"
                      and (.conclusion == "success" or .conclusion == "failure")
                    )
                  ] | sort_by(.created_at) | last // empty | [.id, .conclusion, .updated_at] | @tsv')
              if [ -z "$ci" ]; then
                # A conflicting pull request has no merge ref for GitHub to build, so a
                # `pull_request` CI workflow can never run on that head: refs/pull/N/merge is a
                # 404 for as long as the conflict lasts. Waiting for a verdict that cannot arrive
                # deadlocks the belt, because resolving the conflict is the gate's own job. Fall
                # back to the branch's last verdict so the gate runs; it stays on the remediation
                # path and cannot merge on a stale conclusion.
                mergeable_now=$(mergeable_state "$pr_number")
                if [ "$mergeable_now" = "CONFLICTING" ]; then
                  ci=$(gh api "repos/$REPO/actions/runs?branch=$branch&per_page=100" \
                    --jq '[.workflow_runs[]
                      | select(
                          .name == env.CI_WORKFLOW_NAME
                          and .event == "pull_request"
                          and .status == "completed"
                          and (.conclusion == "success" or .conclusion == "failure")
                        )
                      ] | sort_by(.created_at) | last // empty | [.id, .conclusion, .updated_at] | @tsv')
                fi
                if [ -z "$ci" ]; then
                  echo "::warning::PR #$pr_number head $head_sha has no completed $CI_WORKFLOW_NAME run; the belt cannot gate it until CI runs."
                  continue
                fi
                echo "PR #$pr_number conflicts, so CI cannot run on $head_sha at all; gating on the branch's last verdict."
              fi

              IFS=$'\t' read -r ci_run_id ci_conclusion ci_finished <<<"$ci"

              # A verdict is a comment carrying BOTH the gate marker and a `**Verdict:**`
              # line; progress comments and failed attempts deliberately carry neither
              # matching pair, so a crashed or OOM-killed gate never masks a PR from
              # later sweeps. A recorded verdict only counts when it is NEWER than the
              # latest CI run; the old existence check made the gate one-shot per PR.
              # Attempts are failed gates (the attempt marker) since this CI verdict.
              latest_verdict=$(gh api "repos/$REPO/issues/$pr_number/comments?per_page=100" \
                --jq '[.[] | select((.body | contains("<!-- agent-merge-gate -->")) and (.body | contains("**Verdict:**"))) | .created_at] | max // empty')
              linked_issue=$(gh pr view "$pr_number" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty' 2>/dev/null || true)
              if [ -n "$linked_issue" ]; then
                issue_verdict=$(gh api "repos/$REPO/issues/$linked_issue/comments?per_page=100" \
                  --jq '[.[] | select((.body | contains("<!-- agent-merge-gate -->")) and (.body | contains("**Verdict:**"))) | .created_at] | max // empty')
                if [ -n "$issue_verdict" ] && { [ -z "$latest_verdict" ] || [ "$issue_verdict" \> "$latest_verdict" ]; }; then
                  latest_verdict="$issue_verdict"
                fi
              fi
              # A verdict parks the CODE it was given on, not the CI run that prompted it. This
              # used to compare against the CI finish time, which made the park worthless: any
              # later CI run on the same commits -- a re-run, a nightly, a rebuild triggered by
              # main moving -- was newer than the verdict, so the belt re-dispatched a pull
              # request a human had already been handed, and the attempt counter below reset to
              # zero at the same time and handed it a fresh budget of six full gate runs.
              # Lyceum PR #13 sat parked by a `review` verdict for six days while this happened.
              #
              # The newest commit on the branch is the right key. A gate verdict newer than it
              # applies to the current head, so the park holds however often CI runs. Push a
              # commit -- which is what apply-review and a `remediated` verdict both do -- and
              # the head moves past the verdict and the gate decides again, which is correct:
              # that is new code nobody has ruled on.
              head_committed=$(gh pr view "$pr_number" --repo "$REPO" \
                --json commits --jq '[.commits[].committedDate] | max // empty' 2>/dev/null || true)
              verdict_horizon="${head_committed:-$ci_finished}"
              if [ -n "$latest_verdict" ] && [ "$latest_verdict" \> "$verdict_horizon" ]; then
                echo "PR #$pr_number: gate verdict ($latest_verdict) is newer than its head commit ($verdict_horizon); the park holds, skipping"
                continue
              fi

              attempts=$(gh api "repos/$REPO/issues/$pr_number/comments?per_page=100" \
                --jq '[.[] | select(.body | contains("<!-- agent-merge-gate-attempt -->")) | select(.created_at > "'"$verdict_horizon"'") ] | length')
              if [ -n "$linked_issue" ]; then
                issue_attempts=$(gh api "repos/$REPO/issues/$linked_issue/comments?per_page=100" \
                  --jq '[.[] | select(.body | contains("<!-- agent-merge-gate-attempt -->")) | select(.created_at > "'"$verdict_horizon"'") ] | length')
                attempts=$((attempts + issue_attempts))
              fi
              if [ "$attempts" -ge "$MAX_GATE_ATTEMPTS" ]; then
                echo "PR #$pr_number already consumed $attempts gate attempts on this head, parking for review"
                continue
              fi
              if gate_is_live "$pr_number"; then
                echo "PR #$pr_number: a merge-gate run is already live; not dispatching another."
                continue
              fi

              echo "Dispatching Merge Gate for PR #$pr_number ($ci_conclusion, run $ci_run_id, attempt $((attempts + 1)) of $MAX_GATE_ATTEMPTS)"
              gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" \
                --method POST \
                -f ref="$DEFAULT_BRANCH" \
                -f "inputs[operation]=merge-gate" \
                -f "inputs[pr-number]=$pr_number" \
                -f "inputs[ci-conclusion]=$ci_conclusion" \
                -f "inputs[ci-run-id]=$ci_run_id" \
                -f "inputs[attempts_so_far]=$attempts"

              # Every eligible pull request in one tick. The belt queues them first in, first out
              # (`queue: max` on call-merge-gate); before it did, each dispatch cancelled the one
              # pending ahead of it, so this loop stopped after one and the rest waited an hour.
            done

  audit-close:
    needs: classify
    if: needs.classify.outputs.route == 'audit-close'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 15
    concurrency:
      group: audit-close
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      # It reads the open pull requests before closing a report, so a report whose
      # implement workers are still in review is left alone. Without this the list
      # call answers 403 and the nightly job fails having closed nothing.
      pull-requests: read
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/audit-close
        with:
          token: ${{ github.token }}
          stale-after-days: ${{ env.AUDIT_STALE_AFTER_DAYS }}

  cleanup-artifacts:
    needs: classify
    if: needs.classify.outputs.route == 'cleanup-artifacts' && !github.event.repository.fork
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 15
    concurrency:
      group: cleanup-artifacts
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cleanup-artifacts
        with:
          token: ${{ github.token }}
          artifact-retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}

  # The janitor. Deterministic, no model: it retries work the machine stalled on, clears the state
  # a dead run stranded, deletes branches whose pull request is finished, and keeps one issue
  # listing what genuinely needs a person.
  housekeeping:
    needs: classify
    if: needs.classify.outputs.route == 'housekeeping' && !github.event.repository.fork
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 15
    concurrency:
      group: housekeeping
      cancel-in-progress: false
    permissions:
      # contents: write deletes branches whose pull request is closed or merged.
      contents: write
      issues: write
      pull-requests: read
      # actions: write cancels workflow runs stuck pending in the fleet queue.
      actions: write
    env:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A retry is a workflow_dispatch, and GitHub refuses to start a workflow run from an event
      # raised with GITHUB_TOKEN. With the default token every retry would report success and do
      # nothing, which is the exact failure mode this job exists to remove.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: ./.github/actions/housekeeping
        with:
          token: ${{ steps.app-token.outputs.token }}
          retry-after-hours: ${{ env.HOUSEKEEPING_RETRY_AFTER_HOURS }}
          max-retries: ${{ env.HOUSEKEEPING_MAX_RETRIES }}
          stale-pr-days: ${{ env.HOUSEKEEPING_STALE_PR_DAYS }}
          digest-title: ${{ env.HOUSEKEEPING_DIGEST_TITLE }}
          dry-run: ${{ github.event.inputs.dry-run || 'false' }}

  validate:
    needs: classify
    if: needs.classify.outputs.route == 'validate'
    runs-on: [agents-aw, "affinity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-route-matrix
      - uses: ./.github/actions/verify-composite-actions
