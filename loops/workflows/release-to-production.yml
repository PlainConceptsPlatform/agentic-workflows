# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/release-to-production.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: Release to production
# The one button for a production release, run from the repository's Actions tab (or the badge in
# its README): Run workflow, then Run workflow again. It starts the release route with the bump
# chosen here and asks for a deploy: the release worker opens the `chore(release): vX.Y.Z` pull
# request carrying a deploy marker, it auto-merges, release-tag.yml tags it, and because of the
# marker starts DEPLOY_WORKFLOW on the new tag, which ships to production. A `pro` environment with
# required reviewers still asks a person before the production stage runs.
#
# The release route on its own (Main Work Router, operation=release) is unchanged: it tags and
# publishes a release without deploying anything.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: minor
        options:
          - minor
          - patch
          - major

permissions:
  actions: write
  contents: read

concurrency:
  group: release-to-production
  cancel-in-progress: false

jobs:
  start:
    name: Start the release
    # AGENTIC_WORKFLOWS_DISABLED, a repository variable with any value, turns the automation off.
    if: vars.AGENTIC_WORKFLOWS_DISABLED == ''
    runs-on: agents-arc
    timeout-minutes: 5
    steps:
      - name: Dispatch the release route with a deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          gh workflow run work-router.yml --repo "$REPO" --ref "$REF" \
            -f operation=release -f version-bump="$BUMP" -f deploy=true
          {
            echo "### Release started ($BUMP)"
            echo
            echo "The release worker opens a \`chore(release)\` pull request that merges by itself; the new tag then deploys to production."
            echo "Follow it in [Main Work Router](${GITHUB_SERVER_URL}/${REPO}/actions/workflows/work-router.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
