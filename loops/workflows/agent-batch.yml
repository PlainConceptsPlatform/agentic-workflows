# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/agent-batch.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "Agent: Batch Implement"

on:
  workflow_call:
    inputs:
      issue-number:
        description: "Master issue number carrying the feature label"
        required: true
        type: string
      start-from:
        description: "Deprecated; durable completion markers control resume"
        required: false
        type: string
        default: ""
    secrets:
      BOT_APP_ID:
        description: "GitHub App client ID for bot operations"
        required: true
      BOT_PRIVATE_KEY:
        description: "GitHub App private key for bot operations"
        required: true

env:
  WORKING_LABEL: bot-working
  FEATURE_LABEL: feature

permissions:
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        shell: bash
        run: |
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"

      - name: Prepare installation token helper
        run: |
          set -euo pipefail
          cat > /tmp/mint-token.sh <<'HELPER'
          # Installation tokens last one hour; a batch outlives the token it started with.
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }

          mint_token() {
            local now header payload unsigned sig jwt install_id keyfile
            now=$(date +%s)
            header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
            payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' \
              "$((now - 60))" "$((now + 540))" "$APP_ID" | b64url)
            unsigned="${header}.${payload}"

            keyfile=$(umask 077 && mktemp)
            printf '%s' "$APP_PRIVATE_KEY" > "$keyfile"
            echo >> "$keyfile"
            sig=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$keyfile" -binary | b64url)
            rm -f "$keyfile"
            jwt="${unsigned}.${sig}"

            install_id=$(curl -sS \
              -H "Authorization: Bearer ${jwt}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${REPO}/installation" | jq -r '.id')
            GH_TOKEN=$(curl -sS -X POST \
              -H "Authorization: Bearer ${jwt}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/app/installations/${install_id}/access_tokens" | jq -r '.token')

            [ -n "$GH_TOKEN" ] && [ "$GH_TOKEN" != "null" ] || return 1
            echo "::add-mask::${GH_TOKEN}"
            export GH_TOKEN
          }
          HELPER
          bash -n /tmp/mint-token.sh

      - name: Freeze manifest and create draft pull request
        id: setup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          MASTER_ISSUE: ${{ inputs.issue-number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          labels=$(gh issue view "$MASTER_ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name]')
          jq -e --arg label "$FEATURE_LABEL" 'index($label)' >/dev/null <<<"$labels" || {
            echo "::error::Master issue #$MASTER_ISSUE does not carry $FEATURE_LABEL"
            exit 1
          }

          marker="<!-- agent-batch-state:v1 master=${MASTER_ISSUE} -->"
          comment_id=$(gh api --paginate "repos/$REPO/issues/$MASTER_ISSUE/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"platform-devbox\" or .user.login == \"platform-devbox[bot]\" or .user.login == \"github-actions\" or .user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)

          if [ -n "$comment_id" ]; then
            state_body=$(gh api "repos/$REPO/issues/comments/$comment_id" --jq '.body')
            issues_csv=$(sed -n 's/^<!-- issues:\([0-9,]*\) -->$/\1/p' <<<"$state_body")
            [ -n "$issues_csv" ] || {
              echo "::error::Existing batch state has no frozen manifest"
              exit 1
            }
            tr ',' '\n' <<<"$issues_csv" > /tmp/batch-issues.txt
          else
            body=$(gh issue view "$MASTER_ISSUE" --repo "$REPO" --json body --jq '.body')
            printf '%s' "$body" | grep -oE '#[0-9]+' | tr -d '#' | \
              sort -n -u | grep -v "^${MASTER_ISSUE}$" > /tmp/batch-issues.txt || true
            [ -s /tmp/batch-issues.txt ] || {
              echo "::error::Master issue #$MASTER_ISSUE contains no child issue references"
              exit 1
            }
            issues_csv=$(paste -sd, /tmp/batch-issues.txt)
          fi

          while IFS= read -r issue; do
            gh issue view "$issue" --repo "$REPO" --json number >/dev/null
          done < /tmp/batch-issues.txt

          branch="bot/batch-${MASTER_ISSUE}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch" "origin/$DEFAULT_BRANCH"
            git commit --allow-empty -m "chore: initialize batch branch for #${MASTER_ISSUE}"
            git push origin "$branch"
          fi

          pr_body="<!-- agent-batch-pr master=${MASTER_ISSUE} -->
          Batch implementation of #${MASTER_ISSUE}.

          Child issues implemented sequentially by this batch:"
          while IFS= read -r issue; do
            pr_body="${pr_body}
          - #${issue}"
          done < /tmp/batch-issues.txt

          pr_number=$(gh pr list --repo "$REPO" --state open --head "$branch" \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            closed_pr=$(gh pr list --repo "$REPO" --state closed --head "$branch" --limit 1 \
              --json number,mergedAt --jq 'map(select(.mergedAt == null))[0].number // empty')
            if [ -n "$closed_pr" ] && gh pr reopen "$closed_pr" --repo "$REPO" 2>/dev/null; then
              pr_number=$closed_pr
            else
              pr_url=$(gh pr create --repo "$REPO" --title "[bot] Batch implement #${MASTER_ISSUE}" \
                --body "$pr_body" --head "$branch" --base "$DEFAULT_BRANCH" --draft)
              pr_number=${pr_url##*/}
            fi
          fi
          gh api "repos/$REPO/pulls/$pr_number" --method PATCH -f body="$pr_body" >/dev/null

          progress="${marker}
          <!-- issues:${issues_csv} -->
          ## Batch progress

          Draft PR: #${pr_number}

          | Issue | Status |
          |---|---|"
          while IFS= read -r issue; do
            progress="${progress}
          | #${issue} | Queued |"
          done < /tmp/batch-issues.txt

          if [ -n "$comment_id" ]; then
            gh api "repos/$REPO/issues/comments/$comment_id" --method PATCH -f body="$progress" >/dev/null
          else
            comment_id=$(gh api "repos/$REPO/issues/$MASTER_ISSUE/comments" --method POST \
              -f body="$progress" --jq '.id')
          fi

          count=$(wc -l < /tmp/batch-issues.txt | tr -d ' ')
          {
            echo "issue-count=$count"
            echo "branch=$branch"
            echo "pr-number=$pr_number"
            echo "comment-id=$comment_id"
          } >> "$GITHUB_OUTPUT"

      - name: Implement each child sequentially
        id: implement
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MASTER_ISSUE: ${{ inputs.issue-number }}
          BRANCH: ${{ steps.setup.outputs.branch }}
          PR_NUMBER: ${{ steps.setup.outputs.pr-number }}
          COMMENT_ID: ${{ steps.setup.outputs.comment-id }}
          APP_ID: ${{ secrets.BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          batch_start=$(date +%s)
          failed=""
          . /tmp/mint-token.sh

          set_status() {
            local issue="$1" status="$2" body
            body=$(gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq '.body')
            body=$(sed -E "s/^\| #${issue} \| [^|]* \|$/| #${issue} | ${status} |/" <<<"$body")
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" --method PATCH -f body="$body" >/dev/null
          }

          completion_sha() {
            local issue="$1" context="${2:-}" marker
            marker="<!-- agent-batch-child context=${MASTER_ISSUE}:${PR_NUMBER}:"
            if [ -n "$context" ]; then
              marker="<!-- agent-batch-child context=${context} "
            fi
            gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"platform-devbox\" or .user.login == \"platform-devbox[bot]\" or .user.login == \"github-actions\" or .user.login == \"github-actions[bot]\") | select(.body | startswith(\"${marker}\")) | (.body | capture(\" sha=(?<sha>[0-9a-f]{40}) \").sha)" | tail -n 1
          }

          verify_ancestor() {
            local sha="$1" head status
            head=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            status=$(gh api "repos/$REPO/compare/${sha}...${head}" --jq '.status')
            [ "$status" = "identical" ] || [ "$status" = "ahead" ]
          }

          while IFS= read -r issue; do
            mint_token || {
              echo "::error::Could not mint an installation token; stopping the batch"
              exit 1
            }
            existing_sha=$(completion_sha "$issue")
            if [ -n "$existing_sha" ] && verify_ancestor "$existing_sha"; then
              state=$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state')
              if [ "$state" != "CLOSED" ]; then
                gh issue close "$issue" --repo "$REPO" --comment "Implemented in batch PR #${PR_NUMBER}."
              fi
              set_status "$issue" "Implemented at ${existing_sha:0:7}"
              continue
            fi

            state=$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state')
            [ "$state" = "OPEN" ] || {
              set_status "$issue" "Blocked: closed without batch commit"
              echo "::warning::Child issue #$issue is closed without a verified batch completion marker"
              failed="${failed}${issue} "
              continue
            }

            elapsed=$(( ($(date +%s) - batch_start) / 60 ))
            if [ "$elapsed" -ge 180 ]; then
              gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" --method POST \
                -f ref="$DEFAULT_BRANCH" -f "inputs[operation]=batch" \
                -f "inputs[issue-number]=$MASTER_ISSUE"
              echo "continued=true" >> "$GITHUB_OUTPUT"
              echo "Batch continuation dispatched before starting child #$issue."
              exit 0
            fi

            child_labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name]')
            if jq -e 'index("implement")' >/dev/null <<<"$child_labels"; then
              gh issue edit "$issue" --repo "$REPO" --remove-label implement
            fi

            set_status "$issue" "In progress"
            expected_head=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            request="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${issue}-$(date +%s)"
            created_after=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            batch_context="${MASTER_ISSUE}:${PR_NUMBER}:${expected_head}:${request}"
            gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" --method POST \
              -f ref="$DEFAULT_BRANCH" \
              -f "inputs[operation]=implement" \
              -f "inputs[issue-number]=$issue" \
              -f "inputs[batch-context]=$batch_context"

            run_id=""
            for _ in $(seq 1 60); do
              run_id=$(gh run list --repo "$REPO" --workflow work-router.yml --event workflow_dispatch \
                --limit 50 --json databaseId,displayTitle,createdAt \
                --jq ".[] | select(.displayTitle == \"Working (Implement): #${issue} [batch:${batch_context}]\") | select(.createdAt >= \"${created_after}\") | .databaseId" | head -n 1)
              [ -n "$run_id" ] && break
              sleep 5
            done
            [ -n "$run_id" ] || {
              set_status "$issue" "Failed: dispatch not found"
              failed="${failed}${issue} "
              continue
            }

            if ! gh run watch "$run_id" --repo "$REPO" --exit-status; then
              set_status "$issue" "Failed: run $run_id"
              failed="${failed}${issue} "
              continue
            fi

            sha=$(completion_sha "$issue" "$batch_context")
            current_head=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            if [ -z "$sha" ] || [ "$sha" = "$expected_head" ] || [ "$sha" != "$current_head" ] || ! verify_ancestor "$sha"; then
              set_status "$issue" "Failed: unverified push"
              echo "::warning::Run $run_id did not produce a verified commit on batch PR #$PR_NUMBER"
              failed="${failed}${issue} "
              continue
            fi

            gh issue close "$issue" --repo "$REPO" --comment "Implemented in batch PR #${PR_NUMBER}."
            set_status "$issue" "Implemented at ${sha:0:7}"

          done < /tmp/batch-issues.txt

          echo "failed=${failed% }" >> "$GITHUB_OUTPUT"

      - name: Publish completed batch and start CI reconciliation
        if: steps.implement.outputs.continued != 'true'
        env:
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MASTER_ISSUE: ${{ inputs.issue-number }}
          BRANCH: ${{ steps.setup.outputs.branch }}
          PR_NUMBER: ${{ steps.setup.outputs.pr-number }}
          COMMENT_ID: ${{ steps.setup.outputs.comment-id }}
          APP_ID: ${{ secrets.BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          . /tmp/mint-token.sh
          mint_token

          head_sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          incomplete=""
          while IFS= read -r issue; do
            sha=$(gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"platform-devbox\" or .user.login == \"platform-devbox[bot]\" or .user.login == \"github-actions\" or .user.login == \"github-actions[bot]\") | select(.body | startswith(\"<!-- agent-batch-child context=${MASTER_ISSUE}:${PR_NUMBER}:\")) | (.body | capture(\" sha=(?<sha>[0-9a-f]{40}) \").sha)" | tail -n 1)
            status=""
            if [ -n "$sha" ]; then
              status=$(gh api "repos/$REPO/compare/${sha}...${head_sha}" --jq '.status' 2>/dev/null || true)
            fi
            state=$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state')
            if [ -z "$sha" ] || { [ "$status" != "identical" ] && [ "$status" != "ahead" ]; } || [ "$state" != "CLOSED" ]; then
              incomplete="${incomplete}#${issue} "
            fi
          done < /tmp/batch-issues.txt

          body=$(gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq '.body')

          if [ -n "$incomplete" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" --method PATCH -f body="${body}

          Batch incomplete. PR #${PR_NUMBER} stays a draft and #${MASTER_ISSUE} stays open.

          Unfinished children: ${incomplete}

          Re-running the batch retries only these; children with a verified commit are skipped." >/dev/null
            echo "::error::Batch incomplete. Unfinished children: ${incomplete}"
            exit 1
          fi

          pr_body="<!-- agent-batch-pr master=${MASTER_ISSUE} -->
          Closes #${MASTER_ISSUE}

          Child issues implemented by this batch:"
          while IFS= read -r issue; do
            pr_body="${pr_body}
          - #${issue}"
          done < /tmp/batch-issues.txt
          gh api "repos/$REPO/pulls/$PR_NUMBER" --method PATCH -f body="$pr_body" >/dev/null

          is_draft=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq '.isDraft')
          [ "$is_draft" = "false" ] || gh pr ready "$PR_NUMBER" --repo "$REPO"

          master_labels=$(gh issue view "$MASTER_ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name]')
          if jq -e --arg label "$WORKING_LABEL" 'index($label)' >/dev/null <<<"$master_labels"; then
            gh issue edit "$MASTER_ISSUE" --repo "$REPO" --remove-label "$WORKING_LABEL"
          fi

          gh api "repos/$REPO/issues/comments/$COMMENT_ID" --method PATCH -f body="${body}

          Batch complete. PR #${PR_NUMBER} is ready; CI and merge-gate reconciliation have started." >/dev/null

          gh api "repos/$REPO/actions/workflows/work-router.yml/dispatches" --method POST \
              -f ref="$DEFAULT_BRANCH" -f "inputs[operation]=reconcile-bot-pr-runs"
