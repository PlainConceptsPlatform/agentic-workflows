<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Fleet</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --blue: #58a6ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    h2 { font-size: 14px; color: var(--muted); font-weight: normal; margin-bottom: 20px; }
    .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      min-width: 120px;
    }
    .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
    .stat.demand .value { color: var(--blue); }
    .stat.queued .value { color: var(--yellow); }
    .stat.running .value { color: var(--green); }
    .stat.vms .value { color: var(--text); }
    .stat .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #1c2128;
    }
    td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #1c2128; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-queued { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .badge-in_progress { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge-state { background: rgba(139,148,158,0.15); color: var(--muted); }
    .repo { font-weight: 500; }
    .repo a, .job a { color: var(--blue); text-decoration: none; }
    .repo a:hover, .job a:hover { text-decoration: underline; }
    .muted { color: var(--muted); }
    .btn-cancel {
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      color: var(--red);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: rgba(248,81,73,0.2); }
    .btn-cancel:disabled { opacity: 0.4; cursor: default; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
    .refresh-info { font-size: 12px; color: var(--muted); }
    .instances { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .repo-pill { display: inline-block; background: rgba(88,166,255,0.1); color: var(--blue); padding: 1px 8px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <div>
      <h1>Agent Fleet Panel</h1>
      <h2>Runner queue &amp; VMs for <code>agents-arc</code></h2>
    </div>
    <div class="refresh-info" id="refreshInfo">loading…</div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="instances" id="instances"></div>

  <table id="jobsTable">
    <thead>
      <tr>
        <th>Status</th>
        <th>Repo</th>
        <th>Job</th>
        <th>Branch</th>
        <th>Age</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="jobsBody">
      <tr><td colspan="6" class="empty">loading…</td></tr>
    </tbody>
  </table>

  <script>
    const REFRESH_MS = 5000;
    let pollTimer = null;

    async function fetchFleet() {
      try {
        const res = await fetch('/api/fleet', { headers: { 'Cache-Control': 'no-cache' } });
        if (res.status === 401) {
          document.getElementById('refreshInfo').textContent = 'unauthenticated — redirecting to login…';
          window.location.href = '/.auth/login/aad';
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('refreshInfo').textContent = `error: ${e.message}`;
      }
    }

    function render(data) {
      // Stats
      const stats = document.getElementById('stats');
      const azCap = data.azure?.capacity ?? '?';
      const azInst = data.azure?.instances?.length ?? '?';
      stats.innerHTML = `
        <div class="stat demand"><div class="label">Demand</div><div class="value">${data.demand}</div><div class="sub">desired ${data.desired} / max ${data.maxVms}</div></div>
        <div class="stat queued"><div class="label">Queued</div><div class="value">${data.queued}</div><div class="sub">waiting for a VM</div></div>
        <div class="stat running"><div class="label">Running</div><div class="value">${data.inProgress}</div><div class="sub">in progress</div></div>
        <div class="stat vms"><div class="label">Azure VMs</div><div class="value">${azInst}</div><div class="sub">capacity ${azCap}</div></div>
      `;

      // Instances detail
      const inst = document.getElementById('instances');
      if (data.azure?.instances) {
        inst.innerHTML = 'Instances: ' + data.azure.instances.map(i =>
          `<span class="repo-pill" title="${i.state}">${i.id}: ${i.state}</span>`
        ).join(' ');
      } else if (data.azure?.error) {
        inst.innerHTML = `<span style="color:var(--red)">Azure: ${data.azure.error}</span>`;
      }

      // Jobs table
      const body = document.getElementById('jobsBody');
      if (!data.jobs || data.jobs.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="empty">No active jobs. The queue is empty.</td></tr>';
      } else {
        // Sort: queued first, then in_progress, then by age descending
        const sorted = [...data.jobs].sort((a, b) => {
          if (a.status !== b.status) return a.status === 'queued' ? -1 : 1;
          return b.ageSeconds - a.ageSeconds;
        });
        body.innerHTML = sorted.map(j => {
          const repoShort = j.repo ? j.repo.split('/')[1] : '—';
          const repoLink = j.repo ? `<a href="https://github.com/${j.repo}" target="_blank">${repoShort}</a>` : repoShort;
          // Show the workflow run's display title (the commit message GitHub shows on the Actions UI)
          // when we have it, with the workflow name as a lighter subline. Fall back to jobName then id.
          const title = j.runTitle || j.jobName || '';
          const subline = j.workflowName ? `<span class="muted" style="font-size:11px"> ${j.workflowName}</span>` : '';
          const jobLink = j.htmlUrl
            ? `<a href="${j.htmlUrl}" target="_blank">${title}</a>${subline ? '<br>' + subline : ''}`
            : (title || j.id);
          const canCancel = j.status === 'queued' || j.status === 'in_progress';
          return `<tr>
            <td><span class="badge badge-${j.status}">${j.status}</span></td>
            <td class="repo">${repoLink}</td>
            <td class="job">${jobLink}</td>
            <td class="muted">${j.branch || '—'}</td>
            <td class="muted">${formatAge(j.ageSeconds)}</td>
            <td><button class="btn-cancel" onclick="cancelJob(${j.id})" ${canCancel ? '' : 'disabled'}>Cancel</button></td>
          </tr>`;
        }).join('');
      }

      // Refresh info
      const ts = new Date(data.timestamp).toLocaleTimeString();
      const reuse = data.reuse;
      document.getElementById('refreshInfo').innerHTML =
        `updated ${ts} · auto-refresh ${REFRESH_MS/1000}s · user <strong>${data.user}</strong> · reuse ${reuse.vmsRetired} VMs / ${reuse.jobsServed} jobs (${reuse.jobsPerVm}/VM)`;
    }

    function formatAge(s) {
      if (s < 60) return `${Math.round(s)}s`;
      if (s < 3600) return `${Math.round(s/60)}m`;
      return `${(s/3600).toFixed(1)}h`;
    }

    async function cancelJob(id) {
      if (!confirm(`Cancel job ${id}? This calls the GitHub cancel API.`)) return;
      try {
        const res = await fetch(`/api/cancel/${id}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) {
          alert(`Cancel failed: ${data.error || res.status}`);
        } else {
          fetchFleet(); // immediately refresh
        }
      } catch (e) {
        alert(`Cancel failed: ${e.message}`);
      }
    }

    // Initial fetch + poll
    fetchFleet();
    pollTimer = setInterval(fetchFleet, REFRESH_MS);
  </script>
</body>
</html>
