#cloud-config
package_update: true
packages: [git, jq, curl, unzip, apt-transport-https, ca-certificates, gnupg]
write_files:
  - path: /opt/runner/setup.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Ephemeral GitHub runner host bootstrap. The scaler delivers a JIT config via
      # az vmss run-command after boot; this script only prepares the environment.
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli.gpg
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      apt-get update -qq
      apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin gh >/dev/null
      useradd -m -s /bin/bash runner || true
      usermod -aG docker runner
      mkdir -p /opt/actions-runner && cd /opt/actions-runner
      RUNNER_VERSION=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | tr -d v)
      curl -fsSL -o runner.tgz "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
      tar xzf runner.tgz && rm runner.tgz
      ./bin/installdependencies.sh >/dev/null 2>&1 || true
      chown -R runner:runner /opt/actions-runner
      touch /opt/runner/.ready
runcmd:
  - [bash, /opt/runner/setup.sh]
