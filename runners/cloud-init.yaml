#cloud-config
#
# The heavy provisioning (apt packages, docker, gh, az, trivy, actions runner,
# ripgrep, RTK, agentmemory, codegraph, openspec, .NET SDK, pnpm) is baked into
# the custom gallery image by Packer (see build-image.pkr.hcl / provision-image.sh).
#
# Boot time: ~30-60s (Azure cold start + minimal cloud-init) vs ~3 min before.
# Tunables (FIRST_WAIT, IDLE_LIMIT, MAX_JOBS, DISK_LIMIT, the timeouts) can be
# overridden via /etc/runner-scaler.env.
# Image + customData must move together; rollback swaps BOTH.
package_update: false
packages: []
write_files:
  - path: /etc/runner-scaler.env
    permissions: "0600"
    content: |
      SCALER_URL=https://agentrunner-scaler-01.azurewebsites.net
      VM_TOKEN=__VM_TOKEN__
  - path: /opt/runner/job.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      # Serve jobs one at a time, with a hard timeout on every blocking step. A wedged
      # Docker daemon used to hang reset_state forever, leaving a "zombie" VM that held a
      # workflow lease and could not be cancelled (the overnight incident). Nothing here
      # may block the loop indefinitely: docker/curl/systemctl/pkill all go through
      # run_with_timeout, run.sh is bounded in two phases, and a reset that cannot recover
      # Docker retires the VM as unhealthy. An independent heartbeat process (see
      # heartbeat.sh) reports liveness and phase to the scaler.
      set -u
      . /etc/runner-scaler.env

      FIRST_WAIT=${FIRST_WAIT:-120}          # a VM that boots into no work dies quickly
      IDLE_LIMIT=${IDLE_LIMIT:-300}          # after real work, stay warm this long for the next stage
      MAX_JOBS=${MAX_JOBS:-100}              # bound state and disk growth on a long-lived instance
      DISK_LIMIT=${DISK_LIMIT:-85}           # percent used on / before refusing more work
      CMD_TIMEOUT=${CMD_TIMEOUT:-60}         # ceiling for any single external command
      RUNNER_START_TIMEOUT=${RUNNER_START_TIMEOUT:-300}  # wait for a job to be assigned
      RUNNER_JOB_TIMEOUT=${RUNNER_JOB_TIMEOUT:-5400}     # hard cap on one job (90 min)
      RESET_TIMEOUT=${RESET_TIMEOUT:-120}    # whole reset_state budget

      STATE_FILE=/run/runner.state
      GEN=0
      UNHEALTHY=false

      # Publish the current phase for the independent heartbeat process to report.
      set_state() {
        printf 'state=%s gen=%s\n' "$1" "$GEN" > "$STATE_FILE" 2>/dev/null || true
      }

      # Every external command goes through this so none can block the loop forever.
      run_with_timeout() {
        local secs="$1"; shift
        timeout --signal=KILL "$secs" "$@"
      }

      # The image bakes /opt/runner/.ready during provisioning, but a generalized image may
      # not preserve the marker. Recreate if absent.
      [ -f /opt/runner/.ready ] || touch /opt/runner/.ready

      NAME=$(run_with_timeout 15 curl -s -H Metadata:true "http://169.254.169.254/metadata/instance/compute/name?api-version=2021-02-01&format=text" || true)
      ID=${NAME##*_}

      # awf names its containers fixed (awf-agent, awf-squid, awf-api-proxy, awmg-mcpg), so a
      # leftover from the previous job would collide by name. Reset Docker between jobs, but
      # bound every call: if the daemon does not answer, restart it once, and if it still does
      # not, declare the VM unhealthy so it is retired instead of reused.
      reset_state() {
        run_with_timeout "$CMD_TIMEOUT" bash -c 'docker ps -aq --filter "name=^awf-" --filter "name=^awmg-" | xargs -r docker rm -f' >/dev/null 2>&1 || true
        run_with_timeout "$CMD_TIMEOUT" docker container prune -f >/dev/null 2>&1 || true
        run_with_timeout "$CMD_TIMEOUT" docker volume prune -f >/dev/null 2>&1 || true
        run_with_timeout "$CMD_TIMEOUT" docker network prune -f >/dev/null 2>&1 || true
        if ! run_with_timeout "$CMD_TIMEOUT" docker info >/dev/null 2>&1; then
          echo "docker unresponsive after reset; restarting daemon"
          run_with_timeout 90 systemctl restart docker >/dev/null 2>&1 || true
          run_with_timeout "$CMD_TIMEOUT" docker info >/dev/null 2>&1 || return 1
        fi
        # The agent runs opencode on the host (awf chroot mode), so a job killed mid-run can
        # leave a hung opencode and its awf/flock siblings holding /tmp/agentic-awf.lock and
        # blocking every later job on this VM. Kill them before the next job starts.
        run_with_timeout 20 pkill -9 -u runner -f 'awf-bundle' 2>/dev/null || true
        run_with_timeout 20 pkill -9 -u runner -f 'opencode run' 2>/dev/null || true
        rm -f /tmp/agentic-awf.lock 2>/dev/null || true
        run_with_timeout 30 bash -c 'rm -rf /tmp/gh-aw-* /tmp/gh-aw /tmp/opencode-data-*' 2>/dev/null || true
        run_with_timeout 30 rm -rf /home/runner/.azure 2>/dev/null || true
        # A later job must find a pristine workspace; a half-cleaned checkout made
        # actions/checkout die with exit 128. The toolcache survives.
        run_with_timeout 60 bash -c 'find /opt/actions-runner/_work -mindepth 1 -maxdepth 1 ! -name _tool -exec rm -rf {} +' 2>/dev/null || true
        return 0
      }

      # Start one JIT runner and wait for its single job. Phase 1 bounds the wait for a job
      # to be assigned (a JIT whose job vanished would otherwise wait forever); phase 2
      # bounds the job itself.
      run_job() {
        local jit="$1" log=/tmp/runner.out pid deadline started=0 t0=$SECONDS
        : > "$log"
        ( cd /opt/actions-runner && exec sudo -u runner ./run.sh --jitconfig "$jit" ) >>"$log" 2>&1 &
        pid=$!
        deadline=$((SECONDS + RUNNER_START_TIMEOUT))
        while kill -0 "$pid" 2>/dev/null; do
          if grep -q 'Running job:' "$log" 2>/dev/null; then started=1; set_state runner-running; break; fi
          [ "$SECONDS" -ge "$deadline" ] && break
          sleep 2
        done
        echo "runner registration: $((SECONDS - t0))s"
        if [ "$started" -eq 0 ]; then
          if kill -0 "$pid" 2>/dev/null; then
            echo "no job assigned within ${RUNNER_START_TIMEOUT}s; killing runner"
            kill -9 "$pid" 2>/dev/null || true
            run_with_timeout 20 pkill -9 -u runner -f 'Runner.Worker' 2>/dev/null || true
            run_with_timeout 20 pkill -9 -u runner -f 'Runner.Listener' 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            return 3
          fi
          wait "$pid"; return $?
        fi
        deadline=$((SECONDS + RUNNER_JOB_TIMEOUT))
        while kill -0 "$pid" 2>/dev/null; do
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "job exceeded ${RUNNER_JOB_TIMEOUT}s; killing"
            kill -9 "$pid" 2>/dev/null || true
            run_with_timeout 20 pkill -9 -u runner -f 'Runner.Worker' 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            return 4
          fi
          sleep 5
        done
        echo "job wall time: $((SECONDS - t0))s"
        wait "$pid"; return $?
      }

      JOBS_RUN=0
      LAST_WORK=$(date +%s)

      while true; do
        set_state requesting-jit
        USED=$(run_with_timeout 20 df --output=pcent / 2>/dev/null | tail -1 | tr -dc '0-9')
        if [ "${USED:-0}" -ge "$DISK_LIMIT" ]; then
          echo "disk ${USED}% >= ${DISK_LIMIT}%, retiring"
          break
        fi

        # Ask for work. The scaler answers 200 (a JIT follows), 202 (this VM holds a
        # workflow lease but the run's next job is not runnable yet — hold WITHOUT counting
        # it as idle), 204 (nothing to do), or 409 (this VM lost the lease to another VM:
        # retire). The X-Lease-Generation header carries the fencing token we send back.
        CODE=000
        tj=$SECONDS
        for attempt in 1 2 3 4 5; do
          CODE=$(run_with_timeout 60 curl -sS -o /tmp/jit.out -D /tmp/jit.hdr -w "%{http_code}" -X POST "$SCALER_URL/vm/jit" \
            -H "Authorization: Bearer $VM_TOKEN" -H "X-Lease-Generation: $GEN" -H "Content-Type: application/json" \
            -d "{\"instanceId\":\"$ID\"}" 2>/dev/null || echo 000)
          case "$CODE" in 200|202|204|409) break ;; esac
          echo "jit attempt $attempt got http $CODE; backing off $(($attempt * 10))s"
          sleep $(($attempt * 10))
        done
        echo "jit request: $((SECONDS - tj))s (http $CODE)"

        newgen=$(grep -i '^x-lease-generation:' /tmp/jit.hdr 2>/dev/null | tr -dc '0-9')
        [ -n "$newgen" ] && GEN=$newgen

        if [ "$CODE" = "409" ]; then echo "lease generation lost (409); retiring"; break; fi
        if [ "$CODE" = "202" ]; then LAST_WORK=$(date +%s); sleep 15; continue; fi

        if [ "$CODE" = "200" ]; then
          set_state runner-starting
          run_job "$(cat /tmp/jit.out)"; rc=$?
          set_state resetting
          tr=$SECONDS
          if ! reset_state; then echo "reset failed; marking unhealthy"; UNHEALTHY=true; break; fi
          echo "reset_state: $((SECONDS - tr))s"
          JOBS_RUN=$((JOBS_RUN + 1))
          LAST_WORK=$(date +%s)
          echo "completed job $JOBS_RUN (rc=$rc)"
          [ "$JOBS_RUN" -ge "$MAX_JOBS" ] && { echo "reached MAX_JOBS, retiring"; break; }
          continue
        fi

        set_state idle
        NOW=$(date +%s)
        WAITED=$((NOW - LAST_WORK))
        if [ "$JOBS_RUN" -eq 0 ]; then LIMIT=$FIRST_WAIT; else LIMIT=$IDLE_LIMIT; fi
        if [ "$WAITED" -ge "$LIMIT" ]; then
          echo "idle ${WAITED}s after $JOBS_RUN job(s), retiring"
          break
        fi
        sleep 15
      done

      set_state retiring
      RAN=false
      [ "$JOBS_RUN" -gt 0 ] && RAN=true
      run_with_timeout 60 curl -fsS -X POST "$SCALER_URL/vm/done" \
        -H "Authorization: Bearer $VM_TOKEN" -H "X-Lease-Generation: $GEN" -H "Content-Type: application/json" \
        -d "{\"instanceId\":\"$ID\",\"ranJob\":$RAN,\"jobsRun\":$JOBS_RUN,\"unhealthy\":$UNHEALTHY}" || true
  - path: /opt/runner/heartbeat.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      # Independent liveness reporter. Runs as its own service, so a job.sh hung in
      # reset_state cannot silence it: the scaler still sees the VM, and its phase
      # ("resetting"), and can time that phase out. Reports the phase from the state file
      # job.sh writes.
      set -u
      . /etc/runner-scaler.env
      STATE_FILE=/run/runner.state
      NAME=$(timeout 15 curl -s -H Metadata:true "http://169.254.169.254/metadata/instance/compute/name?api-version=2021-02-01&format=text" || true)
      ID=${NAME##*_}
      while true; do
        state=unknown
        gen=0
        if [ -r "$STATE_FILE" ]; then
          state=$(sed -n 's/^state=//p' "$STATE_FILE" 2>/dev/null | head -1)
          gen=$(sed -n 's/^gen=//p' "$STATE_FILE" 2>/dev/null | head -1)
        fi
        timeout 20 curl -sS -o /dev/null -X POST "$SCALER_URL/vm/heartbeat" \
          -H "Authorization: Bearer $VM_TOKEN" -H "Content-Type: application/json" \
          -d "{\"instanceId\":\"$ID\",\"state\":\"${state:-unknown}\",\"generation\":${gen:-0}}" || true
        sleep 30
      done
  - path: /etc/systemd/system/runner-job.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Serve GitHub Actions jobs then request deletion
      After=network-online.target docker.service
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/opt/runner/job.sh
      TimeoutStartSec=infinity
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/runner-heartbeat.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Report VM liveness and phase to the scaler
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=simple
      ExecStart=/opt/runner/heartbeat.sh
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [bash, -c, "set -u; SWAP=/mnt/swapfile; mountpoint /mnt/resource || true; for P in /mnt/azure_resource_disk /mnt/resource /mnt; do [ -d \"$P\" ] && SWAP=\"$P/swapfile\" && break; done; fallocate -l 8G \"$SWAP\" && chmod 600 \"$SWAP\" && mkswap \"$SWAP\" >/dev/null && swapon \"$SWAP\" && echo \"swap enabled at $SWAP ($(swapon --show --noheadings --bytes --output SIZE 2>/dev/null | head -1) bytes)\" || echo 'WARN: swap setup failed'; swapon --show"]
  - [systemctl, enable, --now, --no-block, runner-heartbeat.service]
  - [systemctl, enable, --now, --no-block, runner-job.service]
