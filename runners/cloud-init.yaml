#cloud-config
# Runtime cloud-init for pre-baked runner images.
#
# The heavy provisioning (apt packages, docker, gh, az, trivy, actions runner,
# ripgrep, RTK, agentmemory, codegraph, openspec, .NET SDK, pnpm) is baked into
# the custom gallery image by Packer (see build-image.pkr.hcl / provision-image.sh).
#
# This cloud-init runs only the runtime steps that cannot be baked:
#   1. Create swap (needs the ephemeral disk mounted at boot) – logs a warning if setup fails (never silently zero)
#   2. Drop the VM token (rotated independently)
#   3. Start runner-job.service
#
# Boot time: ~30-60s (Azure cold start + minimal cloud-init) vs ~3 min before.
# Tunables (FIRST_WAIT, IDLE_LIMIT, MAX_JOBS, DISK_LIMIT) can be overridden via /etc/runner-scaler.env.
# Image + customData must move together; rollback swaps BOTH.
package_update: false
packages: []
write_files:
  - path: /etc/runner-scaler.env
    permissions: "0600"
    content: |
      SCALER_URL=https://agentrunner-scaler-01.azurewebsites.net
      VM_TOKEN=__VM_TOKEN__
  - path: /opt/runner/job.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      # Serve jobs one at a time until the queue stays empty, then ask to be deleted.
      # Identical to the pre-baked-image version; kept in cloud-init because it carries
      # tunable constants the VM operator may want to change without rebuilding.
      set -u
      . /etc/runner-scaler.env

        FIRST_WAIT=${FIRST_WAIT:-120}   # a VM that boots into no work at all dies quickly
        IDLE_LIMIT=${IDLE_LIMIT:-300}   # after real work, stay warm this long for the next stage
        MAX_JOBS=${MAX_JOBS:-20}        # bound state and disk growth on a long-lived instance
        DISK_LIMIT=${DISK_LIMIT:-85}    # percent used on / before refusing more work

      # The image bakes /opt/actions-runner/.ready during provisioning, but a
      # generalized image may not preserve the marker. Recreate if absent.
      [ -f /opt/runner/.ready ] || touch /opt/runner/.ready

      NAME=$(curl -s -H Metadata:true "http://169.254.169.254/metadata/instance/compute/name?api-version=2021-02-01&format=text")
      ID=${NAME##*_}
      JOBS_RUN=0
      LAST_WORK=$(date +%s)

      # awf names its containers fixed (awf-agent, awf-squid, awf-api-proxy, awmg-mcpg), so a
      # leftover from the previous job would collide by name. Reset Docker between jobs.
      reset_state() {
        docker ps -aq --filter "name=^awf-" --filter "name=^awmg-" | xargs -r docker rm -f >/dev/null 2>&1
        docker container prune -f >/dev/null 2>&1
        docker volume prune -f >/dev/null 2>&1
        docker network prune -f >/dev/null 2>&1
        rm -rf /tmp/gh-aw-* /tmp/gh-aw /tmp/opencode-data-* 2>/dev/null
        # A later job must find a pristine workspace: a half-cleaned checkout from the
        # previous job made actions/checkout die with exit 128. The toolcache survives,
        # because reinstalling dotnet and node per job is the boot cost all over again.
        find /opt/actions-runner/_work -mindepth 1 -maxdepth 1 ! -name '_tool' -exec rm -rf {} + 2>/dev/null
      }

      while true; do
        USED=$(df --output=pcent / | tail -1 | tr -dc '0-9')
        if [ "${USED:-0}" -ge "$DISK_LIMIT" ]; then
          echo "disk ${USED}% >= ${DISK_LIMIT}%, retiring"
          break
        fi

        JIT=$(curl -fsS -m 60 -X POST "$SCALER_URL/vm/jit" \
          -H "Authorization: Bearer $VM_TOKEN" -H "Content-Type: application/json" \
          -d "{\"instanceId\":\"$ID\"}" || true)

        if [ -n "$JIT" ]; then
          cd /opt/actions-runner
          sudo -u runner ./run.sh --jitconfig "$JIT"
          JOBS_RUN=$((JOBS_RUN + 1))
          LAST_WORK=$(date +%s)
          reset_state
          echo "completed job $JOBS_RUN"
          [ "$JOBS_RUN" -ge "$MAX_JOBS" ] && { echo "reached MAX_JOBS, retiring"; break; }
          continue
        fi

        NOW=$(date +%s)
        WAITED=$((NOW - LAST_WORK))
        if [ "$JOBS_RUN" -eq 0 ]; then
          LIMIT=$FIRST_WAIT
        else
          LIMIT=$IDLE_LIMIT
        fi
        if [ "$WAITED" -ge "$LIMIT" ]; then
          echo "idle ${WAITED}s after $JOBS_RUN job(s), retiring"
          break
        fi
        sleep 15
      done

      RAN=false
      [ "$JOBS_RUN" -gt 0 ] && RAN=true
      curl -fsS -m 60 -X POST "$SCALER_URL/vm/done" \
        -H "Authorization: Bearer $VM_TOKEN" -H "Content-Type: application/json" \
        -d "{\"instanceId\":\"$ID\",\"ranJob\":$RAN,\"jobsRun\":$JOBS_RUN}" || true
  - path: /etc/systemd/system/runner-job.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Serve GitHub Actions jobs then request deletion
      After=network-online.target docker.service
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/opt/runner/job.sh
      TimeoutStartSec=infinity
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [bash, -c, "set -u; SWAP=/mnt/swapfile; mountpoint /mnt/resource || true; for P in /mnt/azure_resource_disk /mnt/resource /mnt; do [ -d \"$P\" ] && SWAP=\"$P/swapfile\" && break; done; fallocate -l 8G \"$SWAP\" && chmod 600 \"$SWAP\" && mkswap \"$SWAP\" >/dev/null && swapon \"$SWAP\" && echo \"swap enabled at $SWAP ($(swapon --show --noheadings --bytes --output SIZE 2>/dev/null | head -1) bytes)\" || echo 'WARN: swap setup failed'; swapon --show"]
  - [systemctl, enable, --now, --no-block, runner-job.service]
