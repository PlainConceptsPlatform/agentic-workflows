name: Pages

# Deploys the docs/ folder to GitHub Pages. The site is pre-built HTML committed by the
# workflow-docs skill (archify-rendered diagrams). No build step runs in CI.

on:
  push:
    branches: [main]
    paths:
      - loops/docs/diagrams.md
      - docs/**
      - skills/workflow-docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: agents-arc
    environment: github-pages
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v3.0.0
        with:
          path: ./docs
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4.0.5
