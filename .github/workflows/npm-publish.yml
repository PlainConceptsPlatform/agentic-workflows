name: Npm Publish

# Publishing rides on GitHub Releases, like GitHub's own starter workflow. A stable release
# (vX.Y.Z on main) publishes with the `latest` dist-tag; a prerelease (vX.Y.Z-alpha.N, created
# on the alpha branch) publishes with the `alpha` dist-tag. There is also a manual path:
# "Run workflow" publishes an alpha of any branch, picking the next unused alpha number itself.
# Pull requests cannot trigger either path.
#
# Authentication uses npm Trusted Publishing (GitHub OIDC). Trusted Publishing requires Node
# >= 22.14.0 and npm >= 11.5.1. Node 24 is used because it satisfies those requirements.
# The Trusted Publisher on npmjs.com must match this workflow's filename and the npm-publish
# environment exactly.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish an alpha from
        required: false
        default: alpha

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: agents-arc
    timeout-minutes: 15
    environment: npm-publish
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.release.tag_name }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The alpha version is the release tag. Stamp it into the CLI manifest before the gate so
      # the packed and published artifact carries it; nothing is committed back to the branch.
      - name: Prepare alpha version
        if: ${{ github.event.release.prerelease }}
        env:
          TARGET_BRANCH: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" != "alpha" ]; then
            echo "::error::Prereleases must be published from the alpha branch, not '$TARGET_BRANCH'."
            exit 1
          fi
          version="${TAG_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "::error::Prerelease tag must look like vX.Y.Z-alpha.N, got '$TAG_NAME'."
            exit 1
          fi
          if npm view "@plainconceptsplatform/workflows@$version" version >/dev/null 2>&1; then
            echo "::error::$version is already on npm; alpha versions are never reused."
            exit 1
          fi
          node -e "const fs = require('node:fs'); const file = 'cli/package.json'; const pkg = JSON.parse(fs.readFileSync(file, 'utf8')); pkg.version = process.argv[1]; fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');" "$version"
          echo "cli/package.json staged at $version for this run (not committed)."

      # Manual path: no release exists, so derive the next unused alpha number from npm and
      # stamp it the same way. The branch's own manifest version is the base.
      - name: Prepare alpha version (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./cli/package.json').version")
          base="${base%%-*}"
          next=1
          for published in $(npm view "@plainconceptsplatform/workflows" versions --json | tr -d ' ",[]' | grep -E "^${base}-alpha\.[0-9]+$" || true); do
            n="${published##*-alpha.}"
            if [ "$n" -ge "$next" ]; then
              next=$((n + 1))
            fi
          done
          version="$base-alpha.$next"
          if npm view "@plainconceptsplatform/workflows@$version" version >/dev/null 2>&1; then
            echo "::error::$version is already on npm; alpha versions are never reused."
            exit 1
          fi
          node -e "const fs = require('node:fs'); const file = 'cli/package.json'; const pkg = JSON.parse(fs.readFileSync(file, 'utf8')); pkg.version = process.argv[1]; fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');" "$version"
          echo "Publishing $version (alpha #$next, auto-numbered). cli/package.json is stamped for this run only, not committed."

      # The same gate CI runs: typecheck, build, test, then package (see pack in package.json).
      - run: pnpm run pack

      # Rerun-safe: a version already on npm means this release was published before, so skip.
      - name: Publish stable
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        env:
          TARGET_BRANCH: ${{ github.event.release.target_commitish }}
        working-directory: cli
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" != "main" ]; then
            echo "::error::Stable releases must target the main branch, not '$TARGET_BRANCH'."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "${TAG_NAME#v}" ]; then
            echo "::error::Release is $TAG_NAME but cli/package.json says $version. Bump both manifests to the release version."
            exit 1
          fi
          if npm view "@plainconceptsplatform/workflows@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public --tag latest
          echo "Published @plainconceptsplatform/workflows@$version with dist-tag latest."

      - name: Publish alpha
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
        working-directory: cli
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm publish --access public --tag alpha
          # The registry can lag a few seconds behind a publish; retry before calling it wrong.
          published=""
          for attempt in 1 2 3 4 5; do
            published=$(npm view "@plainconceptsplatform/workflows" dist-tags.alpha 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              break
            fi
            sleep 6
          done
          if [ "$published" != "$version" ]; then
            echo "::error::npm dist-tag alpha points at '$published', expected '$version'. Check: npm view @plainconceptsplatform/workflows dist-tags"
            exit 1
          fi
          echo "Published @plainconceptsplatform/workflows@$version with dist-tag alpha."
