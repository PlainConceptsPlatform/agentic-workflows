name: Build runner image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Gallery image version (semver, e.g. 1.1.0)"
        required: true
        type: string
      flip_fleet:
        description: "Also flip the live VMSS to the new image (az vmss update)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  # "Notify on failure" opens an issue. With contents: read alone it failed with
  # "Resource not accessible by integration", so a broken build reported nothing.
  issues: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.12.0"

      - name: Init plugins
        working-directory: runners
        run: packer init build-image.pkr.hcl

      - name: Validate template
        working-directory: runners
        env:
          PACKER_VAR_subscription_id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          PACKER_VAR_tenant_id: ${{ secrets.AZ_TENANT_ID }}
          PACKER_VAR_client_id: ${{ secrets.AZ_RUNNER_IMAGE_CLIENT_ID }}
          PACKER_VAR_client_secret: ${{ secrets.AZ_RUNNER_IMAGE_CLIENT_SECRET }}
        run: packer validate build-image.pkr.hcl

      - name: Determine image version
        id: version
        run: |
          if [ -n "${{ inputs.image_version }}" ]; then
            echo "version=${{ inputs.image_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.$(date +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        working-directory: runners
        env:
          PACKER_VAR_subscription_id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          PACKER_VAR_tenant_id: ${{ secrets.AZ_TENANT_ID }}
          PACKER_VAR_client_id: ${{ secrets.AZ_RUNNER_IMAGE_CLIENT_ID }}
          PACKER_VAR_client_secret: ${{ secrets.AZ_RUNNER_IMAGE_CLIENT_SECRET }}
          PACKER_VAR_image_version: ${{ steps.version.outputs.version }}
        run: packer build build-image.pkr.hcl

      - name: Post-publish boot test (CUT-04)
        id: boottest
        env:
          AZ_SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMG="/subscriptions/${AZ_SUBSCRIPTION_ID}/resourceGroups/agentrunner-pro-rg-01/providers/Microsoft.Compute/galleries/agentrunner_gallery_01/images/agents-arc-runner/versions/${VERSION}"
          az login --service-principal -u "${{ secrets.AZ_RUNNER_IMAGE_CLIENT_ID }}" -p "${{ secrets.AZ_RUNNER_IMAGE_CLIENT_SECRET }}" --tenant "${{ secrets.AZ_TENANT_ID }}"
          sed "s/__VM_TOKEN__/boottest-dummy-token/" runners/cloud-init.yaml > /tmp/boottest-cloud-init.yaml
          # The pre-pulled images must survive generalization and be there on a fresh VM, and
          # the bake must leave the root disk well under job.sh's DISK_LIMIT of 85%.
          . runners/versions.env
          checks='test -f /opt/runner/.ready && test -f /etc/runner-scaler.env && docker info >/dev/null 2>&1'
          for image in $GH_AW_IMAGES "$MSSQL_IMAGE" "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"; do
            checks="$checks && docker image inspect $image >/dev/null 2>&1"
          done
          checks="$checks && [ \$(df --output=pcent / | tail -n 1 | tr -dc 0-9) -lt 60 ]"
          script="if $checks; then echo BOOTTEST_PASS; else echo BOOTTEST_WAIT; fi; df -h / | tail -n 1"
          az vm create -g agentrunner-pro-rg-01 -n "vm-boottest-${{ github.run_number }}" \
            --image "$IMG" --size Standard_D4ads_v5 --admin-username azureuser \
            --ssh-key-values ~/.ssh/id_rsa.pub --os-disk-size-gb 64 \
            --custom-data "$(base64 -w0 /tmp/boottest-cloud-init.yaml)" \
            --nic-delete-option Delete --os-disk-delete-option Delete -o none
          ok=0
          for i in $(seq 1 30); do
            sleep 15
            out=$(az vm run-command invoke -g agentrunner-pro-rg-01 -n "vm-boottest-${{ github.run_number }}" \
              --command-id RunShellScript \
              --scripts "$script" \
              --query "value[0].message" -o tsv 2>/dev/null || true)
            echo "[${i}] $out"
            if echo "$out" | grep -q BOOTTEST_PASS; then ok=1; break; fi
          done
          az vm delete -g agentrunner-pro-rg-01 -n "vm-boottest-${{ github.run_number }}" --force --yes --no-wait || true
          [ "$ok" -eq 1 ] || { echo "boot test FAILED after 7.5 min"; exit 1; }
          echo "boot test PASSED"

      - name: Flip live VMSS to the new image
        if: ${{ inputs.flip_fleet == true }}
        env:
          AZ_SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          VM_TOKEN: ${{ secrets.VM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMG="/subscriptions/${AZ_SUBSCRIPTION_ID}/resourceGroups/agentrunner-pro-rg-01/providers/Microsoft.Compute/galleries/agentrunner_gallery_01/images/agents-arc-runner/versions/${VERSION}"
          # Overprovision must be off before fast boots ship (FIX-01)
          az vmss update -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 --set overprovision=false -o none
          # Image and customData MUST move together (CUT-02)
          CAP=$(az vmss show -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 --query sku.capacity -o tsv)
          echo "current capacity: $CAP (not changing it)"
          sed "s/__VM_TOKEN__/${VM_TOKEN}/" runners/cloud-init.yaml > /tmp/live-cloud-init.yaml
          az vmss update -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 \
            --set virtualMachineProfile.storageProfile.imageReference="{\"id\":\"${IMG}\"}" \
            --set virtualMachineProfile.osProfile.customData="$(base64 -w0 /tmp/live-cloud-init.yaml)" \
            --no-wait -o none
          echo "VMSS model updated. Running instances keep the old image (upgradePolicy: Manual). New instances boot the baked image."

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // The label did not exist in this repository, so issues.create failed even once
            // the permission was there. Create it on first use.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'runner-platform',
                color: 'd93f0b',
                description: 'Runner image and fleet',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Runner image build failed: v${{ steps.version.outputs.version }}`,
              body: `The runner image build failed. Check [the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['runner-platform']
            });