name: Build runner image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Gallery image version (semver, e.g. 1.1.0)"
        required: true
        type: string
      flip_fleet:
        description: "Also flip the live VMSS to the new image (az vmss update)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 2 1 * *"  # monthly rebuild, no fleet flip

permissions:
  contents: read
  id-token: write

# The Azure SP authenticates via OIDC federation - no client secret in GitHub.
# Register the fed credential once (from a logged-in az session):
#   az ad app federated-credential create --id <CLIENT_ID> \
#     --name gh-actions-runner-image \
#     --issuer https://token.actions.githubusercontent.com \
#     --subject "PlainConceptsPlatform/Agentic-Workflows:refs/heads/main:workflow:build-runner-image.yml"
# The SP needs Contributor on agentrunner-pro-rg-01 (build VM, gallery, boot test).
env:
  AZ_SUBSCRIPTION_ID: c63519b4-84a6-448c-b0e6-4ebef696b8ff
  AZ_TENANT_ID: 5c384fed-84cc-44a6-b34a-b060bf102a6e
  AZ_CLIENT_ID: 80ddf1bd-53d5-4279-8392-5bd3eb26ece5
  AZ_RG: agentrunner-pro-rg-01

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, for az CLI steps)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenant-id: ${{ env.AZ_TENANT_ID }}
          subscription-id: ${{ env.AZ_SUBSCRIPTION_ID }}

      - name: OIDC env for Packer
        run: |
          set -euo pipefail
          token_response=$(curl -sS -H "Authorization: Bearer $OIDC_REQUEST_TOKEN" "$OIDC_TOKEN_URL")
          echo "ARM_OIDC_TOKEN=$(echo "${token_response}" | jq -r .value)" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ env.AZ_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_ID=${{ env.AZ_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ env.AZ_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"

      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.12.0"

      - name: Init plugins
        working-directory: runners
        run: packer init build-image.pkr.hcl

      - name: Determine image version
        id: version
        run: |
          if [ -n "${{ inputs.image_version }}" ]; then
            echo "version=${{ inputs.image_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.$(date +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        working-directory: runners
        env:
          PACKER_VAR_image_version: ${{ steps.version.outputs.version }}
          PACKER_VAR_use_oidc: "true"
        run: packer build build-image.pkr.hcl

      - name: Post-publish boot test (CUT-04)
        id: boottest
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMG="/subscriptions/${AZ_SUBSCRIPTION_ID}/resourceGroups/agentrunner-pro-rg-01/providers/Microsoft.Compute/galleries/agentrunner_gallery_01/images/agents-arc-runner/versions/${VERSION}"
          sed "s/__VM_TOKEN__/boottest-dummy-token/" runners/cloud-init.yaml > /tmp/boottest-cloud-init.yaml
          az vm create -g agentrunner-pro-rg-01 -n "vm-boottest-${{ github.run_number }}" \
            --image "$IMG" --size Standard_D4ads_v5 --admin-username azureuser \
            --ssh-key-values ~/.ssh/id_rsa.pub --os-disk-size-gb 64 \
            --custom-data "$(base64 -w0 /tmp/boottest-cloud-init.yaml)" \
            --nic-delete-option Delete --os-disk-delete-option Delete -o none
          ok=0
          for i in $(seq 1 30); do
            sleep 15
            out=$(az vm run-command invoke -g agentrunner-pro-rg-01 -n "vm-boottest-${{ github.run_number }}" \
              --command-id RunShellScript \
              --scripts 'test -f /opt/runner/.ready && test -f /etc/runner-scaler.env && docker info >/dev/null 2>&1 && echo BOOTTEST_PASS || echo BOOTTEST_WAIT' \
              --query "value[0].message" -o tsv 2>/dev/null || true)
            echo "[${i}] $out"
            if echo "$out" | grep -q BOOTTEST_PASS; then ok=1; break; fi
          done
          az vm delete -g agentrunner-pro-rg-01 -n "vm-boottest-${{ github.run_number }}" --force --yes --no-wait || true
          [ "$ok" -eq 1 ] || { echo "boot test FAILED after 7.5 min"; exit 1; }
          echo "boot test PASSED"

      - name: Flip live VMSS to the new image
        if: ${{ inputs.flip_fleet == true }}
        env:
          VM_TOKEN: ${{ secrets.VM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMG="/subscriptions/${AZ_SUBSCRIPTION_ID}/resourceGroups/agentrunner-pro-rg-01/providers/Microsoft.Compute/galleries/agentrunner_gallery_01/images/agents-arc-runner/versions/${VERSION}"
          # Overprovision must be off before fast boots ship (FIX-01)
          az vmss update -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 --set overprovision=false -o none
          # Image and customData MUST move together (CUT-02)
          CAP=$(az vmss show -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 --query sku.capacity -o tsv)
          echo "current capacity: $CAP (not changing it)"
          sed "s/__VM_TOKEN__/${VM_TOKEN}/" runners/cloud-init.yaml > /tmp/live-cloud-init.yaml
          az vmss update -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 \
            --set virtualMachineProfile.storageProfile.imageReference="{\"id\":\"${IMG}\"}" \
            --set virtualMachineProfile.osProfile.customData="$(base64 -w0 /tmp/live-cloud-init.yaml)" \
            --no-wait -o none
          # Manual upgrade policy: running instances keep the old image until they
          # are deleted. Re-provision each live instance in place so the fleet is
          # 1.0.2 immediately; future scale-outs boot the new model anyway.
          for id in $(az vmss list-instances -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 --query "[?provisioningState != 'Deleting'].instanceId" -o tsv); do
            az vmss upgrade -g agentrunner-pro-rg-01 -n agentrunner-vmss-01 --instance-ids "$id" --no-wait -o none
          done
          echo "VMSS model updated (image + customData together). Fleet upgraded in place."

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Runner image build failed: v${{ steps.version.outputs.version }}`,
              body: `The scheduled runner image rebuild failed. Check [the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['runner-platform', 'urgent']
            });
