# Smoke test for the ACA Sandboxes runner proof of concept. Dispatch-only: proves a
# GitHub Actions job with Docker steps runs end to end on a sandbox-hosted runner
# (label sbx-poc). Not part of the agentic platform; safe to delete when the
# sandbox evaluation is over.
name: sbx-poc
on:
  workflow_dispatch:
jobs:
  docker-smoke:
    runs-on: sbx-poc
    timeout-minutes: 10
    steps:
      - name: Docker works end to end on this runner
        run: |
          docker info --format 'server={{.ServerVersion}} driver={{.Driver}}'
          docker run --rm hello-world | head -3
          docker network create smoke
          docker run -d --name s1 --network smoke alpine sleep 60
          docker run --rm --network smoke alpine ping -c1 s1 | tail -2
          docker rm -f s1 >/dev/null && docker network rm smoke
          echo SANDBOX-RUNNER-OK
